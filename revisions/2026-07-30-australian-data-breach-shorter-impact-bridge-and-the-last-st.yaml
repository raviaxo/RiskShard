date: '2026-07-30'
title: 'Australian data breach: shorter impact bridge, and the last stale scenario corrected'
decision: docs/adr/README.md
effect: 'The Australian financial-services data-breach shard moved from AVG AUD 138,783 to AUD 6,864,295
  (P95 16,132,680; P99 20,526,979). Two causes: its scenario file was still simulating starter placeholders
  (frequency 0.05/0.2/0.5, impact 100k/400k/2M) rather than the values its calibration produces,
  and impact.likely was reselected.'
reason: 'This was the last of five shards whose published loss range was not generated by the evidence
  displayed beside it. Correcting it alone would have published a mid-market Australian central
  estimate of AUD 10.7M, taken from IBM''s UK financial-services average converted to AUD - a foreign
  jurisdiction stacked on top of an already enterprise-weighted figure. impact.likely was therefore
  reselected to IBM''s global average (USD 4.4M, AUD 6.1M): a trade of industry specificity for
  country distance, chosen because both overstate mid-market and the global figure overstates by
  less without importing a foreign jurisdiction. The shard consequently drops from benchmark_ready
  to needs_evidence with an industry-relevance blocker, which is the honest classification - its
  impact anchor is now explicitly all-industry. With this, every shard simulates the values its
  calibration produces, and the drift check now fails rather than warns.'
