date: '2026-07-30'
title: 'Stale scenarios corrected: three shards now simulate the evidence they display'
decision: docs/internal/NEXT_STEPS.md
effect: US business email compromise moved from AVG USD 36,442 to USD 626,476 (P95 90,288 to 1,659,766)
  - a 17x increase. Australian business email compromise moved from AVG AUD 55,233 to 125,110 (P95
  146,347 to 356,230). Australian ransomware moved from AUD 8,525,254 to 8,097,631 and Canadian
  data breach from CAD 4,530,593 to 4,775,625, both about 5%. No evidence, source or caveat changed
  for any of them.
reason: 'Each of these shards was still simulating starter placeholder values held in its scenario
  file rather than the source-backed values its own calibration produces, so the loss range shown
  was not generated by the evidence displayed beside it. US BEC was the most affected: it ran frequency
  0.04/0.12/0.25 and impact 25k/123k/1.2M against a calibration of 0.004/0.63/0.74 and 50k/120k/6.4M.
  The scenarios now match their calibrations. Australian BEC was running frequency 0.12/0.25 while
  its reviewed evidence (ABS 2024-25 prevalence 0.21, MYOB 2024 mid-sized finance prevalence 0.81)
  said otherwise. A check in riskshard_doctor reports any future divergence so this cannot recur
  silently; its first version compared values with an absolute tolerance of 1.0, which silently
  exempted every frequency (probabilities are all below 1), and it now compares effectively exactly.
  The Australian data-breach shard has the same defect and is deliberately left for review, because
  correcting it would publish a mid-market figure derived from a UK enterprise-weighted benchmark.'
