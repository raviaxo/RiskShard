metadata:
  name: Japan Manufacturing Ransomware Midmarket
  version: "0.2"
  currency: USD
  scenario_stage: governed_starter
  benchmark_status: benchmark_review_candidate
  description: >
    Starter Japan manufacturing ransomware shard. Frequency likely/max are the
    Japanese readings of the Sophos State of Ransomware surveys (51% in 2024,
    58% in 2023 - all-sector, so the sector dimension stays bridged; attack
    prevalence, which overstates loss-event frequency), above a global ransomware
    likelihood floor. Impact uses an official Japan restoration-cost floor and
    manufacturing-sector recovery/stress anchors - no Japan country cut of the
    recovery-cost survey exists, so the impact country bridge is structural.
    Frequency and impact share one "hit by ransomware" event basis.

frequency:
  min: 0.1
  likely: 0.51
  max: 0.58

impact:
  min: 6000
  likely: 1300000
  max: 5000000
