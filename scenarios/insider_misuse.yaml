metadata:
  name: Insider Misuse
  version: "0.1"
  currency: USD
  scenario_stage: governed_starter
  benchmark_status: starter_source_backed_frequency_generic_impact_bridges
  description: >
    Starter Insider Misuse shard. Frequency uses three dedicated source-backed
    insider-prevalence bridges from one survey family (Cybersecurity
    Insiders/Gurucul: 51% six-or-more-attacks floor, 83% at-least-one 2024
    likely, 90% 2025 stress; broad, incl. negligent insiders, so it overstates
    deliberate misuse — a prior 66%/76% pair was retracted 2026-08-01 as
    appearing in no primary source). Impact min/likely are insider-specific
    (Ponemon/DTEX 2023 per-incident costs); the catastrophic tail is the sole
    remaining generic cross-cyber Cyentia bridge. Governed starter, not a
    human-approved benchmark. Calibrate from
    calibrations/au_finance_insider_misuse.yaml; caveats live per-record in
    evidence/insider_misuse.yaml. (A separate demo_fixture, insider_threat.yaml,
    remains for fixtures.)

frequency:
