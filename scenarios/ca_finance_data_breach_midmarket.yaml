metadata:
  name: Canada Finance Data Breach Midmarket
  version: "0.1"
  currency: CAD
  scenario_stage: governed_starter
  benchmark_status: benchmark_review_candidate
  description: >
    Benchmark-review candidate Canadian financial-services data-breach shard.
    Frequency min, likely, and max use the StatCan CSCSC full-cell readings
    (finance and insurance, medium enterprises, incidents to steal personal or
    financial information) - a motive-classified incident construct, not
    confirmed breaches, with the stress anchor's 2021 cell carrying StatCan
    quality code C. Impact is expressed in CAD: likely uses the primary IBM
    Canada national average; min and max use Canadian insured-claims anchors
    from NetDiligence (Hacker-cause average, N=8, and the dataset maximum,
    N=84) converted with a Bank of Canada FX assumption - country-matched but
    thin cells, with the cause-of-loss taxonomy as the remaining threat
    bridge.

frequency:
  min: 0.15
  likely: 0.201
  max: 0.273

impact:
  min: 90000
  likely: 6980000
  max: 20800000
