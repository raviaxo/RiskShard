metadata:
  name: France Finance Data Breach Midmarket
  version: "0.1"
  currency: USD
  scenario_stage: governed_starter
  benchmark_status: starter_with_source_backed_france_frequency_and_likely_loss
  description: >
    Starter France financial-services data-breach shard. Frequency is
    source-backed: min/likely from Eurostat France small/medium-enterprise
    confidential-data disclosure rates (2024), max from a CESIN 2025
    survey-derived attack-with-data-theft prevalence. Impact.likely uses the
    primary IBM France 2025 national average breach cost (EUR 3.59M) converted
    to USD via the reviewed ECB EUR/USD assumption. Impact.min/max still use
    global loss bridges. Caveats: the Eurostat frequency series excludes the
    financial sector (likely understating), and the CESIN stress anchor is a
    large-skewed derived figure.

frequency:
  min: 0.0198
  likely: 0.0383
  max: 0.208

impact:
  min: 266000
  likely: 4200000
  max: 32000000
