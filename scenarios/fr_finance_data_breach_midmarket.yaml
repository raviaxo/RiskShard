metadata:
  name: France Finance Data Breach Midmarket
  version: "0.1"
  currency: USD
  scenario_stage: governed_starter
  benchmark_status: starter_with_source_backed_france_direct_parameters
  description: >
    France financial-services data-breach shard with all six direct parameters
    source-backed by France/EU anchors. Frequency min/likely/max use Eurostat
    France small/medium/large-enterprise confidential-data disclosure rates
    (2024). Impact.min uses the Asteres France average cyberattack cost, likely
    the primary IBM France 2025 national average breach cost (EUR 3.59M), and
    max the GDPR Article 83(5) statutory maximum fine (EUR 20M); all EUR anchors
    convert to USD via the reviewed ECB EUR/USD assumption. Caveats: the
    Eurostat frequency series excludes the financial sector (likely
    understating), the Asteres floor is an economy-wide all-cyber average, and
    the GDPR max is a statutory cap rather than a total event-loss distribution.

frequency:
  min: 0.0198
  likely: 0.0383
  max: 0.073

impact:
  min: 70000
  likely: 4200000
  max: 23300000
