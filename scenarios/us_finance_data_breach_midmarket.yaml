metadata:
  name: US Finance Data Breach Midmarket
  version: "0.1"
  currency: USD
  scenario_stage: governed_starter
  benchmark_status: starter_with_source_backed_us_impact_and_bridged_frequency
  description: >
    Starter United States financial-services data-breach shard. Impact is
    source-backed by NetDiligence cyber-insurance claims, matched on country,
    industry and size: an SME crisis-services floor, the financial-services SME
    five-year average incident cost, and the largest incident cost observed among
    financial-services SME claims. Frequency uses UK official breach/attack
    prevalence as a labeled cross-country bridge, because the US publishes breach
    counts but no clean per-firm annual breach prevalence. It remains a governed
    starter because frequency is bridged rather than US-specific.

frequency:
  min: 0.43
