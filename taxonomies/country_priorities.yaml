taxonomy: country_expansion_priorities
method:
  version: "0.1"
  updated: "2026-06-04"
  basis:
    - market_size
    - cyber_regulatory_maturity
    - public_source_availability
    - regional_coverage
    - contributor_likelihood
  notes: >
    Priority is a pragmatic contributor roadmap, not a claim about absolute
    national cyber risk. It favors countries where risk professionals can add
    public sources, reviewed extractions, and usable calibration profiles.
items:
  - rank: 1
    country_id: US
    label: United States
    region: North America
    tier: launch
    status: module_seeded
    recommended_first_module: us_finance_bec_midmarket
    why: Large market, strong public cyber/law-enforcement sources, and existing FBI IC3 source coverage.
    collaboration_prompt: Add US sector denominators, breach/loss sources, and control/regulatory context.
    coverage_summary: One BEC governed starter seeded with source-backed likely loss.
    next_contribution: Replace US BEC frequency and tail-loss assumptions with denominator-aware evidence.

  - rank: 2
    country_id: GB
    label: United Kingdom
    region: Europe
    tier: launch
    status: module_seeded
    recommended_first_module: gb_finance_data_breach_midmarket
    why: Mature cyber/regulatory ecosystem, strong public reporting, and high practitioner overlap with FAIR/CRQ.
    collaboration_prompt: Add NCSC, ICO, FCA/PRA, and UK cyber survey evidence.
    coverage_summary: One data-breach governed starter seeded with UK breach/attack frequency and UK financial-services likely-loss evidence.
    next_contribution: Replace the UK stress-loss assumption and add privacy-regulator/sector denominator evidence.

