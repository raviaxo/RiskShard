    collaboration_prompt: Add OPC, Statistics Canada, CSE, and financial-sector sources.
    coverage_summary: One data-breach governed starter seeded with Canadian prevalence anchors and global USD impact anchors.
    next_contribution: Replace Canada data-breach stress frequency and add Canada/CAD-localized breach-cost evidence.

