metadata:
  name: Japan manufacturing ransomware calibration
  scenario_name: Japan Manufacturing Ransomware Midmarket - Calibrated Draft
  version: "0.2"
  notes: >
    Starter calibration profile for a Japan mid-market manufacturing ransomware
    shard. Frequency likely/max are Japan-resident (2026-08-02 rework): the
    2024/2023 Japanese readings of the Sophos State of Ransomware surveys
    (51%/58%, all-sector - the sector dimension stays bridged), on the same
    "hit by ransomware" event basis as the Sophos manufacturing impact anchors.
    frequency.min stays a global Cyentia likelihood floor. impact.min is Japan
    NPA restoration-cost evidence; impact.likely/max stay manufacturing-sector
    global benchmarks - no Japan country cut of the recovery-cost survey exists
    (scouted 2026-08-02), so the country bridge on the impact side is structural
    until Japanese loss data is published.

target_currency: USD

parameters:
  frequency:
    min:
      evidence_id: cyentia_global_ransomware_probability_2025_jp_context
      transform: direct
      rationale: Global ransomware likelihood floor from Cyentia IRIS Ransomware.
    likely:
      evidence_id: sophos_2024_jp_ransomware_attack_rate_likely
      transform: direct
      rationale: Japanese reading (51%) of the Sophos 2024 survey - country-resident, ransomware-specific attack prevalence, replacing the country-bridged global manufacturing rate.
    max:
      evidence_id: sophos_2023_jp_ransomware_attack_rate_stress
      transform: direct
      rationale: Prior-year Japanese reading (58%, Sophos 2023 survey) as a genuinely distinct stress bound above the likely anchor; the 2022 reading (61%) is the documented harsher alternative.

  impact:
    min:
      evidence_id: npa_jp_ransomware_restoration_cost_low_band_jpy_2025
      transform: currency_convert
      target_currency: USD
      round_to: 1000
      rationale: Official Japan ransomware restoration-cost low-band anchor, converted from JPY to USD as a conservative local loss floor.
    likely:
      evidence_id: sophos_manufacturing_ransomware_recovery_cost_usd_2025_jp_context
      transform: direct
      target_currency: USD
      round_to: 100000
      rationale: Manufacturing-sector mean recovery cost excluding ransom from Sophos.
    max:
      evidence_id: sophos_manufacturing_ransomware_extreme_case_threshold_usd_2025_jp_context
      transform: direct
      target_currency: USD
      round_to: 100000
      rationale: Manufacturing-sector USD 5M+ extreme ransom demand and payout threshold from Sophos.
