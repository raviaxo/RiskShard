metadata:
  name: Japan manufacturing ransomware calibration
  scenario_name: Japan Manufacturing Ransomware Midmarket - Calibrated Draft
  version: "0.1"
  notes: >
    Starter calibration profile for a Japan mid-market manufacturing
    ransomware shard. It is intentionally not benchmark-grade: frequency.min
    uses a global ransomware likelihood floor, frequency.likely/max are
    explicit estimates, impact.min uses Japan NPA restoration-cost evidence,
    and impact.likely/max use manufacturing-sector ransomware benchmarks until
    Japan manufacturing full-loss evidence is reviewed.

target_currency: USD

parameters:
  frequency:
    min:
      evidence_id: cyentia_global_ransomware_probability_2025_jp_context
      transform: direct
      rationale: Global ransomware likelihood floor from Cyentia IRIS Ransomware.
    likely:
      evidence_id: riskshard_jp_manufacturing_ransomware_frequency_likely_2026
      transform: direct
      rationale: Explicit estimated likely frequency until Japan manufacturing ransomware evidence exists.
    max:
      evidence_id: riskshard_jp_manufacturing_ransomware_frequency_stress_2026
      transform: direct
      rationale: Explicit estimated stress frequency until Japan manufacturing tail-frequency evidence exists.

  impact:
    min:
      evidence_id: npa_jp_ransomware_restoration_cost_low_band_jpy_2025
      transform: currency_convert
      target_currency: USD
      round_to: 1000
      rationale: Official Japan ransomware restoration-cost low-band anchor, converted from JPY to USD as a conservative local loss floor.
    likely:
      evidence_id: sophos_manufacturing_ransomware_recovery_cost_usd_2025_jp_context
      transform: direct
      target_currency: USD
      round_to: 100000
      rationale: Manufacturing-sector mean recovery cost excluding ransom from Sophos.
    max:
      evidence_id: sophos_manufacturing_ransomware_extreme_case_threshold_usd_2025_jp_context
      transform: direct
      target_currency: USD
      round_to: 100000
      rationale: Manufacturing-sector USD 5M+ extreme ransom demand and payout threshold from Sophos.
