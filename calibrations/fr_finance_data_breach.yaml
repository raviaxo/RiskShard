metadata:
  name: France financial-services data breach calibration
  scenario_name: France Finance Data Breach Midmarket - Calibrated Draft
  version: "0.1"
  notes: >
    Calibration profile for a France mid-market financial-services data-breach
    shard. It is not yet benchmark-grade: frequency values remain explicit
    estimates pending a France prevalence-percentage source (CNIL notification
    counts and Eurostat EU-level rates are not a France financial-services
    annual probability). Impact.likely now uses the primary IBM France 2025
    national average breach cost (EUR 3.59M), converted to USD via the reviewed
    ECB EUR/USD assumption; impact.min/max still use global cyber and
    security-incident loss bridges until France breach-cost floor and tail
    evidence is reviewed.

target_currency: USD

parameters:
  frequency:
    min:
      evidence_id: riskshard_fr_finance_data_breach_frequency_floor_2026
      transform: direct
      rationale: Explicit estimated floor until France data-breach event-frequency evidence exists.
    likely:
      evidence_id: riskshard_fr_finance_data_breach_frequency_likely_2026
      transform: direct
      rationale: Explicit estimated likely annual probability until France organization-level or sector-specific breach frequency evidence exists.
    max:
      evidence_id: riskshard_fr_finance_data_breach_frequency_stress_2026
      transform: direct
      rationale: Explicit estimated stress frequency until France tail-frequency evidence exists.

  impact:
    min:
      evidence_id: cyentia_iris_2022_typical_cyber_event_loss_usd_fr_finance_context
      transform: direct
      target_currency: USD
      round_to: 10000
      rationale: Source-backed global lower loss anchor until France breach-cost floor evidence is reviewed.
    likely:
      evidence_id: ibm_france_2025_national_average_breach_cost_eur
      transform: currency_convert
      target_currency: USD
      round_to: 100000
      rationale: Primary IBM France 2025 national average breach cost (EUR 3.59M), converted from EUR to USD via the reviewed ECB EUR/USD assumption, replacing the global IBM average bridge. All-sector, enterprise-weighted France average used as an upper-leaning mid-market likely anchor.
    max:
      evidence_id: cyentia_iris_2025_extreme_security_incident_loss_usd_fr_finance_context
      transform: direct
      target_currency: USD
      round_to: 100000
      rationale: Source-backed global extreme security-incident loss bridge until France data-breach tail-loss evidence is reviewed.
