metadata:
  name: France financial-services data breach calibration
  scenario_name: France Finance Data Breach Midmarket - Calibrated Draft
  version: "0.1"
  notes: >
    Calibration profile for a France mid-market financial-services data-breach
    shard. Frequency is now source-backed: min/likely use Eurostat France
    small/medium-enterprise confidential-data disclosure rates (2024; 1.98% /
    3.83%) and max uses a CESIN 2025 survey-derived attack-with-data-theft
    prevalence (0.208). Impact.likely uses the primary IBM France 2025 national
    average breach cost (EUR 3.59M) converted to USD via the reviewed ECB
    EUR/USD assumption. Not yet benchmark-grade: the Eurostat frequency series
    excludes the financial sector (a non-financial proxy that likely
    understates), the CESIN stress anchor is a large-skewed derived figure, and
    impact.min/max still use global cyber and security-incident loss bridges
    until France breach-cost floor and tail evidence is reviewed.

target_currency: USD

parameters:
  frequency:
    min:
      evidence_id: eurostat_fr_data_disclosure_small_2024
      transform: direct
      rationale: Eurostat France small-enterprise (10-49) confidential-data disclosure rate 2024 (1.98%) as a conservative frequency floor. Non-financial-sector proxy.
    likely:
      evidence_id: eurostat_fr_data_disclosure_medium_2024
      transform: direct
      rationale: Eurostat France medium-enterprise (50-249) confidential-data disclosure rate 2024 (3.83%) as the mid-market likely anchor. Non-financial-sector proxy, likely understating a more-targeted financial sector.
    max:
      evidence_id: cesin_fr_attack_with_data_theft_2025
      transform: direct
      rationale: CESIN 2025 French survey-derived attack-with-data-theft prevalence (0.40 x 0.52 = 0.208) as an upper stress bound. Sample skews large, so it brackets the tail from above.

  impact:
    min:
      evidence_id: cyentia_iris_2022_typical_cyber_event_loss_usd_fr_finance_context
      transform: direct
      target_currency: USD
      round_to: 10000
      rationale: Source-backed global lower loss anchor until France breach-cost floor evidence is reviewed.
    likely:
      evidence_id: ibm_france_2025_national_average_breach_cost_eur
      transform: currency_convert
      target_currency: USD
      round_to: 100000
      rationale: Primary IBM France 2025 national average breach cost (EUR 3.59M), converted from EUR to USD via the reviewed ECB EUR/USD assumption, replacing the global IBM average bridge. All-sector, enterprise-weighted France average used as an upper-leaning mid-market likely anchor.
    max:
      evidence_id: cyentia_iris_2025_extreme_security_incident_loss_usd_fr_finance_context
      transform: direct
      target_currency: USD
      round_to: 100000
      rationale: Source-backed global extreme security-incident loss bridge until France data-breach tail-loss evidence is reviewed.
