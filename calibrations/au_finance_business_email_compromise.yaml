metadata:
  name: Australia financial-services BEC calibration
  scenario_name: Australia Finance Business Email Compromise Midmarket - Calibrated Draft
  version: "0.1"
  notes: >
    Starter reviewed calibration profile for Australia financial-services
    business email compromise. It uses a source-backed FBI IC3 complaint-average
    loss anchor for likely impact, plus explicit estimated assumptions for
    frequency and loss bounds until denominator-aware Australia or sector
    evidence is reviewed.

target_currency: AUD

parameters:
  frequency:
    min:
      evidence_id: riskshard_bec_frequency_floor_2026
      transform: direct
      rationale: Explicit estimated floor until source-backed BEC event frequency evidence exists.
    likely:
      evidence_id: riskshard_bec_frequency_likely_2026
      transform: direct
      rationale: Explicit estimated likely annual probability until denominator-aware BEC frequency evidence exists.
    max:
      evidence_id: riskshard_bec_frequency_stress_2026
      transform: direct
      rationale: Explicit estimated stress frequency until source-backed tail-frequency evidence exists.

  impact:
    min:
      evidence_id: riskshard_bec_impact_floor_2026
      transform: direct
      target_currency: AUD
      round_to: 1000
      rationale: Explicit estimated lower loss bound until reviewed fraudulent-payment floor evidence exists.
    likely:
      evidence_id: fbi_ic3_2025_bec_average_loss_per_complaint_usd
      transform: currency_convert
      target_currency: AUD
      round_to: 10000
      rationale: Source-backed FBI IC3 BEC average adjusted loss per complaint, converted to AUD as the first likely loss anchor.
    max:
      evidence_id: riskshard_bec_impact_stress_2026
      transform: direct
      target_currency: AUD
      round_to: 10000
      rationale: Explicit estimated stress loss bound until source-backed BEC tail-loss evidence exists.
