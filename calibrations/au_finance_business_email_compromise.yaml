metadata:
  name: Australia financial-services BEC calibration
  scenario_name: Australia Finance Business Email Compromise Midmarket - Calibrated Draft
  version: "0.1"
  notes: >
    Starter reviewed calibration profile for Australia financial-services
    business email compromise. It uses a source-backed ACCC/ABS reported-loss
    frequency floor, a source-backed FBI IC3 complaint-average likely loss
    anchor, and an AFP-documented single-event Australian BEC loss as the
    stress anchor. The impact range is mixed on ADR-0007 grounds (two means
    beneath one documented event) but every anchor now measures a quantity a
    single firm can actually incur.

target_currency: AUD

parameters:
  frequency:
    min:
      evidence_id: accc_abs_au_small_business_scam_loss_report_rate_floor_2025
      transform: direct
      rationale: Conservative Australia reported-loss floor from ACCC Scamwatch loss reports divided by ABS active-business denominator.
    likely:
      evidence_id: abs_2025_au_business_cyber_incident_prevalence_frequency_likely
      transform: direct
      rationale: Source-backed AU org-level exposure bridge (ABS 2024-25, 21% of businesses experienced a cyber security incident); all-cyber, overstates BEC-only.
    max:
      evidence_id: myob_2024_au_finance_midsized_cyber_prevalence_frequency_stress
      transform: direct
      rationale: Source-backed AU mid-sized finance stress bridge (MYOB/Dynata 2024, 81% of finance and insurance mid-sized businesses attacked); vendor survey, all-cyber.

  impact:
    min:
      evidence_id: accc_2025_small_business_average_scam_loss_aud
      transform: direct
      target_currency: AUD
      round_to: 1000
      rationale: Australia small-business Scamwatch average loss per loss report as a source-backed lower impact floor. Slot declaration - this is a published mean, not an observed minimum; the engine composes it as the beta-PERT floor.
    likely:
      evidence_id: fbi_ic3_2025_bec_average_loss_per_complaint_usd
      transform: currency_convert
      target_currency: AUD
      round_to: 10000
      rationale: Source-backed FBI IC3 BEC average adjusted loss per complaint, converted to AUD as the first likely loss anchor. Slot declaration - this is a published mean, not a calibrated mode; the engine composes it as the mode of a beta-PERT. No source consulted publishes a mode for this population.
    max:
      evidence_id: afp_2020_au_bec_documented_single_event_loss_aud
      transform: direct
      target_currency: AUD
      round_to: 10000
      rationale: One documented Australian BEC event (AFP taskforce case, September 2020, AUD 2,668,483 gross across two transfers) used as the stress anchor. Replaces the ACCC false-billing aggregate, which measured a whole-country small-business loss total and could never bound one firm's event.
