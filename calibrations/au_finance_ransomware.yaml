metadata:
  name: Australia financial-services ransomware calibration
  scenario_name: Australia Finance Ransomware Midmarket - Calibrated Draft
  version: "0.1"
  notes: >
    Benchmark-review candidate calibration profile. It uses source-backed facts
    for all six direct parameters, but the frequency stress anchor equals the
    Sophos financial-services attack rate and the impact stress anchor is a
    global Cyentia cyber-event tail-loss bridge rather than an Australia
    ransomware claims distribution.

target_currency: AUD

parameters:
  frequency:
    min:
      evidence_id: cyentia_global_ransomware_probability_2025
      transform: direct
      rationale: Global ransomware likelihood floor from Cyentia IRIS Ransomware.
    likely:
      evidence_id: sophos_fin_services_ransomware_frequency_2024
      transform: direct
      rationale: Financial-services ransomware survey rate from Sophos.
    max:
      evidence_id: sophos_fin_services_ransomware_frequency_stress_2024
      transform: direct
      rationale: Source-backed financial-services attack rate reused as the stress frequency anchor until stronger tail-frequency evidence is available.

  impact:
    min:
      evidence_id: business_qld_au_medium_business_cybercrime_cost_2025
      transform: direct
      target_currency: AUD
      round_to: 1000
      rationale: Locally gathered Australian medium-business cybercrime cost floor from Business Queensland guidance.
    likely:
      evidence_id: sophos_fin_services_ransomware_recovery_cost_2024
      transform: currency_convert
      target_currency: AUD
      round_to: 10000
      rationale: Sophos financial-services ransomware recovery cost converted from USD to AUD.
    max:
      evidence_id: cyentia_iris_2022_top5_cyber_event_loss_usd_au_ransomware_context
      transform: currency_convert
      target_currency: AUD
      round_to: 100000
      rationale: Source-backed Cyentia top-5% cyber-event loss bridge converted to AUD until Australia-specific ransomware tail-loss evidence is available.
