metadata:
  name: Australia financial-services data breach calibration
  scenario_name: Australia Finance Data Breach Midmarket - Calibrated Draft
  version: "0.2"
  notes: >
    Starter reviewed calibration profile for Australia financial-services data
    breach. It can generate a scenario draft with source-backed impact anchors,
    a denominator-derived Australian reported-breach frequency floor, and
    official UK breach/attack prevalence bridges for likely and stress
    frequency. The frequency bridges are useful for replacing assumptions, but
    they are not a substitute for Australian financial-services prevalence
    evidence.

target_currency: AUD

parameters:
  frequency:
    min:
      evidence_id: oaic_abs_au_finance_ndb_notification_rate_floor_2025
      transform: direct
      rationale: Source-derived reported NDB notification floor from OAIC finance notifications and ABS Financial and Insurance Services business counts.
    likely:
      evidence_id: uk_dsit_2026_medium_business_breach_prevalence_au_bridge
      transform: direct
      rationale: Source-backed UK official medium-business cyber breach/attack prevalence bridge selected until AU mid-market financial-services prevalence evidence exists.
    max:
      evidence_id: uk_dsit_2026_large_business_breach_prevalence_au_stress_bridge
      transform: direct
      rationale: Source-backed UK official large-business breach/attack prevalence bridge selected as a stress-frequency proxy until AU tail-prevalence evidence exists.

  impact:
    min:
      evidence_id: cyentia_iris_2022_typical_cyber_event_loss_usd
      transform: currency_convert
      target_currency: AUD
      round_to: 10000
      rationale: Source-backed lower loss anchor from a global cyber-event loss benchmark; used conservatively until AU-specific breach cost floors exist.
    likely:
      evidence_id: ibm_cost_data_breach_2025_global_average_cost_usd
      transform: currency_convert
      target_currency: AUD
      round_to: 100000
      rationale: Data-breach-specific global average cost benchmark, converted to AUD for the likely loss anchor.
    max:
      evidence_id: cyentia_iris_2025_extreme_security_incident_loss_usd
      transform: currency_convert
      target_currency: AUD
      round_to: 100000
      rationale: Source-backed global extreme security-incident loss benchmark used as a stress loss anchor until data-breach-specific tail evidence exists.
