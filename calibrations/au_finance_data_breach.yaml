metadata:
  name: Australia financial-services data breach calibration
  scenario_name: Australia Finance Data Breach Midmarket - Calibrated Draft
  version: "0.2"
  notes: >
    Starter reviewed calibration profile for Australia financial-services data
    breach. It can generate a scenario draft with source-backed impact anchors,
    a denominator-derived Australian reported-breach frequency floor, and
    official UK breach/attack prevalence bridges for likely and stress
    frequency. The frequency bridges are useful for replacing assumptions, but
    they are not a substitute for Australian financial-services prevalence
    evidence.

target_currency: AUD

parameters:
  frequency:
    min:
      evidence_id: oaic_abs_au_finance_ndb_notification_rate_floor_2025
      transform: direct
      rationale: Source-derived reported NDB notification floor from OAIC finance notifications and ABS Financial and Insurance Services business counts.
    likely:
      evidence_id: uk_dsit_2026_medium_business_breach_prevalence_au_bridge
      transform: direct
      rationale: Source-backed UK official medium-business cyber breach/attack prevalence bridge selected until AU mid-market financial-services prevalence evidence exists.
    max:
      evidence_id: uk_dsit_2026_large_business_breach_prevalence_au_stress_bridge
      transform: direct
      rationale: Source-backed UK official large-business breach/attack prevalence bridge selected as a stress-frequency proxy until AU tail-prevalence evidence exists.

  impact:
    min:
      evidence_id: business_qld_au_medium_business_cybercrime_cost_data_breach_floor_2025
      transform: direct
      target_currency: AUD
      round_to: 1000
      rationale: Locally gathered Australian medium-business cybercrime cost floor used conservatively until data-breach-specific Australian cost-floor evidence exists. Slot declaration - this is a published mean, not an observed minimum; the engine composes it as the beta-PERT floor.
    likely:
      evidence_id: securitybrief_ibm_2026_au_finserv_breach_average_cost_aud
      transform: direct
      target_currency: AUD
      round_to: 100000
      rationale: >-
        IBM's 2026 Australian financial-services average breach cost (AUD 6.31M), the
        exact cell this shard models, via verified secondary coverage because IBM gates
        the report PDF. The prior selection's own rationale said to revise when
        Australian financial-services breach-cost evidence exists - this is that
        revision. The value barely moves (AUD 6.2M converted-global to 6.31M local); the
        country and industry dimensions stop being bridged, size stays bridged
        (enterprise-leaning study, per-cell sample size unpublished). The IBM 2025
        global average (USD 4.44M) and the UK financial-services figure (GBP 5.74M)
        remain on the records as the documented alternatives.
        Slot declaration - this is a published mean, not a calibrated mode; the engine composes it as the mode of a beta-PERT. No source consulted publishes a mode for this population.
    max:
      evidence_id: privacy_act_1988_au_body_corporate_serious_privacy_penalty_cap_2026
      transform: direct
      target_currency: AUD
      rationale: Official Australian privacy-law penalty cap selected as a local regulatory stress anchor until data-breach-specific Australian loss-tail evidence exists.
