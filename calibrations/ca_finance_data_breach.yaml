metadata:
  name: Canada financial-services data breach calibration
  scenario_name: Canada Finance Data Breach Midmarket - Calibrated Draft
  version: "0.1"
  notes: >
    Starter calibration profile for a Canadian mid-market financial-services
    data-breach shard. It is intentionally not benchmark-grade: frequency.min
    and frequency.likely now use Canadian organization-level OPC/CIRA prevalence
    anchors, but frequency.max remains an explicit estimate until Canadian
    financial-services or tail-frequency evidence is reviewed. Impact
    min/max parameters still use governed global USD loss anchors converted to
    CAD, while impact.likely now uses a secondary Canada-specific IBM cost
    report bridge. Replace the secondary likely-cost bridge and global min/max
    anchors before benchmark-grade claims.

target_currency: CAD

parameters:
  frequency:
    min:
      evidence_id: opc_cira_ca_material_data_breach_prevalence_proxy_2026
      transform: direct
      rationale: Low-confidence material-breach proxy from Canadian organization breach prevalence and OPC significant-harm share.
    likely:
      evidence_id: opc_cira_ca_org_customer_employee_data_breach_prevalence_2026
      transform: direct
      rationale: Canadian organization-level customer or employee data-breach prevalence anchor cited in OPC's 2025-2026 annual report.
    max:
      evidence_id: riskshard_ca_data_breach_frequency_stress_2026
      transform: direct
      rationale: Explicit estimated stress frequency retained above the Canadian prevalence anchor until Canadian financial-services tail-frequency evidence is available.

  impact:
    min:
      evidence_id: cyentia_iris_2022_typical_cyber_event_loss_usd_ca_context
      transform: currency_convert
      target_currency: CAD
      round_to: 10000
      rationale: Source-backed global lower loss anchor converted to CAD until Canadian breach response-cost evidence is reviewed.
    likely:
      evidence_id: itpro_ibm_ca_2025_average_breach_cost_usd
      transform: currency_convert
      target_currency: CAD
      round_to: 100000
      rationale: Secondary Canada-specific IBM breach-cost coverage converted to CAD; replace with a primary Canada source before benchmark claims.
    max:
      evidence_id: cyentia_iris_2025_extreme_security_incident_loss_usd_ca_context
      transform: currency_convert
      target_currency: CAD
      round_to: 100000
      rationale: Source-backed global extreme security-incident loss benchmark converted to CAD until Canadian data-breach tail-loss evidence is reviewed.
