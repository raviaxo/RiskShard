metadata:
  name: Canada financial-services data breach calibration
  scenario_name: Canada Finance Data Breach Midmarket - Calibrated Draft
  version: "0.1"
  notes: >
    Starter calibration profile for a Canadian mid-market financial-services
    data-breach shard. It is an automated benchmark-review candidate, not a
    silently certified benchmark. Frequency min/likely/max use Canadian
    OPC/CIRA prevalence anchors. Impact min/likely/max use primary governed
    global USD loss anchors converted to CAD, because the public primary IBM
    page exposes the global data-breach cost but not the Canada regional row.
    Human review must accept the global impact bridge caveat before any public
    benchmark-grade claim.

target_currency: CAD

parameters:
  frequency:
    min:
      evidence_id: opc_cira_ca_material_data_breach_prevalence_proxy_2026
      transform: direct
      rationale: Low-confidence material-breach proxy from Canadian organization breach prevalence and OPC significant-harm share.
    likely:
      evidence_id: opc_cira_ca_org_customer_employee_data_breach_prevalence_2026
      transform: direct
      rationale: Canadian organization-level customer or employee data-breach prevalence anchor cited in OPC's 2025-2026 annual report.
    max:
      evidence_id: opc_cira_ca_org_customer_employee_data_breach_prevalence_stress_2026
      transform: direct
      rationale: Source-backed Canadian organization-level data-breach prevalence reused as the stress frequency anchor until Canadian financial-services tail-frequency evidence is available.

  impact:
    min:
      evidence_id: cyentia_iris_2022_typical_cyber_event_loss_usd_ca_context
      transform: currency_convert
      target_currency: CAD
      round_to: 10000
      rationale: Source-backed global lower loss anchor converted to CAD until Canadian breach response-cost evidence is reviewed.
    likely:
      evidence_id: ibm_cost_data_breach_2025_global_average_cost_usd_ca_context
      transform: currency_convert
      target_currency: CAD
      round_to: 100000
      rationale: Primary IBM global data-breach average cost converted to CAD; selected over secondary Canada coverage for automated benchmark-review source quality.
    max:
      evidence_id: cyentia_iris_2025_extreme_security_incident_loss_usd_ca_context
      transform: currency_convert
      target_currency: CAD
      round_to: 100000
      rationale: Source-backed global extreme security-incident loss benchmark converted to CAD until Canadian data-breach tail-loss evidence is reviewed.
