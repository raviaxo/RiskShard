metadata:
  name: Canada financial-services data breach calibration
  scenario_name: Canada Finance Data Breach Midmarket - Calibrated Draft
  version: "0.1"
  notes: >
    Starter calibration profile for a Canadian mid-market financial-services
    data-breach shard. It is an automated benchmark-review candidate, not a
    silently certified benchmark. Frequency min/likely/max use the StatCan
    CSCSC full-cell readings (finance and insurance, medium enterprises,
    incidents to steal personal or financial information) - official
    statistics matched to the shard's own country, sector and size band,
    replacing the prior OPC/CIRA all-organization prevalence. The construct is
    motive-classified impactful incidents, not confirmed breaches, and the
    stress anchor's 2021 cell carries StatCan quality code C. Impact likely
    uses the primary IBM Canada national average breach cost (CA$6.98M, 2025),
    reported directly in CAD. Impact min/max now use Canadian insured-claims
    anchors from NetDiligence (Hacker-cause average USD 66K, N=8, as the
    floor; dataset maximum USD 15M, N=84, as the stress), converted to CAD -
    country-matched where the prior Cyentia anchors were global, with the
    cause-of-loss taxonomy as the remaining threat bridge and thin samples
    caveated on the records. Human review must accept the incident-motive
    frequency construct, the thin Canadian claim cells, and the insured-claims
    tail truncation before any public benchmark-grade claim.

target_currency: CAD

parameters:
  frequency:
    min:
      evidence_id: statcan_cscsc_ca_finance_medium_steal_info_2019_floor
      transform: direct
      rationale: Lowest of the four StatCan CSCSC cycle readings for the shard's own cell (finance and insurance, medium enterprises, data-theft incidents; 2019, 15.0%, quality B).
    likely:
      evidence_id: statcan_cscsc_ca_finance_medium_steal_info_2023_likely
      transform: direct
      rationale: Most recent StatCan CSCSC reading of the shard's own cell (2023, 20.1%, quality B).
    max:
      evidence_id: statcan_cscsc_ca_finance_medium_steal_info_2021_stress
      transform: direct
      rationale: Highest of the four StatCan CSCSC cycle readings for the shard's own cell (2021, 27.3%; StatCan quality code C, use with caution - the weakest anchor, caveated on the record).

  impact:
    min:
      evidence_id: netdiligence_2025_ca_hacker_claims_average_cost_usd
      transform: currency_convert
      target_currency: CAD
      round_to: 10000
      rationale: Canadian Hacker-cause claims average (NetDiligence 2020-2024, N=8, USD 66K) as a conservative country-matched floor, converted to CAD; replaces the Cyentia global all-cyber bridge. Slot declaration - this is a published mean, not an observed minimum; the engine composes it as the beta-PERT floor.
    likely:
      evidence_id: ibm_canada_2025_average_breach_cost_cad
      transform: direct
      round_to: 10000
      rationale: Primary IBM Canada national average breach cost (CA$6.98M, 2025), already reported in CAD, replacing the global IBM bridge and the low-confidence ITPro secondary. All-sector and enterprise-weighted, so treated as an upper-leaning mid-market likely anchor rather than a mid-market-specific figure. Slot declaration - this is a published mean, not a calibrated mode; the engine composes it as the mode of a beta-PERT. No source consulted publishes a mode for this population.
    max:
      evidence_id: netdiligence_2025_ca_maximum_incident_cost_usd
      transform: currency_convert
      target_currency: CAD
      round_to: 100000
      rationale: Documented maximum of the Canadian insured-claims dataset (NetDiligence 2020-2024, N=84, USD 15M) converted to CAD; country-matched where the Cyentia USD 32M global extreme was not. Insured-claims truncation of the tail is caveated on the record, with the Cyentia alternative documented.
