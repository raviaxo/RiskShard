metadata:
  name: Canada financial-services data breach calibration
  scenario_name: Canada Finance Data Breach Midmarket - Calibrated Draft
  version: "0.1"
  notes: >
    Starter calibration profile for a Canadian mid-market financial-services
    data-breach shard. It is an automated benchmark-review candidate, not a
    silently certified benchmark. Frequency min/likely/max use the StatCan
    CSCSC full-cell readings (finance and insurance, medium enterprises,
    incidents to steal personal or financial information) - official
    statistics matched to the shard's own country, sector and size band,
    replacing the prior OPC/CIRA all-organization prevalence. The construct is
    motive-classified impactful incidents, not confirmed breaches, and the
    stress anchor's 2021 cell carries StatCan quality code C. Impact likely
    uses the primary IBM Canada national average breach cost (CA$6.98M, 2025),
    reported directly in CAD. Impact min/max still use primary governed global
    USD loss anchors converted to CAD until Canada-specific breach-response
    and tail-loss evidence is reviewed (known-weak, per the 2026-07-30
    decision). Human review must accept the incident-motive construct and the
    remaining global impact bridges before any public benchmark-grade claim.

target_currency: CAD

parameters:
  frequency:
    min:
      evidence_id: statcan_cscsc_ca_finance_medium_steal_info_2019_floor
      transform: direct
      rationale: Lowest of the four StatCan CSCSC cycle readings for the shard's own cell (finance and insurance, medium enterprises, data-theft incidents; 2019, 15.0%, quality B).
    likely:
      evidence_id: statcan_cscsc_ca_finance_medium_steal_info_2023_likely
      transform: direct
      rationale: Most recent StatCan CSCSC reading of the shard's own cell (2023, 20.1%, quality B).
    max:
      evidence_id: statcan_cscsc_ca_finance_medium_steal_info_2021_stress
      transform: direct
      rationale: Highest of the four StatCan CSCSC cycle readings for the shard's own cell (2021, 27.3%; StatCan quality code C, use with caution - the weakest anchor, caveated on the record).

  impact:
    min:
      evidence_id: cyentia_iris_2022_typical_cyber_event_loss_usd_ca_context
      transform: currency_convert
      target_currency: CAD
      round_to: 10000
      rationale: Source-backed global lower loss anchor converted to CAD until Canadian breach response-cost evidence is reviewed.
    likely:
      evidence_id: ibm_canada_2025_average_breach_cost_cad
      transform: direct
      round_to: 10000
      rationale: Primary IBM Canada national average breach cost (CA$6.98M, 2025), already reported in CAD, replacing the global IBM bridge and the low-confidence ITPro secondary. All-sector and enterprise-weighted, so treated as an upper-leaning mid-market likely anchor rather than a mid-market-specific figure.
    max:
      evidence_id: cyentia_iris_2025_extreme_security_incident_loss_usd_ca_context
      transform: currency_convert
      target_currency: CAD
      round_to: 100000
      rationale: Source-backed global extreme security-incident loss benchmark converted to CAD until Canadian data-breach tail-loss evidence is reviewed.
