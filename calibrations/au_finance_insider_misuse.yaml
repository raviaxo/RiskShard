metadata:
  drift_watch:
    # Pairs this calibration with the scenario file it maintains so the
    # calibration-drift gate covers it. Top-risk scenarios sit outside the
    # risk-module artifact graph, which is how the insider scenario once
    # drifted invisibly (found 2026-08-01); this block closes that gap.
    scenario: scenarios/insider_misuse.yaml
    org_profile: org_profiles/au_finance_midmarket.yaml
    threat: insider_misuse
  name: Insider Misuse calibration
  scenario_name: Insider Misuse Midmarket - Calibrated Draft
  version: "0.1"
  notes: >
    Starter calibration profile for the Insider Misuse top risk. All six direct
    parameters are source-backed, but the two sides differ sharply in strength.
    FREQUENCY has three dedicated insider records from one survey family
    (Cybersecurity Insiders/Gurucul: 51% six-or-more-attacks 2024 floor,
    83% at-least-one-incident 2024 likely, 90% 2025-survey stress; the
    previous 66%/76% figures were retracted 2026-08-01 as appearing in no
    primary source) - but "insider attacks/incidents" is broad and includes
    negligent and careless insiders, so it OVERSTATES deliberate-misuse
    frequency. IMPACT rests ENTIRELY on
    generic cross-cyber Cyentia loss bridges (typical $266k floor, median $3M
    likely, extreme $32M stress) - NONE insider-misuse-specific. This is a
    governed starter, not a human-approved benchmark; revise when
    insider-misuse-specific loss evidence is reviewed (tracked in NEXT_STEPS).
    Kept in USD (the currency of the underlying evidence) as a global top risk.

target_currency: USD

parameters:
  frequency:
    min:
      evidence_id: cybersecurity_insiders_2024_six_plus_attacks_frequency_floor
      transform: direct
      rationale: Source-backed floor - Cybersecurity Insiders 2024 report, 51% of organizations experienced six or more insider attacks in the past year; a hard floor on at-least-one prevalence that understates by construction. Broad (incl. negligent insiders), overstates deliberate misuse.
    likely:
      evidence_id: gurucul_2026_insider_incident_prevalence_2024_frequency_likely
      transform: direct
      rationale: Source-backed likely-frequency bridge - Gurucul 2026 report's 2024 reading, 83% of organizations experienced at least one insider incident (17% zero); broad exposure, not misuse-specific.
    max:
      evidence_id: gurucul_2026_insider_incident_prevalence_frequency_stress
      transform: direct
      rationale: Source-backed stress-frequency bridge - Gurucul 90% (2026) organization-level insider-incident prevalence; a different (incidents) metric, broad, not misuse-specific.

  impact:
    min:
      evidence_id: ponemon_2023_insider_credential_theft_per_incident_usd
      transform: direct
      target_currency: USD
      round_to: 1000
      rationale: Insider-specific - Ponemon/DTEX 2023 credential-theft average per-incident cost (USD 679,621). Average-by-type, not a true minimum (conservative-high floor).
    likely:
      evidence_id: ponemon_2023_malicious_insider_per_incident_usd
      transform: direct
      target_currency: USD
      round_to: 10000
      rationale: Insider-specific - Ponemon/DTEX 2023 malicious-insider average per-incident cost (USD 701,500). Materially lower than the prior generic cross-cyber median because insider incidents typically cost less than the all-incident median.
    max:
      evidence_id: cyentia_iris_2025_extreme_security_incident_loss_usd
      transform: direct
      target_currency: USD
      round_to: 100000
      rationale: >
        REMAINING GENERIC ANCHOR - Cyentia IRIS 2025 extreme security-incident loss
        (~USD 32M) as the catastrophic tail. Kept generic because a fetchable
        insider-specific mega-loss source was not available (DOJ primaries are
        bot-walled; secondary case figures are inconsistent). Min and likely are now
        insider-specific; this tail is the sole remaining cross-cyber bridge.
