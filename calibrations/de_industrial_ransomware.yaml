metadata:
  name: Germany industrial ransomware calibration
  scenario_name: Germany Industrial Ransomware Midmarket - Calibrated Draft
  version: "0.2"
  notes: >
    Benchmark-review calibration profile for a Germany mid-market industrial
    ransomware shard. Frequency likely/max use Germany company survey anchors;
    impact min uses a Germany ransom-payment lower band converted from EUR to
    USD; impact likely/max use manufacturing-sector ransomware bridges. Human
    review must accept that the source set remains cross-industry or global
    manufacturing, not a Germany industrial claims distribution.

target_currency: USD

parameters:
  frequency:
    min:
      evidence_id: cyentia_global_ransomware_probability_2025_de_context
      transform: direct
      rationale: Global ransomware likelihood floor from Cyentia IRIS Ransomware.
    likely:
      evidence_id: bitkom_de_ransomware_damage_rate_2025
      transform: direct
      rationale: Germany company ransomware damage rate from Bitkom Wirtschaftsschutz 2025.
    max:
      evidence_id: bitkom_de_ransomware_affected_rate_2025
      transform: direct
      rationale: Germany ransomware-affected survey-basis rate from Bitkom Wirtschaftsschutz 2025.

  impact:
    min:
      evidence_id: bitkom_de_ransomware_payment_floor_eur_2025
      transform: currency_convert
      target_currency: USD
      round_to: 1000
      rationale: Germany lower ransom-payment band converted from EUR to USD as a conservative impact floor.
    likely:
      evidence_id: sophos_manufacturing_ransomware_recovery_cost_usd_2025
      transform: direct
      target_currency: USD
      round_to: 100000
      rationale: Manufacturing-sector mean recovery cost excluding ransom from Sophos.
    max:
      evidence_id: sophos_manufacturing_ransomware_extreme_case_threshold_usd_2025
      transform: direct
      target_currency: USD
      round_to: 100000
      rationale: Manufacturing-sector USD 5M+ extreme ransom demand and payout threshold from Sophos.
