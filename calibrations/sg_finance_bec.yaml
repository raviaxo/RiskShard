metadata:
  name: Singapore financial-services BEC calibration
  scenario_name: Singapore Finance Business Email Compromise Midmarket - Calibrated Draft
  version: "0.3"
  notes: >
    Calibration profile for Singapore financial-services business email
    compromise. Four of six anchors are Singapore-resident (2026-08-03 rework):
    the frequency floor is SPF reported BEC cases over SingStat enterprise
    counts, the stress frequency is CSA's all-cyber organisation prevalence used
    as a deliberate ceiling (threat bridged), and both the likely and stress
    impact are SPF figures. The remaining US bridges are recorded and structural:
    frequency.likely keeps the AFP payments-fraud prevalence (no Singapore
    organisation-level BEC prevalence exists publicly) and impact.min keeps the
    DBIR median (no Singapore BEC loss floor exists publicly). Every bridge is
    caveated on its evidence record.

target_currency: USD

parameters:
  frequency:
    min:
      evidence_id: spf_singstat_sg_bec_reported_case_rate_floor_2025
      transform: direct
      rationale: Singapore reported-BEC-case floor (SPF 377 cases over SingStat 371,000 enterprises = 0.001), replacing the US IC3-over-Census floor its own record said to revise toward.
    likely:
      evidence_id: afp_2025_bec_org_prevalence_frequency_likely_sg_context
      transform: direct
      rationale: AFP 2025 US organization-level BEC prevalence kept as the threat-closest likely anchor - scouted 2026-08-03, no Singapore organisation-level BEC prevalence exists publicly, so this country bridge is structural.
    max:
      evidence_id: csa_2023_sg_org_cyber_incident_prevalence_stress
      transform: direct
      rationale: CSA Singapore all-cyber organisation prevalence (over 8 in 10, taken as 0.80) as a deliberate stress ceiling - Singapore-resident but threat-bridged, the same construct role MYOB's all-cyber 81% plays for the Australian BEC stress anchor. Replaces the US AFP 2026 payments-fraud prevalence (0.74).

  impact:
    min:
      evidence_id: verizon_dbir_2026_bec_median_loss_impact_floor_sg_context
      transform: direct
      target_currency: USD
      round_to: 1000
      rationale: Source-backed Verizon DBIR 2026 median BEC loss reused as a Singapore-context lower impact bridge. Slot declaration - this is a published median, not an observed minimum; the engine composes it as the beta-PERT floor.
    likely:
      evidence_id: spf_2025_sg_bec_average_loss_per_reported_case_usd
      transform: direct
      target_currency: USD
      round_to: 10000
      rationale: Singapore-specific average loss per reported BEC case (SPF, 2024-2025 pooled), replacing the FBI IC3 US complaint average previously used as Singapore context. Slot declaration - this is a published mean, not a calibrated mode; the engine composes it as the mode of a beta-PERT. No source consulted publishes a mode for this population.
    max:
      evidence_id: spf_2024_sg_bec_documented_case_impact_stress
      transform: direct
      target_currency: USD
      round_to: 10000
      rationale: Source-backed documented Singapore BEC case loss (SPF, ~USD 6.66M) as the stress anchor, gross of recovery.
