# Published-number revisions.
#
# When a modeled figure on the public explorer changes for a reason other than new
# evidence — a method or engine change — it is recorded here and shown on the page
# next to the number it moved. A reader who noticed the old figure can see what
# changed, why, and where the decision is written down.
#
# Evidence changes are not recorded here: those are already visible per-parameter
# (source, cited line, caveat) and in the strength ledger. This file is for changes
# to *how* the number is produced.
#
# Newest first. `effect` must state the direction and size of the move honestly.

- date: "2026-07-30"
  title: "Stale scenarios corrected: three shards now simulate the evidence they display"
  decision: "docs/internal/NEXT_STEPS.md"
  effect: >-
    US business email compromise moved from AVG USD 36,442 to USD 626,476 (P95 90,288 to
    1,659,766) - a 17x increase. Australian business email compromise moved from AVG
    AUD 55,233 to 125,110 (P95 146,347 to 356,230). Australian ransomware moved from
    AUD 8,525,254 to 8,097,631 and Canadian data breach from CAD 4,530,593 to 4,775,625,
    both about 5%. No evidence, source or caveat changed for any of them.
  reason: >-
    Each of these shards was still simulating starter placeholder values held in its
    scenario file rather than the source-backed values its own calibration produces, so
    the loss range shown was not generated by the evidence displayed beside it. US BEC was
    the most affected: it ran frequency 0.04/0.12/0.25 and impact 25k/123k/1.2M against a
    calibration of 0.004/0.63/0.74 and 50k/120k/6.4M. The scenarios now match their
    calibrations. Australian BEC was running frequency 0.12/0.25 while its reviewed
    evidence (ABS 2024-25 prevalence 0.21, MYOB 2024 mid-sized finance prevalence 0.81)
    said otherwise. A check in riskshard_doctor reports any future divergence so this
    cannot recur silently; its first version compared values with an absolute tolerance
    of 1.0, which silently exempted every frequency (probabilities are all below 1), and
    it now compares effectively exactly. The Australian data-breach shard has the same defect and is deliberately
    left for review, because correcting it would publish a mid-market figure derived from a
    UK enterprise-weighted benchmark.

- date: "2026-07-30"
  title: "Singapore BEC: local evidence, and a stale scenario corrected"
  decision: "docs/internal/NEXT_STEPS.md"
  effect: >-
    The Singapore BEC shard's modelled loss rose from AVG USD 39,164 to AVG USD 660,538.69
    (P95 1,774,130.85; P99 2,554,930.65). Two separate causes: its scenario file was still
    simulating starter assumptions (frequency 0.04/0.12/0.30, impact 25k/123k/1.2M)
    rather than the source-backed values its own calibration produces, and impact.likely
    moved from borrowed US data to Singapore data.
  reason: >-
    The published figures were computed from placeholder values while the page displayed
    source-backed evidence beside them, so the loss range was not produced by the
    evidence shown. The scenario now matches its calibration. Separately, impact.likely
    was the FBI IC3 US complaint average used as Singapore context; it is now the average
    loss per reported Singapore BEC case from the Singapore Police Force Annual Scam and
    Cybercrime Brief 2025 (377 cases / SGD 35.3M in 2025 and 368 / SGD 88.5M in 2024,
    pooled, converted at an ECB-derived SGD/USD reference rate). The value barely changed
    (USD 123,005 to 129,565) -- the borrowed figure was close -- but it is now measured in
    Singapore rather than assumed from the US.

- date: "2026-07-28"
  title: "Simulation seeds made machine-independent"
  decision: "docs/adr/0002-portable-scenario-seed.md"
  effect: >-
    Every shard's AVG/P95/P99 moved by under 2% (US BEC average USD 36,698 →
    36,442; P95 91,951 → 90,288). No evidence, source or caveat changed.
  reason: >-
    The per-scenario random seed was derived partly from the scenario file's
    absolute path on disk, so the same shard produced slightly different numbers
    depending on where the repository was checked out. Published figures could not
    be reproduced on another machine. Seeds now derive from a repository-relative
    path, so a third party running the same shard gets the same number.
