name: Deploy explorer to Pages

# Rebuilds docs/index.html from the governed data and publishes it to GitHub
# Pages whenever the evidence, scenarios, calibrations, or the generator change.
# Requires Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "evidence/**"
      - "scenarios/**"
      - "calibrations/**"
      - "risk_modules/**"
      - "extractions/**"
      - "org_profiles/**"
      - "sources/**"
      - "scripts/build_explorer.py"
      - "scripts/explorer_template.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Regenerate the explorer from repo data
        run: python scripts/build_explorer.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
