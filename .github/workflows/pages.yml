name: Deploy explorer to Pages

# Rebuilds docs/index.html from the governed data and publishes it to GitHub
# Pages whenever the evidence, scenarios, calibrations, or the generator change.
# Requires Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "evidence/**"
      - "scenarios/**"
      - "calibrations/**"
      - "risk_modules/**"
      - "extractions/**"
      - "org_profiles/**"
      - "sources/**"
      - "scripts/build_explorer.py"
      - "scripts/explorer_template.html"
      - "docs/social-card.png"
      - ".github/workflows/pages.yml"
      # The page is generated from more than the evidence. Without these, a change that
      # moves every published number (an engine change) or adds a revision note would not
      # redeploy -- and since docs/index.html is no longer committed, a missed trigger is
      # the only thing that can make the site stale.
      - "engine/**"
      - "revisions/**"
      - "aliases.yaml"
      - "data_pack_releases/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Regenerate the explorer from repo data
        run: python scripts/build_explorer.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
