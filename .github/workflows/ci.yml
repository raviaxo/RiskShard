name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Validate evidence quality gates
        run: python scripts/validate_evidence.py
      # CONTRIBUTING.md and AGENTS.md name preflight as part of the definition of done,
      # but CI never ran it until 2026-07-31.
      - name: Contributor preflight
        run: python scripts/contributor_preflight.py
      # The calibration-drift gate lives in riskshard_doctor, which CI also never ran: a
      # shard could drift away from its calibration on main and CI would stay green. Only
      # this check runs, not the whole doctor, because doctor also reports whether the
      # strength ledger has been recorded -- a release-time property that is legitimately
      # outstanding on a working branch and must not fail CI.
      - name: Calibration drift gate
        run: |
          python - <<'PY'
          import sys
          from engine.doctor import calibration_drift_check
          from engine.project_paths import find_project_root

          result = calibration_drift_check(find_project_root())
          print(f"{result['status']}: {result['detail']}")
          sys.exit(0 if result["status"] == "pass" else 1)
          PY
      - name: Package entry-point smoke test
        run: python scripts/package_smoke.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # .githooks/pre-commit only runs for clones that opted in with
      # `git config core.hooksPath .githooks`, so it protected only the maintainer.
      # Same script, same patterns, run over the pull-request range.
      - name: Scan changes for credentials
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; head="${{ github.sha }}"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base commit; scanning the latest commit only."
            base="${head}~1"
          fi
          echo "Scanning ${base}...${head}"
          sh .githooks/pre-commit "${base}...${head}"
