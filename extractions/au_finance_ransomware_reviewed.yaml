extractions:
  - id: sophos_2024_au_ransomware_attack_rate
    source_id: sophos_state_ransomware_2024
    source_name: Sophos The State of Ransomware 2024 (archived snapshot)
    source_url_or_citation: https://web.archive.org/web/20240430145048if_/https://assets.sophos.com/X24WTUEQ/at/9brgj5n44hqvgsp5f5bqcps/sophos-state-of-ransomware-2024-wp.pdf
    publication_date: "2024-04-30"
    extraction_date: "2026-08-02"
    citation_detail: Attack-rate prose (printed page 3), "the lowest reported attack rates were by respondents in Brazil (44%), Japan (51%), and Australia (54%)"; by-country chart, Australia n=330.
    fact: Sophos reported that 54% of Australian organizations were hit by ransomware in the 2024 survey.
    value: 0.54
    unit: annual_probability
    normalization_notes: Stored directly as an Australia ransomware attack-prevalence anchor.
    limitations: Attack prevalence, not loss-event frequency; all-sector Australian sample, not financial-services-specific.
    evidence_record_ids:
      - sophos_2024_au_ransomware_attack_rate_likely

  - id: sophos_2023_au_ransomware_attack_rate
    source_id: sophos_state_ransomware_2023
    source_name: Sophos The State of Ransomware 2023 (archived snapshot)
    source_url_or_citation: https://web.archive.org/web/20230511013336if_/https://assets.sophos.com/X24WTUEQ/at/c949g7693gsnjh9rb9gr8/sophos-state-of-ransomware-2023-wp.pdf
    publication_date: "2023-05-01"
    extraction_date: "2026-08-02"
    citation_detail: Additional Charts, "Rate of Ransomware Attacks by Country. 2022 vs. 2023" (printed page 18), Australia n=250/200; pairing verified visually on the rendered page.
    fact: Sophos reported that 70% of Australian organizations were hit by ransomware in the 2023 survey (80% in the 2022 survey).
    value: 0.70
    unit: annual_probability
    normalization_notes: Stored directly as the Australia ransomware stress-frequency anchor; the 2022 reading (0.80) is the documented harsher alternative.
