  - id: accc_abs_au_small_business_scam_loss_report_rate_floor_2025
    source_id: accc_targeting_scams_2025
    source_ids:
      - accc_targeting_scams_2025
      - abs_counts_australian_businesses_2025
    source_name: ACCC Targeting Scams Report 2025 and ABS Counts of Australian Businesses 2024-25
    source_url_or_citation: https://www.accc.gov.au/system/files/targeting-scams-report-2025.pdf
    publication_date: "2026-03-30"
    extraction_date: "2026-07-14"
    citation_detail: ACCC small-business section reported 287 small-business reports with financial loss; ABS reported 2,729,648 active Australian businesses at 30 June 2025.
    fact: Dividing 287 small-business Scamwatch reports with financial loss by 2,729,648 active businesses gives a reported-loss floor of 0.0001051418.
    value: 0.00010514176186819692
    unit: annual_probability
    normalization_notes: Calculated as 287 / 2,729,648 and stored as a conservative reported-loss frequency floor.
    limitations: Scamwatch loss reports are not complete BEC events, not financial-services-specific, and the denominator is all Australian businesses rather than mid-market financial-services firms.
    evidence_record_ids:
      - accc_abs_au_small_business_scam_loss_report_rate_floor_2025

