  - id: fbi_ic3_2025_bec_average_loss_per_complaint_usd
    source_id: fbi_ic3_2025_report
    source_name: FBI IC3 2025 Annual Report
    source_url_or_citation: https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf
    publication_date: "2026-04-16"
    extraction_date: "2026-06-03"
    citation_detail: Derived from the 2025 Crime Types complaint count and complaint loss tables.
    fact: Dividing USD 3,046,598,558 in BEC adjusted losses by 24,768 BEC complaints gives USD 123,005.43 average adjusted loss per complaint.
    value: 123005.43
    unit: currency
    currency: USD
    normalization_notes: Stored in source currency; calibration converts to AUD using the explicit FX assumption.
    limitations: Derived complaint average; not a tail estimate, Australia-specific benchmark, or complete event-severity distribution.
    evidence_record_ids:
      - fbi_ic3_2025_bec_average_loss_per_complaint_usd

