  - id: bitkom_de_ransomware_affected_rate_2025
    source_id: bitkom_wirtschaftsschutz_2025
    source_name: Bitkom Wirtschaftsschutz 2025
    source_url_or_citation: https://www.bitkom.org/sites/main/files/2025-12/bitkom-studienbericht-wirtschaftsschutz-2025_2.pdf
    publication_date: "2025-12-01"
    extraction_date: "2026-07-14"
    citation_detail: Section 3.2, figure 12.
    fact: Bitkom's ransom-payment chart uses a basis of 588 companies affected by ransomware attacks out of the 1,002-company survey base.
    value: 0.59
    unit: annual_probability
    normalization_notes: Calculated as 588 / 1,002 = 0.5868 and rounded to 0.59.
    limitations: Derived from chart basis counts, cross-industry, and broader than damage-causing ransomware.
    evidence_record_ids:
      - bitkom_de_ransomware_affected_rate_2025

