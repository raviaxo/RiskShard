extractions:
  - id: opc_cira_ca_org_customer_employee_data_breach_prevalence_2026
    source_id: opc_annual_report_2025_2026
    source_name: OPC 2025-2026 Annual Report to Parliament
    source_url_or_citation: https://www.priv.gc.ca/en/opc-actions-and-decisions/ar_index/202526/ar_202526/
    publication_date: "2026-06-04"
    extraction_date: "2026-07-13"
    citation_detail: Top trends in privacy reports that 42% of Canadian organizations experienced a breach of customer or employee data in the last 12 months; footnote 8 cites the CIRA survey.
    fact: OPC reported, citing CIRA, that 42% of Canadian organizations experienced a breach of customer or employee data in the last 12 months.
    value: 0.42
    unit: annual_probability
    normalization_notes: Stored as 0.42 annual probability and selected as the likely organization-level data-breach prevalence anchor for the Canada starter.
    limitations: Cross-sector Canadian organization survey fact; not financial-services-specific, mid-market-specific, or limited to material/regulator-reportable breaches.
    evidence_record_ids:
      - opc_cira_ca_org_customer_employee_data_breach_prevalence_2026
      - opc_cira_ca_material_data_breach_prevalence_proxy_2026

  - id: opc_2026_pipeda_significant_harm_breach_share
    source_id: opc_annual_report_2025_2026
    source_name: OPC 2025-2026 Annual Report to Parliament
    source_url_or_citation: https://www.priv.gc.ca/en/opc-actions-and-decisions/ar_index/202526/ar_202526/
    publication_date: "2026-06-04"
    extraction_date: "2026-07-13"
    citation_detail: Breaches section reports that 58% of PIPEDA breaches were likely to create a real risk of significant harm.
    fact: OPC reported that 58% of PIPEDA breaches were likely to create a real risk of significant harm.
    value: 0.58
    unit: share_of_reported_pipeda_breaches
    normalization_notes: Multiplied by the 0.42 Canadian organization data-breach prevalence fact to produce a low-confidence material-breach proxy of 0.2436.
    limitations: Conditional on reported PIPEDA breaches; not an organization-level probability, and not financial-services-specific.
    evidence_record_ids:
      - opc_cira_ca_material_data_breach_prevalence_proxy_2026

