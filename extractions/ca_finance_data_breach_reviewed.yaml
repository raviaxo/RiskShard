  - id: netdiligence_2025_ca_hacker_claims_average_cost_usd
    source_id: netdiligence_cyber_claims_2025
    source_name: NetDiligence Cyber Claims Study 2025 (Fifteenth Annual)
    source_url_or_citation: https://netdiligence.com/cyber-claims-study-2025-report/
    publication_date: "2025-09-23"
    extraction_date: "2026-08-02"
    citation_detail: Claims from Canada section (page 49, Table 2, Canada Top Causes of Loss 2020-2024) reports the Hacker cause of loss at 8 claims with an average incident cost of USD 66K.
    fact: NetDiligence reported an average incident cost of USD 66,000 across 8 Canadian Hacker-cause claims, 2020-2024.
    value: 66000
    unit: currency
    currency: USD
    normalization_notes: Stored in source currency USD and used as a conservative Canadian per-incident floor; calibration converts to CAD.
    limitations: N=8 claims; an average used as a floor, not a minimum quantile; cause-of-loss taxonomy, not confirmed data compromise; all-sector, enterprise-leaning, insured claims only.
    evidence_record_ids:
      - netdiligence_2025_ca_hacker_claims_average_cost_usd

  - id: itpro_ibm_ca_2025_average_breach_cost_usd
    source_id: itpro_ibm_data_breach_regional_costs_2025
    source_name: ITPro coverage of IBM Cost of a Data Breach Report 2025
    source_url_or_citation: https://www.itpro.com/security/data-breaches/ai-breaches-arent-just-a-scare-story-any-more-theyre-happening-in-real-life
    publication_date: "2025-08-04"
    extraction_date: "2026-07-13"
    citation_detail: Data breach winners and losers section reports Canada breach costs rising from USD 4.66M to USD 4.84M, citing IBM's 2025 Cost of a Data Breach report.
    fact: ITPro reported, citing IBM's 2025 Cost of a Data Breach report, that Canada's average breach cost rose from USD 4.66 million to USD 4.84 million.
    value: 4840000
    unit: currency
    currency: USD
    normalization_notes: Stored in source currency and used as a Canada-specific, secondary-source likely loss bridge. Calibration converts to CAD through the explicit Bank of Canada FX assumption.
    limitations: Secondary article, not primary IBM Canada release; not financial-services-specific or size-band-specific.
    evidence_record_ids:
      - itpro_ibm_ca_2025_average_breach_cost_usd

