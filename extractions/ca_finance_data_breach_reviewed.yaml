extractions:
  - id: statcan_cscsc_ca_finance_medium_steal_info_2019_floor
    source_id: statcan_cscsc_incident_types_22100076
    source_name: Statistics Canada Table 22-10-0076-01 (Canadian Survey of Cyber Security and Cybercrime)
    source_url_or_citation: https://www150.statcan.gc.ca/n1/tbl/csv/22100076-eng.zip
    publication_date: "2024-10-21"
    extraction_date: "2026-08-02"
    citation_detail: Table cell "Incidents to steal personal or financial information" x "Finance and insurance [52]" x "Medium size enterprises", reference year 2019, reads 15.0% (quality B); medium is 50 to 249 employees (footnote 8).
    fact: StatCan reported that 15.0% of Canadian finance-and-insurance medium-size enterprises were impacted by incidents to steal personal or financial information in 2019, the lowest of the four survey cycles.
    value: 0.15
    unit: annual_probability
    normalization_notes: Stored as 0.15 annual probability; lowest same-cell reading across the 2017/2019/2021/2023 cycles, used as the frequency floor.
    limitations: Motive-classified impactful incidents, not confirmed breaches; StatCan medium is 50-249 employees while the shard org profile models 450; survey covers enterprises with 10+ employees.
    evidence_record_ids:
      - statcan_cscsc_ca_finance_medium_steal_info_2019_floor

