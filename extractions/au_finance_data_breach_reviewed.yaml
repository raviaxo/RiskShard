  - id: securitybrief_ibm_2026_au_finserv_breach_average_cost
    source_id: securitybrief_ibm_au_breach_costs_2026
    source_name: SecurityBrief Australia coverage of IBM Cost of a Data Breach 2026
    source_url_or_citation: https://securitybrief.com.au/story/australia-breach-costs-hit-aud-4-22-million-ibm-says
    publication_date: "2026-07-31"
    extraction_date: "2026-08-02"
    citation_detail: Article sentence "Financial services recorded the highest average breach cost at AUD $6.31 million per incident"; Australian average AUD 4.22M in the same coverage.
    fact: SecurityBrief reported IBM's 2026 Australian industry cut with financial services the costliest at AUD 6.31 million average breach cost per incident.
    value: 6310000
    unit: currency
    currency: AUD
    normalization_notes: Stored in AUD as reported; selected as the Australia financial-services likely-impact anchor, no FX conversion.
    limitations: Secondary coverage of the gated IBM report; per-cell sample size unpublished (thin by construction); enterprise-leaning studied population; an average, not a quantile.
