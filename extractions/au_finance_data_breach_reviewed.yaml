    source_url_or_citation: https://www.gov.uk/government/statistics/cyber-security-breaches-survey-20252026/cyber-security-breaches-survey-20252026
    publication_date: "2026-04-30"
    extraction_date: "2026-07-13"
    citation_detail: Summary and Chapter 4 business-size prevalence.
    fact: The survey reported that 65% of UK medium businesses identified a cyber security breach or attack in the last 12 months.
    value: 0.65
    unit: annual_probability
    normalization_notes: Converted 65% to 0.65 and stored as a source-backed bridge for AU likely frequency.
    limitations: UK official survey; broad cyber breach/attack prevalence; not Australia-specific or financial-services-specific.
