  - id: oaic_abs_au_finance_ndb_notification_rate_floor_2025
    source_id: oaic_ndb_jul_dec_2024
    source_ids:
      - oaic_ndb_jul_dec_2024
      - abs_counts_australian_businesses_2025
    source_name: OAIC NDB Report July-Dec 2024 and ABS Counts of Australian Businesses 2024-25
    source_url_or_citation: https://www.oaic.gov.au/__data/assets/pdf_file/0021/251184/Notifiable-data-breaches-report-July-to-December-2024.pdf
    publication_date: "2025-05-13"
    extraction_date: "2026-06-03"
    citation_detail: OAIC Page 15, Table 5 reported 54 finance notifications for July-Dec 2024; ABS industry section reported 133,743 Financial and Insurance Services businesses in 2024-25.
    fact: Annualizing 54 half-year finance NDB notifications and dividing by 133,743 active Financial and Insurance Services businesses gives a rate of 0.0008075.
    value: 0.0008
    unit: annual_probability
    normalization_notes: Rounded to 0.0008 and stored as a reported-notification frequency floor, not a likely breach rate.
    limitations: Covers eligible Australian NDB notifications only; all-size sector denominator is not mid-market-specific; multiple notifications by one entity and unreported/non-reportable breaches can distort organization-level probability.
    evidence_record_ids:
      - oaic_abs_au_finance_ndb_notification_rate_floor_2025

