  - id: privacy_act_1988_body_corporate_serious_privacy_penalty_cap_2026
    source_id: privacy_act_1988_latest
    source_name: Privacy Act 1988
    source_url_or_citation: https://www.legislation.gov.au/C2004A03712/latest/text
    publication_date: "2026-06-04"
    extraction_date: "2026-07-14"
    citation_detail: Section 13G(3), Federal Register compilation C2026C00227, compilation date 4 June 2026.
    fact: Section 13G provides that for serious interference with privacy by a body corporate, the maximum pecuniary penalty is the greatest of AUD 50,000,000, three times benefit, or 30% adjusted turnover when benefit cannot be determined.
    value: 50000000
    unit: currency
    currency: AUD
    normalization_notes: Stored the fixed AUD 50 million limb as an Australian privacy regulatory stress anchor; the benefit and turnover limbs require organization-specific inputs and are not modeled in this starter calibration.
    limitations: Statutory maximum penalty cap, not a total event-loss estimate, not expected loss, not financial-services-specific, and actual penalties depend on regulator and court facts.
    evidence_record_ids:
      - privacy_act_1988_au_body_corporate_serious_privacy_penalty_cap_2026

