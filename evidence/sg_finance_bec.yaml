records:
  - id: ic3_census_global_bec_reported_complaint_rate_floor_sg_context
    title: Global reported-BEC-complaint rate floor used as Singapore context
    parameter: frequency.min
    value: 0.004
    unit: annual_probability
    source_id: fbi_ic3_2025_report
    source_ids:
      - fbi_ic3_2025_report
      - census_susb_2022
    source_name: FBI IC3 2025 Annual Report and U.S. Census SUSB 2022
    source_type: derived_statistical_benchmark_bridge
    source_url_or_citation: https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf
    publication_date: "2026-04-16"
    extraction_date: "2026-07-20"
    citation_detail: FBI IC3 2025 reported 24,768 US BEC complaints; US Census SUSB 2022 reports ~6.1M US employer firms; 24,768 / 6,100,000 = 0.004.
    extraction_notes: Reused the US reported-BEC-complaint rate floor as a global-context bridge for Singapore.
    normalization_notes: 24,768 / 6,100,000 = 0.00406, rounded to 0.004. A reported-complaint floor, not a likely rate.
    limitations: GLOBAL BRIDGE, NOT SINGAPORE-SPECIFIC. Both numerator and denominator are United States figures (IC3 complaints, US Census firms); used only as a conservative global reported-complaint floor until a Singapore denominator-derived BEC frequency (e.g. SPF business-email-impersonation cases over SingStat enterprise counts) is reviewed.
    confidence: low
    evidence_type: source_backed
    applicability:
      industries: [financial_services]
      countries: [SG, global]
      company_size_bands: [mid_market]
      threats: [business_email_compromise]

  - id: afp_2025_bec_org_prevalence_frequency_likely_sg_context
    title: US organization-level BEC prevalence used as Singapore likely-frequency bridge
    parameter: frequency.likely
    value: 0.63
    unit: annual_probability
    source_id: afp_payments_fraud_2025
    source_name: 2025 AFP Payments Fraud and Control Survey Report
    source_type: industry_survey_bridge
    source_url_or_citation: https://web.archive.org/web/20250707164054/https://www.financialprofessionals.org/training-resources/resources/survey-research-economic-data/details/payments-fraud
    publication_date: "2025-08-26"
    extraction_date: "2026-07-20"
    citation_detail: The 2025 AFP Payments Fraud and Control Survey reports business email compromise as the most common payments-fraud method, with 63% of organizations reporting BEC activity in 2024.
    extraction_notes: Reused the US AFP organization-level BEC prevalence as a global-context likely-frequency bridge for Singapore.
    normalization_notes: Converted 63% to 0.63.
    limitations: GLOBAL BRIDGE, NOT SINGAPORE-SPECIFIC. US survey; measures organizations experiencing attempted or actual BEC, not confirmed loss events; respondents skew corporate-treasury and larger organizations. Revise when a Singapore organization-level BEC prevalence is reviewed.
    confidence: low
    evidence_type: source_backed
    applicability:
      industries: [financial_services]
      countries: [SG, global]
      company_size_bands: [mid_market]
      threats: [business_email_compromise]

