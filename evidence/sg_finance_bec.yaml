    source_id: spf_bec_interception_case_2024
    source_name: SPF Business Email Compromise scam interception case 2024
    source_type: law_enforcement_report
    source_url_or_citation: https://www.police.gov.sg/media-hub/news/2024/20241008_international_cooperation_leading_to_the_interception
    publication_date: "2024-10-08"
    extraction_date: "2026-07-20"
    citation_detail: SPF reports that a Singapore-based investment banking firm initiated transfers of about USD 6.66 million to a scammer on 19-20 September 2024 in a business email compromise scam; SPF and US authorities intercepted over USD 5 million.
    extraction_notes: Used the USD 6.66 million gross transferred amount as a source-backed, Singapore-specific stress impact anchor.
    normalization_notes: Stored in USD as a single-event stress (tail) BEC loss, gross of the intercepted/recovered amount. Sits above the USD 123,005 mean used for impact.likely.
    limitations: One documented extreme Singapore BEC case (an investment banking firm), not a mid-market average or a loss percentile; over USD 5M was intercepted, but recovery is not guaranteed so the gross figure is modeled. Revise when a Singapore BEC loss distribution with tail quantiles is reviewed.
