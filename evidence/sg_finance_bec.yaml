records:
  - id: spf_singstat_sg_bec_reported_case_rate_floor_2025
    title: Singapore reported-BEC-case rate floor (SPF cases over SingStat enterprises)
    parameter: frequency.min
    value: 0.001
    unit: annual_probability
    source_id: spf_annual_scam_cybercrime_brief_2025
    source_ids:
      - spf_annual_scam_cybercrime_brief_2025
      - singstat_enterprise_landscape_m600981
    source_name: SPF Annual Scam and Cybercrime Brief 2025 and SingStat Enterprise Landscape M600981
    source_type: derived_law_enforcement_statistical_benchmark
    source_url_or_citation: https://www.police.gov.sg/-/media/SPF/Media-Room/Statistics/Annual-Scams-and-Cybercrime-Brief-2025/Annual-Scam-and-Cybercrime-Brief-2025.pdf
    publication_date: "2026-02-26"
    extraction_date: "2026-08-03"
    citation_detail: SPF Annex (printed page 22) reports 377 Business Email Compromise scam cases in 2025 (368 in 2024); SingStat Table M600981 row "Enterprises Count, Total" reads 371.0 thousand enterprises for 2025. 377 / 371,000 = 0.001016. Both cells verified in the gathered artifacts.
    extraction_notes: Replaces the US-derived IC3-over-Census floor (0.004), whose own limitations named exactly this revision - SPF BEC cases over SingStat enterprise counts. Both numerator and denominator are now Singapore figures; the floor falls from 0.004 to 0.001 because Singapore's reported-case rate is lower than the US complaint rate, not because the risk shrank.
    normalization_notes: 377 / 371,000 = 0.001016, rounded to 0.001. A reported-case floor, not a likely rate - unreported incidents make the true rate higher, which is why this anchors only the minimum.
    limitations: Reported police cases only - BEC is heavily under-reported, so this is a hard floor, not an incidence estimate. The numerator counts all reported Singapore BEC cases across every sector and victim size while the denominator counts all enterprises, so the ratio is all-sector, all-size by construction (sector stays bridged for a financial-services shard). Case counts and enterprise counts come from different collection systems; multiple cases can involve one organisation. The SingStat API serves the latest table revision (rolling) - re-verify the denominator on re-gathering.
    confidence: medium
    evidence_type: source_backed
    population_match:
      status: bridged
      bridged_on: [sector]
    applicability:
      industries: [all]
      countries: [SG]
      company_size_bands: [all]
      threats: [business_email_compromise]

  - id: afp_2025_bec_org_prevalence_frequency_likely_sg_context
    title: US organization-level BEC prevalence used as Singapore likely-frequency bridge
    parameter: frequency.likely
    value: 0.63
    unit: annual_probability
    source_id: afp_payments_fraud_2025
    source_name: 2025 AFP Payments Fraud and Control Survey Report
    source_type: industry_survey_bridge
    source_url_or_citation: https://web.archive.org/web/20250707164054/https://www.financialprofessionals.org/training-resources/resources/survey-research-economic-data/details/payments-fraud
    publication_date: "2025-08-26"
    extraction_date: "2026-07-20"
    citation_detail: The 2025 AFP Payments Fraud and Control Survey reports business email compromise as the most common payments-fraud method, with 63% of organizations reporting BEC activity in 2024.
    extraction_notes: Reused the US AFP organization-level BEC prevalence as a global-context likely-frequency bridge for Singapore.
    normalization_notes: Converted 63% to 0.63.
    limitations: GLOBAL BRIDGE, NOT SINGAPORE-SPECIFIC. US survey; measures organizations experiencing attempted or actual BEC, not confirmed loss events; respondents skew corporate-treasury and larger organizations. Scouted 2026-08-03 - no Singapore organisation-level BEC-specific prevalence exists publicly (the CSA Health Report 2023 publishes only an all-cyber prevalence, used as this shard's stress ceiling; SPF publishes case counts, not organisation prevalence), so this US anchor is kept as the threat-closest likely rate and the country bridge here is structural until CSA publishes per-incident-type prevalence.
    confidence: low
    evidence_type: source_backed
    population_match:
      status: bridged
      bridged_on: [country]
    applicability:
      industries: [financial_services]
      countries: [SG, global]
      company_size_bands: [mid_market]
      threats: [business_email_compromise]

  - id: csa_2023_sg_org_cyber_incident_prevalence_stress
    title: Singapore organisation cyber-incident prevalence used as BEC stress ceiling
    parameter: frequency.max
    value: 0.80
    unit: annual_probability
    source_id: csa_cybersecurity_health_report_2023
    source_name: CSA Singapore Cybersecurity Health Report 2023
    source_type: government_report
    source_url_or_citation: https://isomer-user-content.by.gov.sg/36/1051bace-6be7-4c59-934a-e43c952a32ed/csa-singapore-cybersecurity-health-report-2023.pdf
    publication_date: "2024-03-26"
    extraction_date: "2026-08-03"
    citation_detail: Threat Landscape section reads "OVER 8 IN 10 organisations have encountered a cybersecurity incident in a year" (survey of 2,036 Singapore organisations, May-August 2023). Verified in the gathered artifact; "over 8 in 10" taken conservatively as 0.80.
    extraction_notes: Replaces the US AFP 2026 payments-fraud prevalence (0.74) as the stress anchor. The trade is country-for-threat - the CSA figure is Singapore-resident but all-cyber, so it serves as a ceiling (BEC prevalence cannot exceed all-incident prevalence), the same construct role the MYOB all-cyber 81% plays for the Australian BEC shard's stress anchor.
    normalization_notes: '"Over 8 in 10" stored conservatively as 0.80; the report publishes no more precise overall prevalence figure.'
    limitations: ALL-CYBER, NOT BEC-SPECIFIC - the report publishes no per-incident-type organisation prevalence, so this is a deliberate stress ceiling (any-incident prevalence bounds BEC prevalence from above), not a BEC rate; the threat dimension is bridged. All-sector, all-size Singapore sample (2,036 organisations including non-profits); sector stays bridged for a financial-services shard. Survey-based, single 2023 fielding - no trend series yet. Encounter construct includes incidents without material loss.
    confidence: medium
    evidence_type: source_backed
    population_match:
      status: bridged
      bridged_on: [sector, threat]
    applicability:
      industries: [all]
      countries: [SG]
      company_size_bands: [all]
      threats: [all]

