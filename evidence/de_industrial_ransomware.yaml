  - id: bitkom_de_ransomware_payment_floor_eur_2025
    title: German ransomware ransom-payment lower band
    parameter: impact.min
    value: 10000
    unit: currency
    currency: EUR
    source_id: bitkom_wirtschaftsschutz_2025
    source_name: Bitkom Wirtschaftsschutz 2025
    source_type: official_statistics
