  - id: cyentia_iris_2025_median_security_incident_loss_usd_de_industrial_context
    title: Median reported security-incident loss for Germany industrial starter
    parameter: impact.likely
    value: 3000000
    unit: currency
    currency: USD
    source_id: cyentia_iris_2025
    source_name: Cyentia Information Risk Insights Study 2025
    source_type: cyber_loss_research
    source_url_or_citation: https://www.cyentia.com/publication/iris2025/
    publication_date: "2025-06-10"
    extraction_date: "2026-07-13"
    artifact_verified_at: "2026-11-20"
    artifact_verified_sha256: 00706bbbfefcc7b6cc321dcbcc2347b3082af92572cbd55abd2239a901cf8f1c
    citation_detail: Public source page key findings; median losses rose toward USD 3M.
    extraction_notes: Reused the governed Cyentia median security-incident loss anchor for the Germany industrial starter.
    normalization_notes: 'Stored directly in USD as an unselected comparison anchor after the Sophos manufacturing recovery-cost bridge was selected. The publisher figure is USD 2,900,000 (Figure 10); USD 3,000,000 is the "almost $3 million" prose rounding carried by the summary page this record was extracted from. The rounding is kept because it is what the publisher states in prose, and the finer figure is recorded here rather than substituted.'
    limitations: 'Global security-incident benchmark, not Germany-specific, ransomware-only, manufacturing-specific, mid-market-specific, or selected by the current calibration. Construct note added 2026-11-20 from the held report: this is NOT the median of the study loss distribution, which Figure 9 puts at USD 603,000. It is the 2024 endpoint of a 15-year trend (Figure 10, median rising from USD 189,900 in 2008 to USD 2,900,000 in 2024, a 15.20x increase), so it is a single-year median sitting about 4.8x above the pooled 2015-2024 median. Anyone comparing it against another source pooled median is off by roughly five-fold.'
    confidence: low
    evidence_type: source_backed
    measurement_basis: median_total_event_cost
    applicability:
      industries: [all]
      countries: [global]
      company_size_bands: [all]
      threats: [all]

  - id: sophos_manufacturing_ransomware_recovery_cost_usd_2025
    title: Manufacturing ransomware recovery cost
    parameter: impact.likely
    value: 1300000
    unit: currency
    currency: USD
    source_id: sophos_state_ransomware_manufacturing_2025
    source_name: Sophos State of Ransomware in Manufacturing and Production 2025
    source_type: industry_survey
    source_url_or_citation: https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025
    publication_date: "2025-12-04"
    extraction_date: "2026-07-14"
    artifact_verified_at: "2026-11-20"
    artifact_verified_sha256: c579c711f3004db660c547e4c73be6b0e4997cb5b76fffacabebacf928f99eae
    citation_detail: 'Recovery costs section; the report states that the AVERAGE recovery cost, excluding any ransom payments, dropped 24% to USD 1.3M in 2025 from USD 1.7M in 2024, on a base of n=332. The report does not say mean or median here, and the same report writes "average (median)" for its ransom figures, so the statistic is unqualified in the source.'
    extraction_notes: 'Sophos reported that the average cost of recovery, excluding any ransoms paid, dropped to USD 1.3 million for manufacturing and production organizations. Corrected on 2026-11-20 from "mean" during the ADR-0024 artifact-fit re-read - the report says only "average" here while writing "average (median)" elsewhere, so it distinguishes the two and this record had resolved its silence in our own favour.'
    normalization_notes: 'Stored directly in USD as a manufacturing-sector ransomware likely-loss bridge. USD 1.3M is the report prose figure; Chart 11 publishes USD 1.27M for manufacturing and production specifically, on the same base of n=332. The prose rounding is what the publisher states and is kept, with the more precise chart figure recorded here rather than substituted.'
    limitations: 'Global manufacturing survey of organizations hit by ransomware; excludes ransoms paid, is not Germany-specific, and is not a full total-loss distribution. Base stated in the report - n=332 manufacturing and production organizations for 2025, n=378 for 2024, n=205 for 2023. The blog page this record cites does not carry that base.'
    confidence: medium
    evidence_type: source_backed
    measurement_basis: cost_component
    applicability:
      industries: [manufacturing]
      countries: [global]
      company_size_bands: [mid_market, enterprise]
      threats: [ransomware]

  - id: cyentia_iris_2025_extreme_security_incident_loss_usd_de_industrial_context
    title: Extreme reported security-incident loss for Germany industrial starter
    parameter: impact.max
    value: 32000000
    unit: currency
    currency: USD
    source_id: cyentia_iris_2025
    source_name: Cyentia Information Risk Insights Study 2025
    source_type: cyber_loss_research
    source_url_or_citation: https://www.cyentia.com/publication/iris2025/
    publication_date: "2025-06-10"
    extraction_date: "2026-07-13"
    artifact_verified_at: "2026-11-20"
    artifact_verified_sha256: 00706bbbfefcc7b6cc321dcbcc2347b3082af92572cbd55abd2239a901cf8f1c
    citation_detail: Public source page key findings; extreme events reached USD 32M.
    extraction_notes: Reused the governed Cyentia extreme security-incident loss anchor for the Germany industrial starter.
    normalization_notes: 'Stored directly in USD as an unselected comparison anchor after the Sophos manufacturing stress threshold was selected. Worth not reconciling later: the publisher key-findings page puts the 32M beside a 5-fold rise, but that rise belongs to the 90th percentile, which Figure 10 tracks from USD 6,000,000 in 2008 to USD 28,500,000 in 2024. The 32M is the pooled 95th percentile from Figure 9. They are different statistics and neither is wrong.'
    limitations: 'Global security-incident benchmark, not Germany-specific, ransomware-only, manufacturing-specific, selected by the current calibration, or a formal percentile for this scenario. It IS a formal percentile - the 95th of the study reported-loss distribution - but of a global all-incident population rather than this scenario, so the percentile is real and the population is not ours. Corrected 2026-11-20: this field said the figure was not "a formal percentile for this scenario", which read as no percentile existing, and that reading is the ADR-0024 defect in its original form.'
    confidence: low
    evidence_type: source_backed
    measurement_basis: observed_extremum
    exceedance_basis: 'modeled_quantile'
    exceedance_detail: 'USD 32,000,000 is the 95th percentile of the distribution of reported losses for security incidents from 2015 to 2024 (Cyentia Institute, Information Risk Insights Study 2025, Figure 9, labelled "$32M (95%)", and the body text - "The typical (median) incident costs about $600K, while more extreme (95th percentile) losses swell to $32 million"). Roughly 5% of reported security incidents in that corpus exceed this figure. The exceedance is over LOSSES REPORTED IN PUBLIC RECORDS, not over all incidents - the study notes its losses tend to be direct costs identifiable from breach disclosures, public company filings and litigation, which biases the corpus toward events that became public. Read from the held report on 2026-11-20. This record declared none_known until then because it was extracted from the publisher summary page, which states the 32M figure without the percentile (ADR-0024, ADR-0026).'
    applicability:
      industries: [all]
      countries: [global]
      company_size_bands: [all]
      threats: [all]

  - id: sophos_manufacturing_ransomware_extreme_case_threshold_usd_2025
    title: Manufacturing ransomware extreme case threshold
    parameter: impact.max
    value: 5000000
    unit: currency
    currency: USD
    source_id: sophos_state_ransomware_manufacturing_2025
    source_name: Sophos State of Ransomware in Manufacturing and Production 2025
    source_type: industry_survey
    source_url_or_citation: https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025
    publication_date: "2025-12-04"
    extraction_date: "2026-08-16"
    artifact_verified_at: "2026-11-20"
    artifact_verified_sha256: c579c711f3004db660c547e4c73be6b0e4997cb5b76fffacabebacf928f99eae
    citation_detail: 'Ransoms section: "extreme payments of $5 million or more - accounting for 18% of payments in 2025 - up from 15% last year", alongside extreme demands of $5 million or more accounting for a fifth (20%) of demands.'
    extraction_notes: 'Read from the report on 2026-08-16, replacing an earlier extraction that recorded only that extreme $5M+ cases had risen slightly. The share is stated in prose, so the threshold now carries a published exceedance rather than none. Re-read against the held report on 2026-11-20 as part of the ADR-0024 artifact-fit campaign; the quoted passage matched the publisher file exactly and no value moved.'
    normalization_notes: Stored as a manufacturing-sector stress threshold, not as a mathematically observed maximum.
    limitations: 'A ransom PAYMENT threshold, not a total event loss - the shard composes it as an impact maximum and those are different quantities. Not Germany-specific: the survey is global manufacturing and production. The 18% exceedance is over organizations that paid a ransom, a narrower and self-selected denominator than all organizations attacked, so it understates nothing about non-payers and says nothing about them either. The denominator is also thin - n=67 payments in 2025, so the 82nd percentile is read off about 12 organizations and the 2024 comparison is drawn against n=157. Treat the percentile as directional, not precise.'
    confidence: medium
    evidence_type: source_backed
    measurement_basis: observed_extremum
    exceedance_basis: modeled_quantile
    exceedance_detail: '18% of ransom payments made by manufacturing and production organizations were $5 million or more in 2025, up from 15% in 2024 (Sophos, State of Ransomware in Manufacturing and Production 2025, ransom payments section). $5M therefore sits at the 82nd percentile of that published payment distribution. The exceedance is over organizations that PAID a ransom, not over all organizations attacked. The base is stated in the report and it is small - Chart 8 reads n=67 for 2025 and n=157 for 2024, so 18% is about 12 organizations and the 2024 figure of 15% was about 24. The share rose while the count roughly halved, because the number of manufacturing organizations disclosing a payment fell 57%. Verified against the held report on 2026-11-20 (ADR-0023 - the blog page this record cites does not carry the base).'
    applicability:
      industries: [manufacturing]
      countries: [global]
      company_size_bands: [mid_market, enterprise]
      threats: [ransomware]
