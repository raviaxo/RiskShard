    publication_date: "2025-12-01"
    extraction_date: "2026-07-14"
    citation_detail: Section 3.2, figure 12; ransom-payment bands include EUR 10,000-100,000, EUR 100,000-500,000, EUR 500,000-1M, and EUR 1M+.
    extraction_notes: Used the lower edge of Bitkom's smallest nonzero ransom-payment band as a Germany ransomware impact floor.
    normalization_notes: Stored in EUR. Calibration converts to USD using the explicit ECB EUR/USD assumption in calibrations/fx_rates.yaml.
    limitations: Payment-only lower-band anchor, not total event loss, recovery cost, downtime, or a Germany industrial claims distribution.
