records:
  - id: cybersecurity_insiders_2019_insider_attack_prevalence_frequency_floor
    title: Organization-level insider-attack prevalence (2019 baseline) used as frequency floor
    parameter: frequency.min
    value: 0.66
    unit: annual_probability
    source_id: cybersecurity_insiders_insider_threat_2024
    source_name: Cybersecurity Insiders 2024 Insider Threat Report
    source_type: industry_survey_bridge
    source_url_or_citation: https://web.archive.org/web/20241229032228/https://www.cybersecurity-insiders.com/portfolio/2024-insider-threat-report-gurucul/
    publication_date: "2024-06-01"
    extraction_date: "2026-07-20"
    citation_detail: The Cybersecurity Insiders 2024 Insider Threat Report states that the share of organizations experiencing insider attacks rose from 66% in 2019 to 76% in 2024; the 66% figure is used here as a historical floor.
    extraction_notes: Converted the 66% (2019) organization-level insider-attack prevalence to 0.66 as a source-backed frequency floor.
    normalization_notes: Converted 66% to 0.66. Used as a historical-baseline exposure floor, below the 0.76 current-prevalence likely.
    limitations: Vendor-sponsored survey, lower trust than official statistics; "insider attacks" is broad and includes negligent and careless insiders, not only deliberate misuse, so it overstates misuse-specific frequency; a 2019 baseline used as a conservative floor. Revise when misuse-specific or sector-specific insider frequency is reviewed.
    confidence: low
    evidence_type: source_backed
    applicability:
      industries: [all]
      countries: [global]
      company_size_bands: [all]
      threats: [insider_misuse]

