    extraction_date: "2026-07-20"
    citation_detail: The Cybersecurity Insiders 2024 Insider Threat Report reports that 76% of organizations experienced insider attacks in 2024 (up from 66% in 2019).
    extraction_notes: Converted the 76% (2024) organization-level insider-attack prevalence to 0.76 as a source-backed likely-frequency exposure bridge.
    normalization_notes: Converted 76% to 0.76. Selected as a current organization-level insider-attack exposure bridge.
    limitations: Vendor-sponsored survey, lower trust than official statistics; "insider attacks" is broad and includes negligent and careless insiders, not only deliberate misuse, so it overstates misuse-specific frequency; not sector- or size-specific. Revise when misuse-specific insider frequency is reviewed.
    confidence: low
    evidence_type: source_backed
    applicability:
