records:
  - id: bci_2024_third_party_failure_top_cause_frequency_floor
    title: Third-party failure as top disruption cause used as frequency floor
    parameter: frequency.min
    value: 0.44
    unit: annual_probability
    source_id: bci_supply_chain_resilience_2024
    source_name: BCI Supply Chain Resilience Report 2024
    source_type: industry_survey_bridge
    source_url_or_citation: https://web.archive.org/web/20260701164556/https://www.thebci.org/news/supply-chain-disruptions-drive-increased-tier-mapping-and-insurance-uptake.html
    publication_date: "2024-11-01"
    extraction_date: "2026-08-01"
    citation_detail: "The BCI news release for the Supply Chain Resilience Report 2024 states: 43.6% of organizations experienced supply chain disruption due to third party failures — the most frequent cause of disruption."
    extraction_notes: Used the 43.6% share of organizations that experienced third-party-caused disruption (rounded to 0.44) as a third-party-specific frequency floor. Re-anchored 2026-08-01 to BCI's own news release, which states the figure on a gatherable page (the report landing page never carried it); BCI's phrasing is a per-organization experienced-disruption share, a stronger construct than the top-cause share previously described.
    normalization_notes: Converted 43.6% to 0.44. Used as a conservative third-party-attributable disruption floor, below the broad ~0.80 disruption likely.
    limitations: Vendor-membership survey (BCI members skew resilience-mature), lower trust than official statistics; supply-chain disruption due to third-party failure is broader than a third-party IT/service outage, and the survey window is one year of member experience, not a clean per-organization annual probability; not sector- or size-specific. Revise when a third-party-outage-specific organization-level frequency is reviewed.
    confidence: low
    evidence_type: source_backed
    applicability:
      industries: [all]
      countries: [global]
      company_size_bands: [all]
      threats: [third_party_outage]

  - id: bci_2024_supply_chain_disruption_prevalence_frequency_likely
    title: Organization-level supply-chain disruption prevalence used as likely frequency
    parameter: frequency.likely
    value: 0.80
    unit: annual_probability
    source_id: bci_supply_chain_resilience_2024
    source_name: BCI Supply Chain Resilience Report 2024
    source_type: industry_survey_bridge
    source_url_or_citation: https://web.archive.org/web/20260701164556/https://www.thebci.org/news/supply-chain-disruptions-drive-increased-tier-mapping-and-insurance-uptake.html
    publication_date: "2024-11-01"
    extraction_date: "2026-08-01"
    citation_detail: "The BCI news release for the Supply Chain Resilience Report 2024 states: almost 80% of organizations' supply chains were disrupted over the past twelve months, with most experiencing between one and ten disruptions."
    extraction_notes: Converted the ~80% organization-level supply-chain disruption prevalence to 0.80 as a source-backed likely-frequency exposure bridge. Re-anchored 2026-08-01 to BCI's own news release (same figure, now stated on the gathered artifact).
    normalization_notes: Converted ~80% to 0.80. Selected as a current organization-level supply-chain disruption exposure bridge; third-party failure is the single largest cause.
    limitations: Vendor-membership survey, lower trust than official statistics; measures all-cause supply-chain disruption (weather, cyber, third-party, etc.), not third-party outages specifically, so it overstates third-party-only frequency; not sector- or size-specific. Revise when a third-party-outage-specific frequency is reviewed.
    confidence: low
    evidence_type: source_backed
    applicability:
      industries: [all]
      countries: [global]
      company_size_bands: [all]
      threats: [third_party_outage]

  - id: cyentia_iris_2025_median_security_incident_loss_usd_third_party_outage_context
    title: Median reported security-incident loss (cross-cyber bridge) for third-party-outage starter
    parameter: impact.likely
    value: 3000000
    unit: currency
    currency: USD
    source_id: cyentia_iris_2025
    source_name: Cyentia Information Risk Insights Study 2025
    source_type: cyber_loss_research
    source_url_or_citation: https://www.cyentia.com/publication/iris2025/
    publication_date: "2025-06-10"
    extraction_date: "2026-07-21"
    citation_detail: Public source page key findings; median losses rose toward USD 3M.
    extraction_notes: Reused the governed Cyentia median security-incident loss anchor as a likely-impact bridge for the third-party-outage starter, correctly scoped to third_party_outage rather than borrowing a shard-tagged copy.
    normalization_notes: Stored directly in USD as the likely single-event loss bridge until third-party-outage-specific loss evidence is reviewed.
    limitations: GENERIC CROSS-CYBER BRIDGE. Global all-incident median, NOT third-party-outage-specific (excludes business-interruption/SLA-credit dynamics that dominate outage loss), not sector- or size-specific, and not a distribution quantile. The third-party-outage impact side rests entirely on generic cross-cyber loss bridges; revise when third-party-outage-specific loss evidence is reviewed.
    confidence: low
    evidence_type: source_backed
    applicability:
      industries: [all]
      countries: [global]
      company_size_bands: [all]
      threats: [third_party_outage]

  - id: bci_interos_supply_chain_multi_event_frequency_stress
    title: Multi-event supply-chain exposure used as stress frequency
    parameter: frequency.max
    value: 0.90
    unit: annual_probability
    source_id: bci_supply_chain_resilience_2024
    source_ids:
      - bci_supply_chain_resilience_2024
      - interos_global_supply_chain_2022
    source_name: BCI Supply Chain Resilience Report 2024 and Interos Annual Global Supply Chain Report 2022
    source_type: derived_interpretive_bridge
    source_url_or_citation: https://www.thebci.org/resource/bci-supply-chain-resilience-report-2024.html
    publication_date: "2024-11-01"
    extraction_date: "2026-07-20"
    citation_detail: BCI 2024 reports most disrupted organizations face between one and ten incidents per year; Interos 2022 reports organizations faced on average three major supply-chain events in the last 12 months.
    extraction_notes: Set a near-ceiling stress frequency of 0.90 reflecting that, in a stress year, an exposed organization facing multiple supply-chain events near-certainly experiences at least one third-party disruption.
    normalization_notes: This is an interpretive near-ceiling stress, not a directly reported prevalence percentage. It is bounded below 1.0 and above the 0.80 likely.
    limitations: WEAKEST anchor in this set. It is an interpretive conversion from multi-event findings (BCI "one to ten incidents", Interos "three major events"), NOT a directly reported organization-level prevalence; all-cause supply-chain events, not third-party-only; vendor surveys, lower trust. Replace with a directly reported high-percentile third-party-outage frequency when one is reviewed.
    confidence: low
    evidence_type: estimated
    applicability:
      industries: [all]
      countries: [global]
      company_size_bands: [all]
      threats: [third_party_outage]

  # --- DORA supervisory reporting (EU financial entities) -----------------------
  # Registered 2026-07-30 and deliberately NOT selected by any calibration. These are
  # on a different construct from the BCI/Interos records above: they count
  # supervisory-classified *major incidents per entity*, not the share of organisations
  # that experienced any disruption. Mixing the two inside one parameter triple would be
  # a category error, so they are held as candidates for a separate DORA-basis scenario
  # once impact evidence for it exists. See docs/internal/dora_prescout.md.
  - id: esas_dora_2025_major_ict_incident_rate_per_entity
    title: EU financial entity major ICT incident rate (DORA supervisory reporting)
    parameter: frequency.likely
    value: 0.18
    unit: annual_rate_per_entity
    source_id: esas_dora_major_ict_incidents_2025
    source_name: ESAs 2025 Report on major ICT-related incidents (JC 2026 16)
    source_type: regulator_report
    source_url_or_citation: https://www.eba.europa.eu/sites/default/files/2026-06/29b60c21-4ff3-4e1e-9308-7c8225d5cc01/ESAs%202025%20report%20on%20major%20ICT-related%20incidents.pdf
    publication_date: "2026-06-03"
    extraction_date: "2026-07-30"
    citation_detail: "Executive Summary, page 4: \"Overall, 3,383 major incidents (corresponding to an average of 0.18 major ICT related incidents per financial entity subject to DORA) were reported in 2025 across all financial sectors in the EU\"."
    extraction_notes: Directly reported per-entity annual rate from supervisory returns, not a denominator this project constructed and not a survey estimate.
    normalization_notes: "Stored as an annual rate per entity, NOT an annual probability. It is a count-per-entity and can exceed 1; it is not interchangeable with the organisation-level prevalence figures elsewhere in this file."
    limitations: "A 'major' incident is a supervisory classification triggered by materiality thresholds in Commission Delegated Regulation (EU) 2024/1772, not a loss event: the report states two thirds of major incidents resulted in no or minor disruption to clients and transactions, and impact on clients was absent or minor in almost 60% of cases. Using this as a loss-event frequency would overstate substantially. EU financial entities only. First year of the regime, so there is no series and the ESAs note divergent reporting practices across sectors and jurisdictions; only incidents with a final report by the 5 February 2026 cutoff are counted; EEA coverage is partial (Norway from 1 July 2025, Iceland only from 2026)."
    confidence: medium
    evidence_type: source_backed
    applicability:
      industries: [financial_services]
      countries: [EU]
      company_size_bands: [all]
      threats: [third_party_outage]

  - id: esas_dora_2025_third_party_origin_share
    title: Share of EU financial-sector major ICT incidents originating from an ICT third-party provider
    parameter: frequency.likely
    value: 0.29
    unit: proportion
    source_id: esas_dora_major_ict_incidents_2025
    source_name: ESAs 2025 Report on major ICT-related incidents (JC 2026 16)
    source_type: regulator_report
    source_url_or_citation: https://www.eba.europa.eu/sites/default/files/2026-06/29b60c21-4ff3-4e1e-9308-7c8225d5cc01/ESAs%202025%20report%20on%20major%20ICT-related%20incidents.pdf
    publication_date: "2026-06-03"
    extraction_date: "2026-07-30"
    citation_detail: "Figure 8, page 15: originated from TPP 29%, not originated from TPP 68.9%, unknown/missing 2.13%. Paragraph 19 states that 29% of all major incidents are caused by a failure attributable to a TPP."
    extraction_notes: "Use Figure 8's 29%, which is specifically ICT third-party service providers. The Executive Summary's \"almost one third\" covers a broader category including other financial entities and infrastructure providers; press coverage conflated the two. Combined with the 0.18 per-entity rate this implies roughly 0.052 third-party-origin major incidents per entity per year."
    normalization_notes: "Stored as a proportion of major incidents, not a probability of occurrence. It is a modifier on the per-entity rate above, not a standalone frequency."
    limitations: "Inherits every limit of the per-entity rate: supervisory classification rather than loss event, EU financial entities only, first year of the regime. 2.13% of incidents have unknown or missing origin, so the share is a floor."
    confidence: medium
    evidence_type: source_backed
    applicability:
      industries: [financial_services]
      countries: [EU]
      company_size_bands: [all]
      threats: [third_party_outage]

