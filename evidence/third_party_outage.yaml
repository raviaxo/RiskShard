records:
  - id: bci_2024_third_party_failure_top_cause_frequency_floor
    title: Third-party failure as top disruption cause used as frequency floor
    parameter: frequency.min
    value: 0.44
    unit: annual_probability
    source_id: bci_supply_chain_resilience_2024
    source_name: BCI Supply Chain Resilience Report 2024
    source_type: industry_survey_bridge
    source_url_or_citation: https://www.thebci.org/resource/bci-supply-chain-resilience-report-2024.html
    publication_date: "2024-11-01"
    extraction_date: "2026-07-20"
    citation_detail: The BCI Supply Chain Resilience Report 2024 reports that 43.6% of respondents cite third-party failure as their top cause of supply-chain disruption.
    extraction_notes: Used the 43.6% third-party-failure-as-top-cause share (rounded to 0.44) as a third-party-specific frequency floor.
    normalization_notes: Converted 43.6% to 0.44. Used as a conservative third-party-attributable disruption floor, below the broad ~0.80 disruption likely.
    limitations: Vendor-membership survey, lower trust than official statistics; this is the share of respondents naming third-party failure as their top cause, not a clean per-organization annual probability; not sector- or size-specific. Revise when a third-party-outage-specific organization-level frequency is reviewed.
    confidence: low
    evidence_type: source_backed
    applicability:
      industries: [all]
      countries: [global]
      company_size_bands: [all]
      threats: [third_party_outage]

  - id: bci_2024_supply_chain_disruption_prevalence_frequency_likely
    title: Organization-level supply-chain disruption prevalence used as likely frequency
    parameter: frequency.likely
    value: 0.80
    unit: annual_probability
    source_id: bci_supply_chain_resilience_2024
    source_name: BCI Supply Chain Resilience Report 2024
    source_type: industry_survey_bridge
    source_url_or_citation: https://www.thebci.org/resource/bci-supply-chain-resilience-report-2024.html
    publication_date: "2024-11-01"
    extraction_date: "2026-07-20"
    citation_detail: The BCI Supply Chain Resilience Report 2024 reports that nearly 80% of organizations experienced supply-chain disruptions in the past year, most facing between one and ten incidents.
    extraction_notes: Converted the ~80% organization-level supply-chain disruption prevalence to 0.80 as a source-backed likely-frequency exposure bridge.
    normalization_notes: Converted ~80% to 0.80. Selected as a current organization-level supply-chain disruption exposure bridge; third-party failure is the single largest cause.
    limitations: Vendor-membership survey, lower trust than official statistics; measures all-cause supply-chain disruption (weather, cyber, third-party, etc.), not third-party outages specifically, so it overstates third-party-only frequency; not sector- or size-specific. Revise when a third-party-outage-specific frequency is reviewed.
    confidence: low
    evidence_type: source_backed
    applicability:
      industries: [all]
      countries: [global]
      company_size_bands: [all]
      threats: [third_party_outage]

  - id: bci_interos_supply_chain_multi_event_frequency_stress
    title: Multi-event supply-chain exposure used as stress frequency
    parameter: frequency.max
    value: 0.90
    unit: annual_probability
    source_id: bci_supply_chain_resilience_2024
    source_ids:
      - bci_supply_chain_resilience_2024
      - interos_global_supply_chain_2022
    source_name: BCI Supply Chain Resilience Report 2024 and Interos Annual Global Supply Chain Report 2022
    source_type: derived_interpretive_bridge
    source_url_or_citation: https://www.thebci.org/resource/bci-supply-chain-resilience-report-2024.html
    publication_date: "2024-11-01"
    extraction_date: "2026-07-20"
    citation_detail: BCI 2024 reports most disrupted organizations face between one and ten incidents per year; Interos 2022 reports organizations faced on average three major supply-chain events in the last 12 months.
    extraction_notes: Set a near-ceiling stress frequency of 0.90 reflecting that, in a stress year, an exposed organization facing multiple supply-chain events near-certainly experiences at least one third-party disruption.
    normalization_notes: This is an interpretive near-ceiling stress, not a directly reported prevalence percentage. It is bounded below 1.0 and above the 0.80 likely.
    limitations: WEAKEST anchor in this set. It is an interpretive conversion from multi-event findings (BCI "one to ten incidents", Interos "three major events"), NOT a directly reported organization-level prevalence; all-cause supply-chain events, not third-party-only; vendor surveys, lower trust. Replace with a directly reported high-percentile third-party-outage frequency when one is reviewed.
    confidence: low
    evidence_type: estimated
    applicability:
      industries: [all]
      countries: [global]
      company_size_bands: [all]
      threats: [third_party_outage]
