records:
  - id: cyentia_global_ransomware_probability_2025_jp_context
    title: Global organization ransomware likelihood for Japan manufacturing starter
    parameter: frequency.min
    value: 0.012
    unit: annual_probability
    source_id: cyentia_iris_ransomware
    source_name: Cyentia IRIS Ransomware
    source_type: ransomware_research
    source_url_or_citation: https://www.cyentia.com/publication/iris-ransomware/
    publication_date: "2025-04-21"
    extraction_date: "2026-07-13"
    artifact_verified_at: "2026-11-20"
    artifact_verified_sha256: d2bdaa1d7bf2a20ce8971a1fb4baad432b78d2462938ed55eff5ff0a5def7298
    citation_detail: 'Table 3, Annual probability of a firm experiencing a given number of ransomware events, Lower Bound, revenue category $100M to $1B, one or more events: 1.20%. The report headline states it differently - "There is about a 10% upper bound chance that any given organization will experience at least one ransomware incident in the next 12 months" - and Figure 8 publishes both bound models.'
    extraction_notes: 'Read from the held report on 2026-11-20 (ADR-0027). Replaces an extraction taken from the publisher summary page, which paraphrased the finding as "approximately 10% of organizations are likely to experience a ransomware incident within the next year" and dropped the words "upper bound". The report publishes a lower and an upper bound model (Figure 8) and bands both by revenue (Table 3). This org profile has USD 130,000,000 annual revenue, so it sits in the $100M to $1B bracket.'
    normalization_notes: 'Stored as the published LOWER bound for this revenue bracket, which is what a frequency minimum is. The previous value was 0.10, the global aggregate UPPER bound, and that is described here rather than deleted: a minimum that was the publisher maximum is an error only a read of the report could find (ADR-0027).'
    limitations: 'Global cross-sector model, not Japan-specific, manufacturing-specific or size-band-specific beyond revenue. The published upper bound for this same bracket is 9.83%, so the publisher own uncertainty spans 1.20% to 9.83% and this record takes the low end deliberately. Cyentia states the upper bound is the more risk-averse view and better suited to managing risk, so this floor should be read alongside frequency.likely and frequency.max rather than on its own. Frequency statistics in this study cover organizations above USD 10,000,000 revenue only (footnote 7).'
    confidence: medium
    evidence_type: source_backed
    measurement_basis: org_prevalence_loss_event
    applicability:
      industries: [all]
      countries: [global]
      company_size_bands: [all]
      threats: [ransomware]

  - id: sophos_2024_jp_ransomware_attack_rate_likely
    title: Japanese organizations hit by ransomware, 2024 survey reading
    parameter: frequency.likely
    value: 0.51
    unit: annual_probability
    source_id: sophos_state_ransomware_2024
    refresh_checked: '2026-08-21'
    refresh_note: >-
      Not refreshed to Sophos 2026, and the reason is a property of the source rather
      than a backlog. The 2026 edition surveys organizations already hit, so it carries
      no attack rate; it also asked the prevalence question over n=5,000 and published
      no answer, only an unlabelled Venn diagram. See FINDINGS finding 9. This anchor
      stays on the older edition because that edition published the number and the
      current one does not.
    source_name: Sophos The State of Ransomware 2024 (archived snapshot)
    source_type: industry_survey
    source_url_or_citation: https://web.archive.org/web/20240430145048if_/https://assets.sophos.com/X24WTUEQ/at/9brgj5n44hqvgsp5f5bqcps/sophos-state-of-ransomware-2024-wp.pdf
    publication_date: "2024-04-30"
    extraction_date: "2026-08-02"
    citation_detail: Attack-rate prose (printed page 3) reads "the lowest reported attack rates were by respondents in Brazil (44%), Japan (51%), and Australia (54%)"; the by-country chart carries the same 51% for Japan (n=500). Verified in the gathered snapshot artifact.
    extraction_notes: Selected the Japanese reading of the 2024 global survey as the likely anchor, replacing the global manufacturing rate (56%, 2023 reading), which was country-bridged and not confirmed to include Japan. The swap trades the sector dimension for the country dimension; the sector bridge is recorded.
    normalization_notes: Stored 51% as 0.51. Same "hit by ransomware" survey construct as the shard's Sophos manufacturing recovery-cost impact anchors, so frequency and impact keep one attack-event basis.
    limitations: >
      Attack prevalence ("hit by ransomware"), not loss-event frequency - it counts
      organizations attacked, including attacks stopped before material loss, so it
      overstates loss-event frequency (in the 2025 manufacturing report only ~40% of
      attacks resulted in encryption). All-sector Japanese sample used for a
      manufacturing shard; the sector dimension stays bridged (the global
      manufacturing comparator read 65% in the same survey year, above Japan's
      all-sector rate). Survey population is organizations with 100-5,000 employees.
      Vendor-commissioned, n=500 Japanese respondents. The Japanese series is falling
      (61% in 2022, 58% in 2023, 51% in 2024) and the 2025 edition dropped prevalence
      reporting entirely, so this reading cannot be refreshed like-for-like.
    confidence: medium
    evidence_type: source_backed
    measurement_basis: org_prevalence_incident
    applicability:
      industries: [all]
      countries: [JP]
      company_size_bands: [mid_market, enterprise]
      threats: [ransomware]

