  - id: sophos_manufacturing_ransomware_extreme_case_threshold_usd_2025_jp_context
    title: Manufacturing ransomware extreme case threshold for Japan context
    parameter: impact.max
    value: 5000000
    unit: currency
    currency: USD
    source_id: sophos_state_ransomware_manufacturing_2025
    source_name: Sophos State of Ransomware in Manufacturing and Production 2025
    source_type: industry_survey
    source_url_or_citation: https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025
    publication_date: "2025-12-04"
    extraction_date: "2026-08-16"
    citation_detail: 'Ransoms section: "extreme payments of $5 million or more - accounting for 18% of payments in 2025 - up from 15% last year", alongside extreme demands of $5 million or more accounting for a fifth (20%) of demands.'
    extraction_notes: 'Read from the report on 2026-08-16, replacing an earlier extraction that recorded only that extreme $5M+ cases had appeared. The share is stated in prose, so the threshold now carries a published exceedance rather than none.'
    normalization_notes: Stored as a manufacturing-sector stress threshold, not as a formal maximum.
    limitations: 'A ransom PAYMENT threshold, not a total event loss - the shard composes it as an impact maximum and those are different quantities. Not Japan-specific: the survey is global manufacturing and production. The 18% exceedance is over organizations that paid a ransom, a narrower and self-selected denominator than all organizations attacked.'
    confidence: medium
    evidence_type: source_backed
    measurement_basis: observed_extremum
    exceedance_basis: modeled_quantile
    exceedance_detail: '18% of ransom payments made by manufacturing and production organizations were $5 million or more in 2025, up from 15% in 2024 (Sophos, State of Ransomware in Manufacturing and Production 2025, ransom payments section). $5M therefore sits at the 82nd percentile of that published payment distribution. The exceedance is over organizations that PAID a ransom, not over all organizations attacked.'
    applicability:
      industries: [manufacturing]
      countries: [global]
      company_size_bands: [mid_market, enterprise]
      threats: [ransomware]
