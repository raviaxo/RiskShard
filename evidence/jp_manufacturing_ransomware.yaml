    title: Manufacturing ransomware extreme case threshold for Japan context
    parameter: impact.max
    value: 5000000
    unit: currency
    currency: USD
    source_id: sophos_state_ransomware_manufacturing_2025
    source_name: Sophos State of Ransomware in Manufacturing and Production 2025
    source_type: industry_survey
    source_url_or_citation: https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2025
    publication_date: "2025-12-04"
    extraction_date: "2026-08-16"
    artifact_verified_at: "2026-11-20"
    artifact_verified_sha256: c579c711f3004db660c547e4c73be6b0e4997cb5b76fffacabebacf928f99eae
    citation_detail: 'Ransoms section: "extreme payments of $5 million or more - accounting for 18% of payments in 2025 - up from 15% last year", alongside extreme demands of $5 million or more accounting for a fifth (20%) of demands.'
    extraction_notes: 'Read from the report on 2026-08-16, replacing an earlier extraction that recorded only that extreme $5M+ cases had appeared. The share is stated in prose, so the threshold now carries a published exceedance rather than none. Re-read against the held report on 2026-11-20 as part of the ADR-0024 artifact-fit campaign; the quoted passage matched the publisher file exactly and no value moved.'
    normalization_notes: Stored as a manufacturing-sector stress threshold, not as a formal maximum.
    limitations: 'A ransom PAYMENT threshold, not a total event loss - the shard composes it as an impact maximum and those are different quantities. Not Japan-specific: the survey is global manufacturing and production. The 18% exceedance is over organizations that paid a ransom, a narrower and self-selected denominator than all organizations attacked. The denominator is also thin - n=67 payments in 2025, so the 82nd percentile is read off about 12 organizations and the 2024 comparison is drawn against n=157. Treat the percentile as directional, not precise.'
    confidence: medium
