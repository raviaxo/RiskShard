    citation_detail: 'Recovery costs section; the report states that the AVERAGE recovery cost, excluding any ransom payments, dropped 24% to USD 1.3M in 2025 from USD 1.7M in 2024, on a base of n=332. The report does not say mean or median here, and the same report writes "average (median)" for its ransom figures, so the statistic is unqualified in the source.'
