    limitations: 'Global survey of organizations hit by ransomware; not Japan-specific and excludes ransom payments. Base stated in the report - n=332 manufacturing and production organizations for 2025, n=378 for 2024, n=205 for 2023. The blog page this record cites does not carry that base.'
