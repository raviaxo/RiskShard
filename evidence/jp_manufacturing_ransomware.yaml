  - id: sophos_2024_jp_ransomware_attack_rate_likely
    title: Japanese organizations hit by ransomware, 2024 survey reading
    parameter: frequency.likely
    value: 0.51
    unit: annual_probability
    source_id: sophos_state_ransomware_2024
    source_name: Sophos The State of Ransomware 2024 (archived snapshot)
    source_type: industry_survey
    source_url_or_citation: https://web.archive.org/web/20240430145048if_/https://assets.sophos.com/X24WTUEQ/at/9brgj5n44hqvgsp5f5bqcps/sophos-state-of-ransomware-2024-wp.pdf
    publication_date: "2024-04-30"
    extraction_date: "2026-08-02"
    citation_detail: Attack-rate prose (printed page 3) reads "the lowest reported attack rates were by respondents in Brazil (44%), Japan (51%), and Australia (54%)"; the by-country chart carries the same 51% for Japan (n=500). Verified in the gathered snapshot artifact.
    extraction_notes: Selected the Japanese reading of the 2024 global survey as the likely anchor, replacing the global manufacturing rate (56%, 2023 reading), which was country-bridged and not confirmed to include Japan. The swap trades the sector dimension for the country dimension; the sector bridge is recorded.
    normalization_notes: Stored 51% as 0.51. Same "hit by ransomware" survey construct as the shard's Sophos manufacturing recovery-cost impact anchors, so frequency and impact keep one attack-event basis.
    limitations: >
      Attack prevalence ("hit by ransomware"), not loss-event frequency - it counts
      organizations attacked, including attacks stopped before material loss, so it
      overstates loss-event frequency (in the 2025 manufacturing report only ~40% of
      attacks resulted in encryption). All-sector Japanese sample used for a
      manufacturing shard; the sector dimension stays bridged (the global
      manufacturing comparator read 65% in the same survey year, above Japan's
      all-sector rate). Survey population is organizations with 100-5,000 employees.
      Vendor-commissioned, n=500 Japanese respondents. The Japanese series is falling
      (61% in 2022, 58% in 2023, 51% in 2024) and the 2025 edition dropped prevalence
      reporting entirely, so this reading cannot be refreshed like-for-like.
    confidence: medium
    evidence_type: source_backed
    measurement_basis: org_prevalence_incident
    applicability:
      industries: [all]
      countries: [JP]
      company_size_bands: [mid_market, enterprise]
      threats: [ransomware]

  - id: sophos_2023_jp_ransomware_attack_rate_stress
    title: Japanese organizations hit by ransomware, 2023 survey reading (stress)
    parameter: frequency.max
    value: 0.58
    unit: annual_probability
    source_id: sophos_state_ransomware_2023
    source_name: Sophos The State of Ransomware 2023 (archived snapshot)
    source_type: industry_survey
    source_url_or_citation: https://web.archive.org/web/20230511013336if_/https://assets.sophos.com/X24WTUEQ/at/c949g7693gsnjh9rb9gr8/sophos-state-of-ransomware-2023-wp.pdf
    publication_date: "2023-05-01"
    extraction_date: "2026-08-02"
    citation_detail: Additional Charts, "Rate of Ransomware Attacks by Country. 2022 vs. 2023" (printed page 18) - Japan (n=300) reads 61% for 2022 and 58% for 2023. The chart's numeric labels are present in the artifact text; the label-to-country pairing was verified visually on the rendered page of the gathered snapshot.
    extraction_notes: Selected the prior-year (2023) Japanese reading as the stress anchor above the 2024 likely reading of 0.51, replacing the global manufacturing peak (65%), which was country-bridged. The 2022 reading (0.61) is the documented alternative if a harsher stress bound is preferred on review. The stress bound falls (0.65 to 0.58) because the Japanese all-sector series runs below the global manufacturing series.
    normalization_notes: Stored 58% as 0.58. Same "hit by ransomware" survey construct as the shard's Sophos manufacturing impact anchors.
    limitations: >
      Attack prevalence, not loss-event frequency (see the likely record). The stress
      anchor is one survey-year older than the likely anchor, taken from a declining
      series (61% 2022, 58% 2023, 51% 2024) - an older, higher reading used as a
      deliberate conservative stress bound, not a tail percentile. All-sector Japanese
      sample; sector stays bridged. n=300 Japanese respondents in the 2023 cycle.
      Vendor-commissioned.
    confidence: medium
    evidence_type: source_backed
    measurement_basis: org_prevalence_incident
    applicability:
      industries: [all]
      countries: [JP]
      company_size_bands: [mid_market, enterprise]
      threats: [ransomware]

