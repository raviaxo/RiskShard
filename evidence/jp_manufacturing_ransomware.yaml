  - id: sophos_manufacturing_ransomware_prevalence_2023_likely_jp_context
    title: Manufacturing ransomware attack prevalence (prior-year) for Japan context
    parameter: frequency.likely
    value: 0.56
    unit: annual_probability
    source_id: sophos_state_ransomware_manufacturing_2024
    source_name: Sophos State of Ransomware in Manufacturing and Production 2024
    source_type: industry_survey
    source_url_or_citation: https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-manufacturing-and-production-2024
    publication_date: "2024-05-28"
    extraction_date: "2026-07-24"
    citation_detail: "Attack rates and recovery costs section; 65% of manufacturing and production organizations were hit by ransomware last year, a notable increase from the previous two years (56% in 2023 and 55% in 2022)."
    extraction_notes: Selected the reported 2023 manufacturing ransomware attack-prevalence (56%) as the representative likely annual frequency for a Japan mid-market manufacturing starter.
    normalization_notes: Stored 56% as 0.56. Paired with the shard's Sophos manufacturing recovery-cost impact, which is likewise measured over organizations hit by ransomware, so frequency and impact share one "hit by ransomware" event basis.
    limitations: >
      Global survey of organizations with 100-5,000 employees (17 countries; not
      confirmed to include Japan), not Japan-specific or size-band-specific. Reports
      ATTACK prevalence ("hit by ransomware"), which OVERSTATES loss-event frequency:
      in the 2025 report only ~40% of manufacturing attacks resulted in encryption.
      Survey respondents (orgs with IT/security leaders) may overstate population
      prevalence, and the 55/56/65% series is rising, so a point estimate hides the trend.
      Read the frequency as attack-incidence on the same basis as the impact side.
    confidence: medium
    evidence_type: source_backed
    population_match:
      status: matched
    applicability:
      industries: [manufacturing]
      countries: [global]
      company_size_bands: [mid_market, enterprise]
      threats: [ransomware]

