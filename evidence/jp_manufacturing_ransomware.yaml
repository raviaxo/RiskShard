    publication_date: "2024-05-28"
    extraction_date: "2026-07-24"
    citation_detail: "Attack rates and recovery costs section; 65% of manufacturing and production organizations reported they were hit by ransomware last year, the highest of the reported 55%/56%/65% (2022/2023/2024) series."
    extraction_notes: Selected the reported 2024 manufacturing ransomware attack-prevalence (65%), the highest observed year, as the stress/high frequency anchor.
    normalization_notes: Stored 65% as 0.65. Same "hit by ransomware" event basis as the shard's Sophos manufacturing impact anchors.
    limitations: >
      Highest observed year of a rising 55/56/65% (2022/2023/2024) series, so it is a
      recent peak rather than a formal tail percentile. Global survey of organizations
      with 100-5,000 employees (not Japan-specific). Reports ATTACK prevalence, which
      OVERSTATES loss-event frequency (only ~40% of 2025 manufacturing attacks encrypted).
      Read as attack-incidence on the same basis as the impact side.
    confidence: medium
    evidence_type: source_backed
    population_match:
      status: matched
    applicability:
      industries: [manufacturing]
      countries: [global]
      company_size_bands: [mid_market, enterprise]
