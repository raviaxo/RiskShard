  - id: cyentia_iris_2022_typical_cyber_event_loss_usd_jp_manufacturing_context
    title: Typical reported cyber-event financial loss for Japan manufacturing starter
    parameter: impact.min
    value: 266000
    unit: currency
    currency: USD
    source_id: cyentia_iris_2022
    source_name: Cyentia Information Risk Insights Study 2022
    source_type: cyber_loss_research
    source_url_or_citation: https://www.cyentia.com/publication/iris-2022/
    publication_date: "2022-01-01"
    extraction_date: "2026-07-13"
    artifact_verified_at: "2026-11-20"
    artifact_verified_sha256: 8cf45ef222a4375dba486bd942c5734796e65b93f181e3431e60efed0d491677
    citation_detail: 'Table 3, loss magnitude statistics for 1,893 cyber events: geometric mean USD 266,000, median USD 259,000, minimum USD 32, first quartile USD 29,000, third quartile USD 2,000,000, 95th percentile USD 52,000,000, maximum USD 12,000,000,000. Figure 6 states the same pair as "Median loss: $259K / Geometric mean: $266K". Read from the held report on 2026-11-20; the previous value of this field quoted the publisher summary page, which says only "typical financial costs reported for a cyber event stand at $266K" without saying which statistic that is.'
    extraction_notes: 'Reused the governed Cyentia typical cyber-event financial-loss anchor for the Japan manufacturing starter. Re-read against the held report on 2026-11-20 (ADR-0028). The USD 266,000 is the GEOMETRIC MEAN, not the median - the median is USD 259,000 - and this record carried measurement_basis: median_total_event_cost until then. IRIS 2025 confirms the convention changed, in its own footnote: "Prior IRIS used the geometric mean for a typical loss ... the median is better central measure for the updated distribution." The value is unchanged; the label was wrong and the right statistic had no name in our vocabulary.'
    normalization_notes: Stored in USD and selected as a conservative lower loss anchor until Japan manufacturing ransomware loss-floor evidence is reviewed.
    limitations: 'Global cyber-event benchmark, not Japan-specific, ransomware-specific, manufacturing-specific, or a true minimum loss quantile. Published alongside and recorded 2026-11-20 so the figure we chose sits beside the ones we did not: median USD 259,000, minimum USD 32, first quartile USD 29,000, 95th percentile USD 52,000,000, over N=1,893 events. The arithmetic mean of the same distribution is over USD 25,000,000 and the report calls it "not a good measure of typical losses due to the long-tailed distribution" - which is why a geometric mean needed its own measurement_basis rather than being folded into mean_total_event_cost.'
    confidence: low
    evidence_type: source_backed
    measurement_basis: 'geometric_mean_total_event_cost'
    applicability:
      industries: [all]
      countries: [global]
      company_size_bands: [all]
      threats: [all]

  - id: cyentia_iris_2025_median_security_incident_loss_usd_jp_manufacturing_context
    title: Median reported security-incident loss for Japan manufacturing starter
    parameter: impact.likely
    value: 3000000
    unit: currency
    currency: USD
    source_id: cyentia_iris_2025
    source_name: Cyentia Information Risk Insights Study 2025
    source_type: cyber_loss_research
    source_url_or_citation: https://www.cyentia.com/publication/iris2025/
    publication_date: "2025-06-10"
    extraction_date: "2026-07-13"
    artifact_verified_at: "2026-11-20"
    artifact_verified_sha256: 00706bbbfefcc7b6cc321dcbcc2347b3082af92572cbd55abd2239a901cf8f1c
    citation_detail: Public source page key findings; median losses rose toward USD 3M.
    extraction_notes: Reused the governed Cyentia median security-incident loss anchor for the Japan manufacturing starter.
    normalization_notes: 'Stored directly in USD and selected as a global likely-loss bridge until local ransomware cost evidence is reviewed. Corrected 2026-11-20: this field said the record was "selected", which stopped being true when the Sophos manufacturing anchors were selected. The shard takes impact.likely USD 1,300,000 and impact.max USD 5,000,000 from Sophos, so this record is an unselected comparison anchor. The word is left in place above rather than deleted, because a record claiming to drive a figure it does not drive is the kind of stale self-description that is only ever found by reading. The publisher figure is USD 2,900,000 (Figure 10); USD 3,000,000 is the "almost $3 million" prose rounding carried by the summary page this record was extracted from. The rounding is kept because it is what the publisher states in prose, and the finer figure is recorded here rather than substituted.'
    limitations: 'Global security-incident benchmark, not Japan-specific, ransomware-only, manufacturing-specific, or mid-market-specific. Construct note added 2026-11-20 from the held report: this is NOT the median of the study loss distribution, which Figure 9 puts at USD 603,000. It is the 2024 endpoint of a 15-year trend (Figure 10, median rising from USD 189,900 in 2008 to USD 2,900,000 in 2024, a 15.20x increase), so it is a single-year median sitting about 4.8x above the pooled 2015-2024 median. Anyone comparing it against another source pooled median is off by roughly five-fold.'
    confidence: low
    evidence_type: source_backed
    measurement_basis: median_total_event_cost
    applicability:
      industries: [all]
      countries: [global]
      company_size_bands: [all]
      threats: [all]

  - id: cyentia_iris_2025_extreme_security_incident_loss_usd_jp_manufacturing_context
    title: Extreme reported security-incident loss for Japan manufacturing starter
    parameter: impact.max
    value: 32000000
    unit: currency
    currency: USD
    source_id: cyentia_iris_2025
    source_name: Cyentia Information Risk Insights Study 2025
    source_type: cyber_loss_research
    source_url_or_citation: https://www.cyentia.com/publication/iris2025/
    publication_date: "2025-06-10"
    extraction_date: "2026-07-13"
    artifact_verified_at: "2026-11-20"
    artifact_verified_sha256: 00706bbbfefcc7b6cc321dcbcc2347b3082af92572cbd55abd2239a901cf8f1c
    citation_detail: Public source page key findings; extreme events reached USD 32M.
    extraction_notes: Reused the governed Cyentia extreme security-incident loss anchor for the Japan manufacturing starter.
    normalization_notes: 'Stored directly in USD and selected as a global stress-loss bridge until Japan manufacturing ransomware tail-loss evidence is reviewed. Corrected 2026-11-20: this field said the record was "selected", which stopped being true when the Sophos manufacturing anchors were selected. The shard takes impact.likely USD 1,300,000 and impact.max USD 5,000,000 from Sophos, so this record is an unselected comparison anchor. The word is left in place above rather than deleted, because a record claiming to drive a figure it does not drive is the kind of stale self-description that is only ever found by reading. Worth not reconciling later: the publisher key-findings page puts the 32M beside a 5-fold rise, but that rise belongs to the 90th percentile, which Figure 10 tracks from USD 6,000,000 in 2008 to USD 28,500,000 in 2024. The 32M is the pooled 95th percentile from Figure 9. They are different statistics and neither is wrong.'
    limitations: 'Global security-incident benchmark, not Japan-specific, ransomware-only, manufacturing-specific, or a formal percentile for this scenario. It IS a formal percentile - the 95th of the study reported-loss distribution - but of a global all-incident population rather than this scenario, so the percentile is real and the population is not ours. Corrected 2026-11-20: this field said the figure was not "a formal percentile for this scenario", which read as no percentile existing, and that reading is the ADR-0024 defect in its original form.'
    confidence: low
    evidence_type: source_backed
    measurement_basis: observed_extremum
    exceedance_basis: 'modeled_quantile'
    exceedance_detail: 'USD 32,000,000 is the 95th percentile of the distribution of reported losses for security incidents from 2015 to 2024 (Cyentia Institute, Information Risk Insights Study 2025, Figure 9, labelled "$32M (95%)", and the body text - "The typical (median) incident costs about $600K, while more extreme (95th percentile) losses swell to $32 million"). Roughly 5% of reported security incidents in that corpus exceed this figure. The exceedance is over LOSSES REPORTED IN PUBLIC RECORDS, not over all incidents - the study notes its losses tend to be direct costs identifiable from breach disclosures, public company filings and litigation, which biases the corpus toward events that became public. Read from the held report on 2026-11-20. This record declared none_known until then because it was extracted from the publisher summary page, which states the 32M figure without the percentile (ADR-0024, ADR-0026).'
    applicability:
      industries: [all]
      countries: [global]
      company_size_bands: [all]
      threats: [all]

