records:
  - id: sophos_2024_au_ransomware_attack_rate_likely
    title: Australian organizations hit by ransomware, 2024 survey reading
    parameter: frequency.likely
    value: 0.54
    unit: annual_probability
    source_id: sophos_state_ransomware_2024
    refresh_checked: '2026-08-21'
    refresh_note: >-
      Not refreshed to Sophos 2026, and the reason is a property of the source rather
      than a backlog. The 2026 edition surveys organizations already hit, so it carries
      no attack rate; it also asked the prevalence question over n=5,000 and published
      no answer, only an unlabelled Venn diagram. See FINDINGS finding 9. This anchor
      stays on the older edition because that edition published the number and the
      current one does not.
    source_name: Sophos The State of Ransomware 2024 (archived snapshot)
    source_type: industry_survey
    source_url_or_citation: https://web.archive.org/web/20240430145048if_/https://assets.sophos.com/X24WTUEQ/at/9brgj5n44hqvgsp5f5bqcps/sophos-state-of-ransomware-2024-wp.pdf
    publication_date: "2024-04-30"
    extraction_date: "2026-08-02"
    citation_detail: Attack-rate prose (printed page 3) reads "the lowest reported attack rates were by respondents in Brazil (44%), Japan (51%), and Australia (54%)"; the by-country chart carries the same 54% for Australia (n=330). Verified in the gathered snapshot artifact.
    extraction_notes: Selected the Australian reading of the 2024 global survey as the likely anchor, replacing the Sophos financial-services global rate (65%), which was country-bridged. The swap trades the sector dimension for the country dimension; the sector bridge is recorded. The live assets.sophos.com URL was observed serving the 2025 edition under the 2024 filename on 2026-08-02, so the anchor cites an immutable Internet Archive snapshot.
    normalization_notes: Stored directly as 0.54 annual probability; the survey construct is organizations hit by ransomware at least once in the last year.
    limitations: Attack prevalence ("hit by ransomware"), not loss-event frequency - it counts organizations attacked, including attacks stopped before material loss, so it overstates loss-event frequency. All-sector Australian sample used for a financial-services shard; the sector dimension stays bridged (the global financial-services comparator read 65% in the same survey year). Survey population is organizations with 100-5,000 employees - the 450-employee org profile is inside the window, but the window is far broader than mid-market. Vendor-commissioned survey, n=330 Australian respondents. The Australian series is falling steeply (80% in 2022, 70% in 2023, 54% in 2024) and the 2025 edition dropped prevalence reporting entirely, so this reading cannot be refreshed like-for-like.
    confidence: medium
    evidence_type: source_backed
    measurement_basis: org_prevalence_incident
    applicability:
      industries: [all]
      countries: [AU]
      company_size_bands: [all]
      threats: [ransomware]

