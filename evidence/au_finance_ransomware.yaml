  - id: sophos_2023_au_ransomware_attack_rate_stress
    title: Australian organizations hit by ransomware, 2023 survey reading (stress)
    parameter: frequency.max
    value: 0.70
    unit: annual_probability
    source_id: sophos_state_ransomware_2023
    refresh_checked: '2026-08-21'
    refresh_note: >-
      Not refreshed to Sophos 2026, and the reason is a property of the source rather
      than a backlog. The 2026 edition surveys organizations already hit, so it carries
      no attack rate; it also asked the prevalence question over n=5,000 and published
      no answer, only an unlabelled Venn diagram. See FINDINGS finding 9. This anchor
      stays on the older edition because that edition published the number and the
      current one does not.
    source_name: Sophos The State of Ransomware 2023 (archived snapshot)
    source_type: industry_survey
    source_url_or_citation: https://web.archive.org/web/20230511013336if_/https://assets.sophos.com/X24WTUEQ/at/c949g7693gsnjh9rb9gr8/sophos-state-of-ransomware-2023-wp.pdf
    publication_date: "2023-05-01"
    extraction_date: "2026-08-02"
    citation_detail: Additional Charts, "Rate of Ransomware Attacks by Country. 2022 vs. 2023" (printed page 18) - Australia (n=250 in 2022, n=200 in 2023) reads 80% for 2022 and 70% for 2023. The chart's numeric labels are present in the artifact text; the label-to-country pairing was verified visually on the rendered page of the gathered snapshot.
    extraction_notes: Selected the prior-year (2023) Australian reading as the stress anchor above the 2024 likely reading of 0.54, replacing the reuse of the global financial-services 65% as both likely and max - the stress bound is now a genuinely distinct, higher, Australia-resident reading. The 2022 reading (0.80) is the documented alternative if a harsher stress bound is preferred on review.
    normalization_notes: Stored directly as 0.70 annual probability; same survey construct as the likely anchor (organizations hit at least once in the last year).
    limitations: Attack prevalence, not loss-event frequency (see the likely record). The stress anchor is one survey-year older than the likely anchor, taken from a declining series (80% 2022, 70% 2023, 54% 2024) - using an older, higher reading as the stress bound is a deliberate conservative choice, not a tail percentile. All-sector Australian sample; sector stays bridged. n=200 Australian respondents in the 2023 cycle. Vendor-commissioned.
    confidence: medium
    evidence_type: source_backed
    measurement_basis: org_prevalence_incident
    applicability:
      industries: [all]
      countries: [AU]
      company_size_bands: [all]
      threats: [ransomware]

