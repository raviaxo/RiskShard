  - id: sophos_au_2025_ransomware_recovery_cost_usd
    title: Australian mean ransomware recovery cost, excluding ransom payments
    parameter: impact.likely
    value: 650000
    unit: currency
    currency: USD
    source_id: sophos_state_ransomware_australia_2025
    source_name: Sophos The State of Ransomware in Australia 2025
    source_type: industry_survey
    source_url_or_citation: https://assets.sophos.com/X24WTUEQ/at/k5krqsjhn4zbvj84448rhh/sophos-state-of-ransomware-in-australia-2025.pdf
    publication_date: "2025-06-19"
    extraction_date: "2026-08-02"
    citation_detail: Business impact section (printed page 3) reads "the average (mean) bill incurred by Australian organizations to recover from a ransomware attack in the last year came in at just $0.65 million"; the About page carries the same USD 650K headline tile. Verified in the gathered artifact.
    extraction_notes: Replaces the Sophos global financial-services mean recovery cost (USD 2.58M, 2024 survey), which was country-bridged. The same whitepaper's Australian 2024-survey comparator was USD 2.37M, so the loss anchor moved because the evidence got closer to home AND because the Australian reading itself fell steeply year over year.
    normalization_notes: Stored in source currency USD; calibration converts to AUD with the explicit RBA FX assumption. The construct covers downtime, people time, device cost, network cost and lost opportunity.
    limitations: Excludes any ransom payments - the same survey reports a median Australian ransom payment of USD 350,000 among the 41% who paid, so the all-in cost of a paid incident can be materially higher than this anchor. Mean over 191 Australian organizations of 100-5,000 employees across all sectors, conditional on being hit; the sector dimension stays bridged for a financial-services shard. Self-reported, vendor-commissioned, and a steep one-year move (USD 2.37M to 0.65M) in a small sample suggests volatility - treat the level as indicative, not stable.
    confidence: medium
    evidence_type: source_backed
    measurement_basis: cost_component
    applicability:
      industries: [all]
      countries: [AU]
      company_size_bands: [all]
      threats: [ransomware]

  - id: sophos_au_2026_ransomware_recovery_cost_usd
    title: Australian mean ransomware recovery cost, excluding ransom payments (2026 edition)
    parameter: impact.likely
    value: 1660000
    unit: currency
    currency: USD
    source_id: sophos_state_ransomware_au_2026
    source_name: Sophos The State of Ransomware in Australia 2026
    source_type: industry_survey
    source_url_or_citation: https://www.sophos.com/en-us/whitepaper/state-of-ransomware-australia
    publication_date: '2026-07-01'
    extraction_date: '2026-08-23'
    citation_detail: >-
      Business impact section (printed page 3): "Excluding any ransom payments, the average
      (mean) recovery cost for Australian organizations from their ransomware attack was
      $1.66 million, a significant increase from the $0.65 million mean in the 2025 report.
      This includes the costs of downtime, people time, device cost, network cost, lost
      opportunity, etc." Verified in the gathered artifact.
    extraction_notes: >-
      Replaces sophos_au_2025_ransomware_recovery_cost_usd, which held the same quantity from
      the prior edition of the same country cut. Same publisher, same country, same construct
      (mean recovery cost excluding ransom), successor edition - which is why the swap is a
      refresh rather than a change of anchor. The 2025 record is kept: it remains a true
      statement about what the 2025 report published, and editing its value would falsify it.
      Found by engine/editions.py, which flags a parameter citing an edition a newer registered
      edition supersedes; docs/CROSS_SOURCE.md had been publishing the 2026 figure since
      2026-08-21 while this shard was anchored on the 2025 one.
    normalization_notes: >-
      Stored in source currency USD; the calibration converts to AUD with the explicit RBA FX
      assumption. Sophos states that all financial data points in this report are in U.S.
      dollars. The construct covers downtime, people time, device cost, network cost and lost
      opportunity.
    limitations: >-
      Excludes any ransom payments, and that exclusion bites harder than it did in 2025: 57% of
      Australian organizations paid the ransom and got data back (up from 41%), at a median
      Australian payment of USD 855,000 (up from USD 186,000), so the all-in cost of a paid
      incident is now materially further above this anchor. Mean over 119 Australian
      organizations of 100-5,000 employees across all sectors, conditional on having been hit;
      the sector dimension stays bridged for a financial-services shard. n fell from 191 to 119.
      Sophos removed outlier ransoms of USD 40 million or more before publication, so the
      published population is truncated at the top. Self-reported and vendor-commissioned. The
      level has now moved steeply in both directions across three editions - USD 2.37M (2024
      survey), 0.65M (2025), 1.66M (2026) - which is a 2.55x rise on the back of a 3.6x fall.
      Treat the level as indicative and volatile, not as a trend.
    confidence: medium
    evidence_type: source_backed
    measurement_basis: cost_component
    applicability:
      industries: [all]
      countries: [AU]
      company_size_bands: [all]
      threats: [ransomware]

  - id: latitude_1h23_au_cyber_incident_cost_aud
    title: Latitude Financial documented cyber-incident cost (stress anchor)
    parameter: impact.max
    value: 76000000
    unit: currency
    currency: AUD
    source_id: latitude_1h23_results_2023
    source_name: Latitude Group Holdings 1H23 Results Investor Presentation
    source_type: company_disclosure
    source_url_or_citation: https://investors.latitudefinancial.com.au/DownloadFile.axd?file=%2FReport%2FComNews%2F20230818%2F02698845.pdf
    publication_date: "2023-08-18"
    extraction_date: "2026-08-02"
    citation_detail: Notable Items slide (printed page 22) reports Cyber at AUD 76M pre-tax for the half-year ended 30 June 2023 - AUD 11.8M costs incurred responding to the March 2023 incident plus AUD 64.1M provided for ID remediation and legal cost estimates. Verified in the gathered PDF text.
    extraction_notes: Replaces the Cyentia global top-5% cyber-event loss bridge (USD 52M, previously converted to AUD 72.3M) with a documented Australian financial-services loss disclosed to the ASX - the stress bound barely moves (AUD 72.3M to 76M) while the anchor becomes country- and sector-resident.
    normalization_notes: Stored in AUD as disclosed; used directly with rounding, no FX conversion. Pre-tax costs and provisions as reported at 1H23.
    limitations: A single documented event, not a loss-distribution percentile. The March 2023 incident was a data-theft extortion attack (a ransom was demanded and refused, consistent with government advice); encryption was not confirmed and Latitude describes it as a cyber incident, so the ransomware threat dimension stays bridged. Latitude is a large ASX-listed lender far above the mid-market org profile - the size dimension stays bridged, and an AUD 76M loss is a deliberate stress ceiling, not a plausible mid-market outcome. The disclosed figure excludes potential regulatory fines, class actions and future system uplift (understating the true tail) and ignores possible insurance recoveries (overstating net loss).
    confidence: medium
    evidence_type: source_backed
    measurement_basis: single_documented_event_loss
    exceedance_basis: none_known
    applicability:
      industries: [financial_services]
      countries: [AU]
      company_size_bands: [all]
      threats: [all]

