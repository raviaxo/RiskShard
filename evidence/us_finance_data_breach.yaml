records:
  - id: us_finance_breach_frequency_min_uk_bridge
    title: US mid-market data-breach frequency floor (UK survey bridge)
    parameter: frequency.min
    value: 0.43
    unit: annual_probability
    source_id: uk_dsit_cyber_breaches_2026
    source_name: Cyber Security Breaches Survey 2025/2026
    source_type: official_statistics
    source_url_or_citation: https://www.gov.uk/government/statistics/cyber-security-breaches-survey-20252026/cyber-security-breaches-survey-20252026
    publication_date: "2026-04-30"
    extraction_date: "2026-07-19"
    citation_detail: The UK survey reports that 43% of all businesses identified a cyber security breach or attack in the last 12 months.
    extraction_notes: Used the UK all-business breach/attack prevalence as a broad lower frequency anchor pending a US-specific per-firm breach prevalence source.
    normalization_notes: Converted 43% to 0.43. Applied as a source-backed cross-country bridge because the US publishes breach counts (ITRC, DBIR) but no clean per-firm annual breach prevalence.
    limitations: UK official survey used as a bridge; not US-specific and not financial-services-specific; covers identified breaches or attacks, broader than privacy-only data breach.
    confidence: medium
    evidence_type: source_backed
    applicability:
      industries: [all]
      countries: [US]
      company_size_bands: [all]
      threats: [data_breach]

