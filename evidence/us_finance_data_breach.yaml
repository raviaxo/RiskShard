  - id: us_finance_breach_frequency_max_uk_bridge
    title: US mid-market data-breach stress frequency (UK survey bridge)
    parameter: frequency.max
    value: 0.69
    unit: annual_probability
    source_id: uk_dsit_cyber_breaches_2026
    source_name: Cyber Security Breaches Survey 2025/2026
    source_type: official_statistics
    source_url_or_citation: https://www.gov.uk/government/statistics/cyber-security-breaches-survey-20252026/cyber-security-breaches-survey-20252026
    publication_date: "2026-04-30"
    extraction_date: "2026-07-19"
    citation_detail: The UK survey reports that 69% of large businesses identified a cyber security breach or attack in the last 12 months.
    extraction_notes: Used the UK large-business breach/attack prevalence as a stress frequency anchor pending US-specific evidence.
    normalization_notes: Converted 69% to 0.69. Applied as a source-backed cross-country bridge for larger-exposure stress.
    limitations: UK official survey used as a bridge; not US-specific and not financial-services-specific; large-business prevalence can overstate mid-market likelihood.
    confidence: medium
    evidence_type: source_backed
    applicability:
      industries: [all]
      countries: [US]
      company_size_bands: [all]
