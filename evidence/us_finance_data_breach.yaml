  - id: us_finance_breach_impact_max_ibm_financial_services_usd
    title: US financial-services average data-breach cost (stress ceiling)
    parameter: impact.max
    value: 5560000
    unit: currency
    currency: USD
    source_id: ibm_cost_data_breach_2025
    source_name: Cost of a Data Breach Report 2025
    source_type: data_breach_cost_research
    source_url_or_citation: https://www.ibm.com/reports/data-breach
    publication_date: "2025-07-30"
    extraction_date: "2026-07-19"
    citation_detail: IBM's 2025 report identifies financial services as the second-costliest industry for data breaches, at an average of USD 5.56 million.
    extraction_notes: Used the financial-services industry average as a financial-services-specific stress ceiling for a severe, enterprise-scale breach.
    normalization_notes: Stored directly in USD. Selected as impact.max because the financial-services average reflects large-scale breach costs well above a typical mid-market incident.
    limitations: Enterprise-weighted studied breach population; not mid-market-specific and not a full tail distribution; used as a scale stress anchor, not an expected mid-market loss.
    confidence: medium
    evidence_type: source_backed
    applicability:
      industries: [financial_services]
      countries: [all]
      company_size_bands: [all]
      threats: [data_breach]
