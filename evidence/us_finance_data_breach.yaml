  - id: us_finance_breach_impact_min_netdiligence_sme_crisis_usd
    title: US SME cyber crisis-services cost floor
    parameter: impact.min
    value: 152000
    unit: currency
    currency: USD
    source_id: netdiligence_cyber_claims_2025
    source_name: NetDiligence Cyber Claims Study 2025 (Fifteenth Annual)
    source_type: cyber_insurance_claims_research
    source_url_or_citation: https://netdiligence.com/cyber-claims-study-2025-report/
    publication_date: "2025-09-23"
    extraction_date: "2026-07-19"
    citation_detail: NetDiligence reports an average crisis-services cost of USD 152,000 for SME cyber claims (organizations under USD 2B revenue).
    extraction_notes: Used the US SME crisis-services average as a conservative direct-response cost floor for a mid-market breach.
    normalization_notes: Stored directly in USD. Selected as a material-cost floor, not expected total breach cost.
    limitations: Insured-claim crisis-services subset; not full total loss; SME band is broad (under USD 2B revenue) and not isolated to financial services.
    confidence: medium
    evidence_type: source_backed
    applicability:
      industries: [all]
      countries: [US]
      company_size_bands: [mid_market]
      threats: [data_breach]

