  - id: us_finance_breach_impact_min_netdiligence_sme_crisis_usd
    title: US SME cyber crisis-services cost floor
    parameter: impact.min
    value: 152000
    unit: currency
    currency: USD
    source_id: netdiligence_cyber_claims_2025
    source_name: NetDiligence Cyber Claims Study 2025 (Fifteenth Annual)
    source_type: cyber_insurance_claims_research
    source_url_or_citation: https://netdiligence.com/cyber-claims-study-2025-report/
    publication_date: "2025-09-23"
    extraction_date: "2026-07-19"
    citation_detail: NetDiligence reports an average crisis-services cost of USD 152,000 for SME cyber claims (organizations under USD 2B revenue).
    extraction_notes: Used the US SME crisis-services average as a conservative direct-response cost floor for a mid-market breach.
    normalization_notes: Stored directly in USD. Selected as a material-cost floor, not expected total breach cost.
    limitations: Insured-claim crisis-services subset; not full total loss; SME band is broad (under USD 2B revenue) and not isolated to financial services.
    confidence: medium
    evidence_type: source_backed
    applicability:
      industries: [all]
      countries: [US]
      company_size_bands: [mid_market]
      threats: [data_breach]

  - id: us_finance_breach_impact_likely_netdiligence_fs_sme_5yr_usd
    title: US financial-services SME average incident cost (five-year)
    parameter: impact.likely
    value: 329000
    unit: currency
    currency: USD
    source_id: netdiligence_cyber_claims_2025
    source_name: NetDiligence Cyber Claims Study 2025 (Fifteenth Annual)
    source_type: cyber_insurance_claims_research
    source_url_or_citation: https://netdiligence.com/cyber-claims-study-2025-report/
    publication_date: "2025-09-23"
    extraction_date: "2026-07-30"
    citation_detail: "Figure 45 (Average Incident Cost - Financial Services, SMEs, N=579) reports a five-year average incident cost of USD 329K, with yearly averages of 201K (2020), 284K (2021), 310K (2022), 517K (2023) and 434K (2024). The accompanying text states the average annual revenue of financial-services organizations in the sample was USD 113M (maximum USD 1.9B)."
    extraction_notes: Replaced the all-sector SME average (USD 264,000) with the financial-services SME figure from the same study, so the central estimate matches the shard's industry as well as its country and size. Used the five-year average rather than the 2024 value (434K) because single years are volatile in this series - 2023 spiked to 517K - and the five-year figure is the study's own smoothed measure.
    normalization_notes: Stored directly in USD. The sector sample's average annual revenue (USD 113M) sits squarely in the mid-market band, so this is the closest cell-matched central estimate available.
    limitations: "Insured-claim sample: covers claims of USD 1K or more that reached an insurer, so it excludes uninsured, self-absorbed and unreported losses, and is censored by policy limits and self-insured retentions. The SME band spans revenue up to USD 2B even though the financial-services sample averages USD 113M. Pooled 2020-2024 in nominal dollars with no inflation adjustment. RiskShard's mid_market band is defined by headcount while this segmentation is by revenue - the mapping is an explicit assumption, not a measurement."
    confidence: medium
    evidence_type: source_backed
    applicability:
      industries: [financial_services]
      countries: [US]
      company_size_bands: [mid_market]
      threats: [data_breach]

  - id: us_finance_breach_impact_max_netdiligence_fs_sme_observed_usd
    title: US financial-services SME largest observed incident cost
    parameter: impact.max
    value: 11500000
    unit: currency
    currency: USD
    source_id: netdiligence_cyber_claims_2025
    source_name: NetDiligence Cyber Claims Study 2025 (Fifteenth Annual)
    source_type: cyber_insurance_claims_research
    source_url_or_citation: https://netdiligence.com/cyber-claims-study-2025-report/
    publication_date: "2025-09-23"
    extraction_date: "2026-07-30"
    citation_detail: "Financial Services section: \"Financial services claims accounted for 6% of all claims and 8% of total incident cost at SMEs. Total incident cost ranged from $1K to $11.5M.\" (N=579 claims, 2020-2024, organizations with average annual revenue of USD 113M.)"
    extraction_notes: Replaced the previous ceiling (IBM's USD 5.56M financial-services industry *average*) with the largest incident cost actually observed among financial-services SME claims. An industry average is a measure of central tendency and was standing in for a tail; this is a real observed maximum for the shard's own cell.
    normalization_notes: Stored directly in USD. Selected as impact.max because it is the upper bound of the observed cost range for exactly this country, industry and size segment.
    limitations: "A single observed claim, not a modelled percentile - it is the maximum of 579 claims over five years, so it says nothing about how much worse a loss could be, and a larger sample would likely show a larger maximum. Insured-claim basis, so it is censored by policy limits and excludes uninsured or unreported losses. The SME band spans revenue up to USD 2B. Nominal 2020-2024 dollars, not inflation-adjusted."
    confidence: medium
    evidence_type: source_backed
    applicability:
      industries: [financial_services]
      countries: [US]
      company_size_bands: [mid_market]
      threats: [data_breach]
