  - id: cyentia_iris_2022_typical_cyber_event_loss_usd
    title: Typical reported cyber-event financial loss
    parameter: impact.min
    value: 266000
    unit: currency
    currency: USD
    source_id: cyentia_iris_2022
    source_name: Cyentia Information Risk Insights Study 2022
    source_type: cyber_loss_research
    source_url_or_citation: https://www.cyentia.com/publication/iris-2022/
    publication_date: "2022-01-01"
    extraction_date: "2026-06-03"
    artifact_verified_at: "2026-11-20"
    artifact_verified_sha256: 8cf45ef222a4375dba486bd942c5734796e65b93f181e3431e60efed0d491677
    citation_detail: 'Table 3, loss magnitude statistics for 1,893 cyber events: geometric mean USD 266,000, median USD 259,000, minimum USD 32, first quartile USD 29,000, third quartile USD 2,000,000, 95th percentile USD 52,000,000, maximum USD 12,000,000,000. Figure 6 states the same pair as "Median loss: $259K / Geometric mean: $266K". Read from the held report on 2026-11-20; the previous value of this field quoted the publisher summary page, which says only "typical financial costs reported for a cyber event stand at $266K" without saying which statistic that is.'
    extraction_notes: 'Cyentia reported a typical financial cost of USD 266,000 for a cyber event. Re-read against the held report on 2026-11-20 (ADR-0028). The USD 266,000 is the GEOMETRIC MEAN, not the median - the median is USD 259,000 - and this record carried measurement_basis: median_total_event_cost until then. IRIS 2025 confirms the convention changed, in its own footnote: "Prior IRIS used the geometric mean for a typical loss ... the median is better central measure for the updated distribution." The value is unchanged; the label was wrong and the right statistic had no name in our vocabulary.'
    normalization_notes: Stored in source currency and selected as a conservative lower loss anchor for a material data-breach scenario.
    limitations: 'Global cyber-event benchmark, not data-breach-only, Australia-specific, financial-services-specific, or a true minimum loss quantile. Published alongside and recorded 2026-11-20 so the figure we chose sits beside the ones we did not: median USD 259,000, minimum USD 32, first quartile USD 29,000, 95th percentile USD 52,000,000, over N=1,893 events. The arithmetic mean of the same distribution is over USD 25,000,000 and the report calls it "not a good measure of typical losses due to the long-tailed distribution" - which is why a geometric mean needed its own measurement_basis rather than being folded into mean_total_event_cost.'
    confidence: low
    evidence_type: source_backed
    measurement_basis: 'geometric_mean_total_event_cost'
    applicability:
      industries: [all]
      countries: [global]
      company_size_bands: [all]
      threats: [all]

  - id: securitybrief_ibm_2026_au_finserv_breach_average_cost_aud
    title: Australian financial-services average data-breach cost (IBM 2026 industry cut)
    parameter: impact.likely
    value: 6310000
    unit: currency
    currency: AUD
    source_id: securitybrief_ibm_au_breach_costs_2026
    source_name: SecurityBrief Australia coverage of IBM Cost of a Data Breach 2026
    source_type: news_report
    source_url_or_citation: https://securitybrief.com.au/story/australia-breach-costs-hit-aud-4-22-million-ibm-says
    publication_date: "2026-07-31"
    extraction_date: "2026-08-02"
    citation_detail: Article states "Financial services recorded the highest average breach cost at AUD $6.31 million per incident", within coverage of IBM's 2026 Australian figures (Australian average AUD 4.22M; study basis 602 breached organisations globally, March 2025 to February 2026). Verified in the gathered artifact.
    extraction_notes: Replaces the IBM 2025 global average (USD 4.44M, converted AUD 6.2M) as the selected likely anchor - the calibration's own rationale said to revise when Australian financial-services breach-cost evidence exists, and IBM's 2026 Australian industry cut supplies exactly that cell. The value barely moves (AUD 6.2M to 6.31M); the provenance becomes country- and industry-resident. The IBM global record and the UK financial-services record remain in this file as the documented alternatives not chosen.
    normalization_notes: Stored in AUD as reported; used directly with rounding, no FX conversion. Secondary coverage is used because IBM gates the full report behind a form and its public pages do not expose the Australian industry rows (same pattern as the Canada regional figure).
    limitations: Average across IBM's studied Australian financial-services breaches - IBM does not publish per-country-per-industry sample sizes, so this cell is thin by construction and the level should be treated as indicative. Enterprise-leaning studied population used for a mid-market org profile (size stays bridged); an average, not a distribution quantile. Secondary news coverage of the report rather than the gated primary PDF; the cited sentence was verified in the gathered artifact. Newer study year (2025-26 breaches) than the global 2025 anchor it replaces.
    confidence: medium
    evidence_type: source_backed
    measurement_basis: mean_total_event_cost
    applicability:
      industries: [financial_services]
      countries: [AU]
      company_size_bands: [all]
      threats: [data_breach]

  - id: cyentia_iris_2025_extreme_security_incident_loss_usd
    title: Extreme reported security-incident loss
    parameter: impact.max
    value: 32000000
    unit: currency
    currency: USD
    source_id: cyentia_iris_2025
    source_name: Cyentia Information Risk Insights Study 2025
    source_type: cyber_loss_research
    source_url_or_citation: https://www.cyentia.com/publication/iris2025/
    publication_date: "2025-06-10"
    extraction_date: "2026-06-03"
    artifact_verified_at: "2026-11-20"
    artifact_verified_sha256: 00706bbbfefcc7b6cc321dcbcc2347b3082af92572cbd55abd2239a901cf8f1c
    citation_detail: Public source page key findings; median losses rose toward $3M, with extreme events reaching $32M.
    extraction_notes: Cyentia reported extreme security incidents reaching USD 32 million.
    normalization_notes: 'Stored in source currency and selected as a stress loss anchor for a material data-breach scenario. Worth not reconciling later: the publisher key-findings page puts the 32M beside a 5-fold rise, but that rise belongs to the 90th percentile, which Figure 10 tracks from USD 6,000,000 in 2008 to USD 28,500,000 in 2024. The 32M is the pooled 95th percentile from Figure 9. They are different statistics and neither is wrong.'
    limitations: 'Global security-incident benchmark, not data-breach-only, Australia-specific, financial-services-specific, or a formal percentile for this scenario. It IS a formal percentile - the 95th of the study reported-loss distribution - but of a global all-incident population rather than this scenario, so the percentile is real and the population is not ours. Corrected 2026-11-20: this field said the figure was not "a formal percentile for this scenario", which read as no percentile existing, and that reading is the ADR-0024 defect in its original form.'
    confidence: low
    evidence_type: source_backed
    measurement_basis: observed_extremum
    exceedance_basis: 'modeled_quantile'
    exceedance_detail: 'USD 32,000,000 is the 95th percentile of the distribution of reported losses for security incidents from 2015 to 2024 (Cyentia Institute, Information Risk Insights Study 2025, Figure 9, labelled "$32M (95%)", and the body text - "The typical (median) incident costs about $600K, while more extreme (95th percentile) losses swell to $32 million"). Roughly 5% of reported security incidents in that corpus exceed this figure. The exceedance is over LOSSES REPORTED IN PUBLIC RECORDS, not over all incidents - the study notes its losses tend to be direct costs identifiable from breach disclosures, public company filings and litigation, which biases the corpus toward events that became public. Read from the held report on 2026-11-20. This record declared none_known until then because it was extracted from the publisher summary page, which states the 32M figure without the percentile (ADR-0024, ADR-0026).'
    applicability:
      industries: [all]
      countries: [global]
      company_size_bands: [all]
      threats: [all]

