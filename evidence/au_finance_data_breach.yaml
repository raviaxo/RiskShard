  - id: oaic_abs_au_finance_ndb_notification_rate_floor_2025
    title: Annualized Australian finance-sector NDB notification rate floor
    parameter: frequency.min
    value: 0.0008
    unit: annual_probability
    source_id: oaic_ndb_jul_dec_2024
    source_ids:
      - oaic_ndb_jul_dec_2024
      - abs_counts_australian_businesses_2025
    source_name: OAIC NDB Report July-Dec 2024 and ABS Counts of Australian Businesses 2024-25
    source_type: derived_regulator_statistical_benchmark
    source_url_or_citation: https://www.oaic.gov.au/__data/assets/pdf_file/0021/251184/Notifiable-data-breaches-report-July-to-December-2024.pdf
    publication_date: "2025-05-13"
    extraction_date: "2026-06-03"
    citation_detail: OAIC Page 15, Table 5 reported 54 finance notifications for July-Dec 2024; ABS industry section reported 133,743 Financial and Insurance Services businesses in 2024-25.
    extraction_notes: Annualized the OAIC half-year finance notification count to 108 and divided by the ABS active-business denominator of 133,743.
    normalization_notes: Calculation is (54 * 2) / 133,743 = 0.0008075, rounded to 0.0008. Used as a reported-notification frequency floor, not a likely breach rate.
    limitations: Covers eligible Australian NDB notifications only; all-size sector denominator is not mid-market-specific; multiple notifications by one entity and unreported/non-reportable breaches can distort organization-level probability. Confidence is medium for a reported-notification floor, not for a likely breach rate.
    confidence: medium
    evidence_type: source_backed
    applicability:
      industries: [financial_services]
      countries: [AU]
      company_size_bands: [all]
      threats: [data_breach]

