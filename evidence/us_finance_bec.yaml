    citation_detail: Coalition reports a policyholder wired USD 6.4 million to a fraudulent account, described as Coalition's largest clawback case, of which 85% (USD 5.5 million) was later recovered.
    extraction_notes: Used the USD 6.4 million gross single-event funds-transfer-fraud loss as a source-backed stress impact anchor.
    normalization_notes: Stored in USD as a single-event stress (tail) BEC/FTF loss, gross of clawback recovery. Sits above the USD 123,005 mean used for impact.likely.
    limitations: One documented extreme funds-transfer-fraud case from a cyber insurer's book, not a modeled loss percentile or a financial-services mid-market average; 85% was recovered via clawback in this instance, but recovery is not guaranteed, so the gross figure is modeled; BEC/FTF-specific but drawn from a single case. Revise when a US mid-market BEC loss distribution with tail quantiles is reviewed.
