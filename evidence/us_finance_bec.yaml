    citation_detail: SUSB 2022 U.S. all-industry employer-firm total, commonly cited as ~6.1 million employer firms. Cross-program counts range from 5.52M (Census Business Dynamics Statistics 2022) to ~6.3M (SBA Office of Advocacy 2024).
    extraction_notes: Used ~6,100,000 as the U.S. all-industry employer-firm denominator for BEC complaint-rate normalization.
    normalization_notes: Stored as a U.S. business-population denominator for frequency normalization, not used directly as an organization-level probability.
    limitations: All-industry, all-size denominator; not financial-services-specific or mid-market-specific. Authoritative national employer-firm counts range roughly 5.5M-6.3M by program and vintage; the derived reported-complaint floor of 0.004 is stable across that entire range.
