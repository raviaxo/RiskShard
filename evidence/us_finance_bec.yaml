  - id: afp_2025_us_bec_org_prevalence_frequency_likely
    title: US organization-level BEC prevalence used as likely frequency bridge
    parameter: frequency.likely
    value: 0.63
    unit: annual_probability
    source_id: afp_payments_fraud_2025
    source_name: 2025 AFP Payments Fraud and Control Survey Report
    source_type: industry_survey_bridge
    source_url_or_citation: https://web.archive.org/web/20250707164054/https://www.financialprofessionals.org/training-resources/resources/survey-research-economic-data/details/payments-fraud
    publication_date: "2025-08-26"
    extraction_date: "2026-07-20"
    citation_detail: The 2025 AFP Payments Fraud and Control Survey reports business email compromise as the most common payments-fraud method, with 63% of organizations reporting BEC activity in 2024.
    extraction_notes: Converted 63% organization-level BEC prevalence to 0.63 as a source-backed likely-frequency exposure bridge.
    normalization_notes: Converted 63% to 0.63. Selected as a US, BEC-specific likely-frequency exposure bridge until US mid-market financial-services BEC loss-event frequency is available.
    limitations: Survey measures organizations experiencing attempted or actual BEC, not confirmed financial-loss events; AFP respondents skew toward corporate treasury and larger organizations (AFP reports 66% of BEC attempts target organizations with at least USD 1B revenue), so this overall prevalence likely overstates a mid-market financial-services rate; not financial-services-specific. Revise when mid-market-specific BEC event-frequency evidence is reviewed.
    confidence: medium
    evidence_type: source_backed
    measurement_basis: org_prevalence_incident
    population_match:
      status: bridged
      bridged_on: [sector, size]
    applicability:
