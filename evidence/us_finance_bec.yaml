  - id: ic3_census_us_bec_reported_complaint_rate_floor_2026
    title: Annualized US BEC reported-complaint rate floor
    parameter: frequency.min
    value: 0.004
    unit: annual_probability
    source_id: fbi_ic3_2025_report
    source_ids:
      - fbi_ic3_2025_report
      - census_susb_2022
    source_name: FBI IC3 2025 Annual Report and U.S. Census SUSB 2022
    source_type: derived_statistical_benchmark
    source_url_or_citation: https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf
    publication_date: "2026-04-16"
    extraction_date: "2026-07-20"
    citation_detail: FBI IC3 2025 reported 24,768 US BEC complaints (all sectors); Census SUSB 2022 reports ~6,100,000 US employer firms (all industries).
    extraction_notes: Divided the all-sector IC3 BEC complaint count by the all-industry US employer-firm denominator to derive a reported-complaint frequency floor.
    normalization_notes: Calculation is 24,768 / 6,100,000 = 0.00406, rounded to 0.004. Used as a reported-complaint frequency floor, not a likely BEC event rate. The result rounds to 0.004 across the full 5.5M-6.3M denominator range.
    limitations: IC3 counts only complaints reported to the FBI and substantially undercounts true BEC incidence; numerator and denominator are both all-sector/all-industry, so this is an economy-wide reported floor, not financial-services-specific or mid-market-specific; it is a lower-bound floor, not a central likelihood. Confidence is medium for a reported-complaint floor, not for a likely BEC rate.
    confidence: medium
    evidence_type: source_backed
    measurement_basis: reported_case_rate
    population_match:
      status: bridged
      bridged_on: [sector, size]
    applicability:
      industries: [all]
      countries: [US]
      company_size_bands: [all]
      threats: [business_email_compromise]

