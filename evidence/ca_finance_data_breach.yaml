    citation_detail: Table cell "Incidents to steal personal or financial information" x "Finance and insurance [52]" x "Medium size enterprises", reference year 2021, reads 27.3% - StatCan quality code C, "use with caution" - the highest reading of the four survey cycles. Medium is 50 to 249 employees (table footnote 8).
    extraction_notes: Selected the highest same-cell reading across the four biennial cycles as the stress anchor. Verified in the gathered full-table CSV artifact (22100076.csv inside the registry zip). Replaces the reused OPC/CIRA 42% all-organization anchor, under which the stress bound equalled the likely bound.
    normalization_notes: Stored directly as 0.273 annual probability; the survey construct is enterprises impacted at least once during the reference year.
    limitations: The 2021 cell carries StatCan quality code C (use with caution) - the weakest of the three anchors; the adjacent large-band 2023 cell (23.9%, quality B) is the alternative stress anchor if the C-coded cell is rejected on review. Motive-classified construct, not confirmed breaches - counts impactful incidents aimed at stealing personal or financial information, so it can overstate confirmed-breach frequency (impactful attempts count) and understate it (breaches motivated by ransom or with unknown motive are classified under other incident types). StatCan medium is 50-249 employees while the shard org profile models 450 employees. Survey covers enterprises with 10 or more employees.
