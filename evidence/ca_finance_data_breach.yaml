  - id: netdiligence_2025_ca_maximum_incident_cost_usd
    title: Canadian maximum insured incident cost (NetDiligence 2020-2024)
    parameter: impact.max
    value: 15000000
    unit: currency
    currency: USD
    source_id: netdiligence_cyber_claims_2025
    source_name: NetDiligence Cyber Claims Study 2025 (Fifteenth Annual)
    source_type: cyber_insurance_claims_research
    source_url_or_citation: https://netdiligence.com/cyber-claims-study-2025-report/
    publication_date: "2025-09-23"
    extraction_date: "2026-08-02"
    citation_detail: Claims from Canada section (page 49) reports the average five-year total incident cost for Canadian claims at USD 874K with a documented maximum of USD 15M (N=84 claims, 2020-2024); verified in the gathered PDF text.
    extraction_notes: Selected the documented maximum of the Canadian claims dataset as the stress anchor, replacing the Cyentia global extreme-event bridge (USD 32M). Canadian insured-claims data is country-matched where Cyentia was global; the all-cause dataset is the remaining threat bridge.
    normalization_notes: Stored in source currency USD; calibration converts to CAD with the explicit Bank of Canada FX assumption. A dataset maximum, not a formal percentile.
    limitations: The maximum of 84 Canadian insured claims across all causes of loss, 2020-2024 - not data-breach-specific (threat bridged) and not a formal tail percentile. Insured-claims data structurally truncates the tail - uninsured organizations, self-retained costs above policy limits, and outlier Canadian breach losses (e.g. enterprise-scale events such as Desjardins, an order of magnitude larger) are invisible; review may prefer the wider Cyentia global extreme (USD 32M) if tail conservatism outweighs country specificity. Canadian organizations in the dataset average USD 654M annual revenue (enterprise-leaning vs the 85M CAD org profile), which makes the maximum an upper-leaning midmarket stress rather than an understated one.
    confidence: medium
    evidence_type: source_backed
    population_match:
      status: bridged
      bridged_on: [threat]
    applicability:
      industries: [all]
      countries: [CA]
      company_size_bands: [all]
      threats: [all, data_breach]
