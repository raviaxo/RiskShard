  - id: netdiligence_2025_ca_hacker_claims_average_cost_usd
    title: Canadian hacker-claims average incident cost (NetDiligence 2020-2024)
    parameter: impact.min
    value: 66000
    unit: currency
    currency: USD
    source_id: netdiligence_cyber_claims_2025
    source_name: NetDiligence Cyber Claims Study 2025 (Fifteenth Annual)
    source_type: cyber_insurance_claims_research
    source_url_or_citation: https://netdiligence.com/cyber-claims-study-2025-report/
    publication_date: "2025-09-23"
    extraction_date: "2026-08-02"
    citation_detail: Claims from Canada section (page 49, Table 2, Canada Top Causes of Loss 2020-2024) reports the Hacker cause of loss at 8 claims with an average incident cost of USD 66K; verified in the gathered PDF text.
    extraction_notes: Selected the Canadian Hacker-cause claims average as a conservative per-incident floor, replacing the Cyentia global all-cyber typical-loss bridge (USD 266K). Canadian insured-claims data is country-matched where Cyentia was global; the cause taxonomy is the remaining bridge.
    normalization_notes: Stored in source currency USD; calibration converts to CAD with the explicit Bank of Canada FX assumption. An average of a small claims subset used as a floor anchor, not a true minimum quantile.
    limitations: N=8 Canadian Hacker claims over five years - a thin cell; an average used as a floor, not a minimum quantile. NetDiligence classifies claims by cause of loss, not outcome, so Hacker claims are unauthorized-intrusion claims that may or may not involve confirmed data compromise - the threat dimension remains bridged. All-sector dataset whose Canadian organizations average USD 654M annual revenue (enterprise-leaning vs the 85M CAD org profile). Insured claims only, so uninsured incidents and self-retained costs are invisible.
    confidence: medium
    evidence_type: source_backed
    population_match:
      status: bridged
      bridged_on: [threat]
    applicability:
      industries: [all]
      countries: [CA]
      company_size_bands: [all]
      threats: [all, data_breach]

