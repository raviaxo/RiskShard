  - id: statcan_cscsc_ca_finance_medium_steal_info_2019_floor
    title: Canada finance-and-insurance medium-enterprise data-theft incident prevalence, 2019 cycle floor
    parameter: frequency.min
    value: 0.15
    unit: annual_probability
    source_id: statcan_cscsc_incident_types_22100076
    source_name: Statistics Canada Table 22-10-0076-01 (Canadian Survey of Cyber Security and Cybercrime)
    source_type: official_statistics
    source_url_or_citation: https://www150.statcan.gc.ca/n1/tbl/csv/22100076-eng.zip
    publication_date: "2024-10-21"
    extraction_date: "2026-08-02"
    citation_detail: Table cell "Incidents to steal personal or financial information" x "Finance and insurance [52]" x "Medium size enterprises", reference year 2019, reads 15.0% (quality B, very good); the lowest reading of the four survey cycles (2017 25.8, 2019 15.0, 2021 27.3, 2023 20.1). Medium is 50 to 249 employees (table footnote 8).
    extraction_notes: Selected the lowest same-cell reading across the four biennial cycles as the frequency floor. Verified in the gathered full-table CSV artifact (22100076.csv inside the registry zip).
    normalization_notes: Stored directly as 0.15 annual probability; the survey construct is enterprises impacted at least once during the reference year.
    limitations: Motive-classified construct, not confirmed breaches - counts impactful incidents aimed at stealing personal or financial information, so it can overstate confirmed-breach frequency (impactful attempts count) and understate it (breaches motivated by ransom or with unknown motive are classified under other incident types). StatCan medium is 50-249 employees while the shard org profile models 450 employees, which falls in StatCan large (250+); the same-cycle large-band cell reads 21.5%. Survey covers enterprises with 10 or more employees. Biennial; 2025 cycle expected around October 2026.
    confidence: medium
    evidence_type: source_backed
    population_match:
      status: matched
    applicability:
      industries: [financial_services]
      countries: [CA]
      company_size_bands: [mid_market]
