records:
  - id: uk_dsit_2026_business_breach_prevalence_all
    title: UK all-business cyber breach or attack prevalence
    parameter: frequency.min
    value: 0.43
    unit: annual_probability
    source_id: uk_dsit_cyber_breaches_2026
    source_name: Cyber Security Breaches Survey 2025/2026
    source_type: official_statistics
    source_url_or_citation: https://www.gov.uk/government/statistics/cyber-security-breaches-survey-20252026/cyber-security-breaches-survey-20252026
    publication_date: "2026-04-30"
    extraction_date: "2026-06-04"
    citation_detail: Summary and Chapter 4 report that 43% of UK businesses identified a cyber security breach or attack in the last 12 months.
    extraction_notes: Extracted the all-business annual prevalence percentage from the official UK survey.
    normalization_notes: Converted 43% to 0.43 and selected as a broad lower frequency anchor for a UK mid-market starter.
    limitations: Covers identified breaches or attacks, not privacy-only data breaches; hidden or unidentified events may be absent; all-business figure is not financial-services-specific.
    confidence: medium
    evidence_type: source_backed
    applicability:
      industries: [all]
      countries: [GB]
      company_size_bands: [all]
      threats: [data_breach]

