records:
  # ADR-0001 loss-stage provenance for the regulatory_penalty stage
  # (scenarios/gb_finance_data_breach_regulatory_chain.yaml). Loss-stage
  # parameters use loss_stage.<mode>.<field>.<bound> naming and are NOT counted
  # among a shard's six direct frequency/impact parameters. The conditional
  # probability likely and all three impact bounds are source-backed to ICO
  # enforcement data; the conditional-probability min/max are labeled estimates
  # of the enforcement range around the sourced likely.
  - id: ico_reg_penalty_conditional_probability_min
    title: Conditional probability of an ICO penalty given a breach - lower bound
    parameter: loss_stage.regulatory_penalty.conditional_probability.min
    value: 0.001
    unit: annual_probability
    source_name: RiskShard regulatory-penalty stage
    source_type: model_assumption
    source_url_or_citation: Modeled low-enforcement-year lower bound around the ICO-derived likely rate.
    publication_date: "2026-07-20"
    extraction_date: "2026-07-20"
    extraction_notes: Modeled lower bound of the P(ICO penalty | breach) range in a low-enforcement year.
    normalization_notes: Kept as an explicit estimate below the ICO-derived likely of 0.0015.
    limitations: Not directly source-backed; a modeled lower bound of the enforcement-rate range. Replace with a multi-year ICO breach-penalty rate series.
    confidence: low
    evidence_type: estimated
    applicability:
      industries: [financial_services]
      countries: [GB]
      company_size_bands: [mid_market]
      threats: [data_breach]

  - id: ico_reg_penalty_conditional_probability_likely
    title: Conditional probability of an ICO monetary penalty given a UK data breach
    parameter: loss_stage.regulatory_penalty.conditional_probability.likely
    value: 0.0015
    unit: annual_probability
    source_id: ico_monetary_penalties_2024
    source_ids:
      - ico_monetary_penalties_2024
      - ico_self_reported_breach_cases_2024_25
    source_name: ICO monetary penalties 2024 and ICO self-reported breach cases 2024/25
    source_type: derived_regulator_statistical_benchmark
    source_url_or_citation: https://www.urmconsulting.com/blog/analysis-of-fines-imposed-by-the-information-commissioners-office-in-2024
    publication_date: "2025-01-01"
    extraction_date: "2026-07-20"
    citation_detail: The ICO issued about 17 monetary penalties in 2024 against about 12,412 self-reported breach reports in 2024/25; 17 / 12,412 = 0.00137, with roughly 85% of breaches resolved informally with no fine.
    extraction_notes: Denominator-derived conditional probability P(ICO monetary penalty | breach).
    normalization_notes: 17 / 12,412 = 0.00137, rounded to a likely of 0.0015. A conditional (given a breach) probability gating a downstream loss stage, not an event frequency.
    limitations: Not all ICO penalties are data-breach specific (some are PECR/marketing), so the true breach-penalty rate is somewhat lower; a rare, tail-driving stage.
    confidence: low
    evidence_type: source_backed
    applicability:
      industries: [financial_services]
      countries: [GB]
      company_size_bands: [mid_market]
      threats: [data_breach]

  - id: ico_reg_penalty_conditional_probability_max
    title: Conditional probability of an ICO penalty given a breach - upper bound
    parameter: loss_stage.regulatory_penalty.conditional_probability.max
    value: 0.005
    unit: annual_probability
    source_name: RiskShard regulatory-penalty stage
    source_type: model_assumption
    source_url_or_citation: Modeled high-enforcement-year upper bound around the ICO-derived likely rate.
    publication_date: "2026-07-20"
    extraction_date: "2026-07-20"
    extraction_notes: Modeled upper bound of the P(ICO penalty | breach) range in a higher-enforcement scenario.
    normalization_notes: Kept as an explicit estimate above the ICO-derived likely of 0.0015 (2023 was ~0.002; a stricter enforcement stance is modeled higher).
    limitations: Not directly source-backed; a modeled upper bound of the enforcement-rate range. Replace with a multi-year ICO breach-penalty rate series.
    confidence: low
    evidence_type: estimated
    applicability:
      industries: [financial_services]
      countries: [GB]
      company_size_bands: [mid_market]
      threats: [data_breach]

  - id: ico_reg_penalty_impact_min_gbp
    title: ICO monetary penalty impact - typical smaller fine (GBP)
    parameter: loss_stage.regulatory_penalty.impact.min
    value: 150000
    unit: currency
    currency: GBP
    source_id: ico_monetary_penalties_2024
    source_name: ICO monetary penalties 2024 (enforcement analysis)
    source_type: regulator_statistics
    source_url_or_citation: https://www.urmconsulting.com/blog/analysis-of-fines-imposed-by-the-information-commissioners-office-in-2024
    publication_date: "2025-01-01"
    extraction_date: "2026-07-20"
    citation_detail: The average ICO fine in 2024 was GBP 153,722, with most penalties below GBP 250,000.
    extraction_notes: Used the 2024 average fine (~GBP 154k, rounded to 150,000) as the lower penalty impact bound.
    normalization_notes: Stored in GBP as the typical smaller-fine floor of the penalty distribution.
    limitations: An enforcement-outcome figure, not a loss quantile for a specific organization; not all penalties are data-breach specific.
    confidence: low
    evidence_type: source_backed
    applicability:
      industries: [financial_services]
      countries: [GB]
      company_size_bands: [mid_market]
      threats: [data_breach]

  - id: ico_reg_penalty_impact_likely_gbp
    title: ICO monetary penalty impact - material fine (GBP)
    parameter: loss_stage.regulatory_penalty.impact.likely
    value: 750000
    unit: currency
    currency: GBP
    source_id: ico_monetary_penalties_2024
    source_name: ICO monetary penalties 2024 (enforcement analysis)
    source_type: regulator_statistics
    source_url_or_citation: https://www.urmconsulting.com/blog/analysis-of-fines-imposed-by-the-information-commissioners-office-in-2024
    publication_date: "2025-01-01"
    extraction_date: "2026-07-20"
    citation_detail: The largest ICO fine in 2024 was GBP 750,000 (Police Service of Northern Ireland).
    extraction_notes: Used the GBP 750,000 material 2024 fine as the likely penalty impact.
    normalization_notes: Stored in GBP as a material-fine central anchor of the penalty distribution.
    limitations: An enforcement-outcome figure, not a loss quantile; skewed by rare large fines; not all penalties are data-breach specific.
    confidence: low
    evidence_type: source_backed
    applicability:
      industries: [financial_services]
      countries: [GB]
      company_size_bands: [mid_market]
      threats: [data_breach]

  - id: ico_reg_penalty_impact_max_gbp
    title: ICO monetary penalty impact - large fine (GBP)
    parameter: loss_stage.regulatory_penalty.impact.max
    value: 12700000
    unit: currency
    currency: GBP
    source_id: ico_monetary_penalties_2024
    source_name: ICO monetary penalties 2024 (enforcement analysis)
    source_type: regulator_statistics
    source_url_or_citation: https://www.urmconsulting.com/blog/analysis-of-fines-imposed-by-the-information-commissioners-office-in-2024
    publication_date: "2025-01-01"
    extraction_date: "2026-07-20"
    citation_detail: The ICO issued a GBP 12.7M penalty against TikTok in 2023; the statutory maximum is GBP 17.5M or 4% of turnover.
    extraction_notes: Used the GBP 12.7M TikTok-class penalty as the upper penalty impact bound (below the statutory cap).
    normalization_notes: Stored in GBP as the large-fine tail of the penalty distribution.
    limitations: A rare, headline fine, not a typical outcome; below the statutory maximum; not all penalties are data-breach specific.
    confidence: low
    evidence_type: source_backed
    applicability:
      industries: [financial_services]
      countries: [GB]
      company_size_bands: [mid_market]
      threats: [data_breach]
