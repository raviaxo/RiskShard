  - id: ibm_france_2025_national_average_breach_cost_eur
    title: France national average cost of a data breach (IBM 2025)
    parameter: impact.likely
    value: 3590000
    unit: currency
    currency: EUR
    source_id: ibm_france_cost_data_breach_2025
    source_name: "Rapport IBM 2025 : coût d'une violation de données en France"
    source_type: data_breach_cost_research
    source_url_or_citation: "https://fr.newsroom.ibm.com/Rapport-IBM-13-des-organisations-ont-signale-des-violations-de-modeles-ou-dapplications-dIA,-dont-97-ont-declare-ne-pas-disposer-de-controles-dacces-a-lIA-appropries"
    publication_date: "2025-07-30"
    extraction_date: "2026-07-15"
    citation_detail: "Primary IBM France release; 2025 France national average cost of a data breach is EUR 3.59M, with a financial-services sector average of EUR 4.65M, from 34 French organizations (March 2024-February 2025)."
    extraction_notes: Replaced the global IBM average bridge with the primary IBM France national average, reported directly in EUR, for the France finance likely-impact anchor.
    normalization_notes: Stored in EUR as reported; converted to the USD scenario currency via the reviewed ECB EUR/USD assumption in calibrations/fx_rates.yaml.
    limitations: All-sector France national average, not mid-market- or financial-services-specific; based on 34 French organizations and enterprise-weighted, so treat as an upper-leaning mid-market likely anchor. The France financial-services sub-figure (EUR 4.65M) rests on a small sample and is recorded as sector context, not the selected anchor.
