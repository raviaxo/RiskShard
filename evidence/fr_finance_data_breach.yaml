  - id: asteres_fr_cyberattack_cost_2022
    title: France average cost of a successful cyberattack (Asteres 2022)
    parameter: impact.min
    value: 58600
    unit: currency
    currency: EUR
    source_id: asteres_cout_cyberattaques_france_2022
    source_name: "Asteres - Le cout des cyberattaques reussies en France (2022)"
    source_type: economic_impact_study
    source_url_or_citation: "https://asteres.fr/site/wp-content/uploads/2023/06/ASTERES-CRIP-Cout-des-cyberattaques-reussies-16062023.pdf"
    publication_date: "2023-06-16"
    extraction_date: "2026-07-16"
    citation_detail: "Asteres reports the average cost of a successful cyberattack in France at EUR 58,600 (direct cost EUR 25,600 excluding ransom); figure verified in gathered PDF text."
    extraction_notes: Replaced the global Cyentia typical-loss bridge with a France-specific conservative floor.
    normalization_notes: Stored in EUR; converted to USD via the reviewed ECB EUR/USD assumption in calibrations/fx_rates.yaml.
    limitations: Economy-wide France average across all organization sizes and all cyberattack types, not data-breach-specific, financial-services-specific, or a true minimum quantile. Used only as a conservative lower-bound anchor.
    confidence: medium
    evidence_type: source_backed
    measurement_basis: mean_total_event_cost
    population_match:
      status: bridged
      bridged_on: [threat]
    applicability:
      industries: [all]
      countries: [FR]
      company_size_bands: [all]
