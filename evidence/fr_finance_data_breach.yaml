  - id: gdpr_article_83_max_fine_2018
    title: GDPR Article 83(5) maximum administrative fine (regulatory stress anchor)
    parameter: impact.max
    value: 20000000
    unit: currency
    currency: EUR
    source_id: gdpr_article_83_administrative_fines
    source_name: "GDPR Article 83(5) maximum administrative fine (via CNIL)"
    source_type: legislation
    source_url_or_citation: "https://www.cnil.fr/fr/cnil-direct/question/sanctions-quelles-sanctions-peuvent-etre-prononcees-par-la-cnil"
    publication_date: "2018-05-25"
    extraction_date: "2026-07-16"
    citation_detail: "CNIL states the GDPR maximum administrative fine for the most serious breaches is EUR 20 million or 4% of worldwide annual turnover, whichever is higher (page text: '20 millions', '4 %'); verified in gathered HTML."
    extraction_notes: Replaced the global Cyentia extreme-loss bridge with the GDPR/CNIL statutory maximum fine as a France/EU regulatory stress anchor, mirroring the UK FCA-penalty and AU Privacy-Act-cap pattern.
    normalization_notes: EUR 20M absolute cap (the binding ceiling for a mid-market firm) stored in EUR; converted to USD via the reviewed ECB EUR/USD assumption in calibrations/fx_rates.yaml.
    limitations: Statutory maximum penalty cap, not a total event-loss estimate, expected loss, or claims severity; actual fines depend on regulator and case facts.
    confidence: medium
    evidence_type: source_backed
    measurement_basis: statutory_penalty_cap
    exceedance_basis: population_ceiling
    population_match:
      status: matched
    applicability:
      industries: [all]
      countries: [FR]
      company_size_bands: [all]
      threats: [data_breach]
