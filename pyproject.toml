[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskshard"
version = "0.3.0"
description = "Evidence-backed quantitative cyber risk shard engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Sergio Alonso" }]
dependencies = [
  "jsonschema>=4.0,<5",
  "matplotlib>=3.7,<4",
  "PyYAML>=6.0,<7",
]

[project.scripts]
riskshard = "scripts.fair_calc:main"
riskshard-calibrate = "scripts.calibrate_scenario:main"
riskshard-console = "scripts.riskshard_console:main"
riskshard-web-console = "scripts.riskshard_web_console:main"
riskshard-feeds = "scripts.data_governance:main"
riskshard-readiness = "scripts.readiness_dashboard:main"
riskshard-data-pack = "scripts.data_pack_manifest:main"
riskshard-preflight = "scripts.contributor_preflight:main"
riskshard-doctor = "scripts.riskshard_doctor:main"
riskshard-modules = "scripts.riskshard_modules:main"
riskshard-toprisks = "scripts.riskshard_toprisks:main"
riskshard-weekly = "scripts.weekly_digest:main"
riskshard-package-smoke = "scripts.package_smoke:main"
riskshard-benchmark = "scripts.benchmark_program:main"
riskshard-beta = "scripts.beta_readiness:main"
riskshard-clean-install = "scripts.clean_install_proof:main"

[tool.setuptools]
packages = ["engine", "scripts"]
py-modules = []
