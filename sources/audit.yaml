      distribution:
        basis: verified_against_artifact
        publishes: true
        verified_on: '2026-08-15'
        detail: >-
          A full bucketed severity histogram: "Distribution of ransom payments 2022-24"
          (n=1,097 for 2024), banded from "Less than $1,000" through "$1,000,000 and
          $4,999,999" to "$5 million or more", with a percentage in every band.
      exceedance:
        basis: verified_against_artifact
        publishes: true
        verified_on: '2026-08-15'
        detail: >-
          Stated, by construction of the histogram's open top band: 13% of paid ransoms
          were "$5 million or more" in 2024. An open-ended band with a percentage is a
          statement that a magnitude was exceeded that often, over a named sample —
          unlike a dot plot, which a reader would have to count.
      population:
        basis: verified_against_artifact
        publishes: true
        verified_on: '2026-08-15'
        detail: >-
          Base numbers given per chart (n=965/216/1,097 by year) and the survey's
