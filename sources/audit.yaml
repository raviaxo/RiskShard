  - source_id: cyentia_iris_2025
    artifact_sha256: 00706bbbfefcc7b6cc321dcbcc2347b3082af92572cbd55abd2239a901cf8f1c
    artifact: sources/raw/cyentia_iris_2025.pdf
    properties:
      mode:
        basis: verified_against_artifact
        publishes: false
        verified_on: '2026-08-15'
        detail: >-
          No modal value — and it is the one source that visibly reasons about the choice: "Prior IRIS used the geometric mean for a typical loss. Since the growing shoulder in lower part of the distribution pulls the geomean down, the median is better central measure." It deliberates over central tendency and still never reaches for a mode.
      distribution:
        basis: verified_against_artifact
        publishes: true
        verified_on: '2026-08-15'
        detail: >-
          The most complete in the corpus. Figure 9 is "Distribution of reported losses for security incidents from 2015 to 2024", plotted on a log scale, with "Loss percentile" used as an axis; the median incident costs about $600K.
      exceedance:
        basis: verified_against_artifact
        publishes: true
        verified_on: '2026-08-15'
        detail: >-
          Stated: "The typical (median) incident costs about $600K, while more extreme (95th percentile) losses swell to $32 million", and "The top 5% of loss events continue to exceed the annual revenue of affected firms." It also documents where it uses the 90th rather than the 95th percentile and why, which is a care about tail estimation no other source here shows.
      population:
        basis: verified_against_artifact
        publishes: true
        verified_on: '2026-08-15'
        detail: >-
          A historical dataset of publicly reported cyber events drawn from Advisen's Cyber Loss Data, with the reporting-lag bias discussed rather than hidden.

