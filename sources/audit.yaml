      distribution:
        basis: verified_against_artifact
        publishes: false
        verified_on: '2026-08-15'
        detail: >-
          Point statistics only. Complaint counts and total losses, an average loss of
          $20,699, and breakdowns by crime type, age group and state — categorical
          splits of a total, not a distribution over loss magnitude. No median,
          percentile or quantile appears.
      exceedance:
        basis: verified_against_artifact
        publishes: false
        verified_on: '2026-08-15'
        detail: >-
          None. The word "exceed" appears only of aggregate totals passing a round
          number, e.g. losses to investment scams exceeding $8 billion, which is a sum
          rather than a statement about how often an individual loss is passed.
      population:
        basis: verified_against_artifact
        publishes: true
        verified_on: '2026-08-15'
        detail: >-
          Nameable and important to name: the population is complaints reported to IC3
          (1,008,597 in the year, $20.877bn in losses), which is a self-selected
