    for ID remediation and legal cost estimates; ID replacements are ~80% of costs. The
    figure excludes potential regulatory fines, class actions and future system uplift, and
    may be partly offset by insurance recoveries - as a loss anchor it is therefore
    conservative for the tail. The incident was a data-theft extortion event (ransom
    demanded and refused, consistent with government advice); encryption was not confirmed
    and Latitude describes it as a cyber incident, so the ransomware threat dimension stays
    bridged wherever this is cited. Latitude is a large ASX-listed lender (~A$1B revenue
    scale), well above the mid-market org profile - size stays bridged too.

