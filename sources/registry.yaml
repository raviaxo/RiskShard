  - id: coalition_ftf_largest_clawback_2023
    title: Coalition funds transfer fraud largest clawback case
    publisher: Coalition
    source_type: cyber_insurer_claims
    url: https://www.coalitioninc.com/blog/how-coalition-recovered-usd5-5m-in-stolen-money-after-funds-transfer-fraud
    publication_date: "2023-06-08"
    access_mode: public_html
    intended_use:
      - BEC funds transfer fraud single-event tail loss
      - stress impact anchor
    usage_notes: >
      Use as a documented single-event funds-transfer-fraud loss from a cyber
      insurer's mid-market book (USD 6.4M wired, described as Coalition's largest
      clawback case). It is one documented extreme case, not a modeled loss
      percentile; 85% was recovered via clawback, but recovery is not
      guaranteed, so model gross exposure. Preserve these limitations when using
      it as a stress anchor.

