  publication_date: '2025-12-16'
  access_mode: public_html
  intended_use:
  - Australia business population denominator
  - industry denominator
  - frequency normalization
  usage_notes: 'Use as an official Australian business-count denominator. Preserve limitations when combining
    it with incident, notification, or loss-event counts from other sources.

    '
  url_stability: dated
- id: abs_characteristics_australian_business_2025
  title: Characteristics of Australian Business, 2024-25 financial year
  publisher: Australian Bureau of Statistics
  source_type: official_statistics
  url: https://www.abs.gov.au/statistics/industry/technology-and-innovation/characteristics-australian-business/2024-25
  fallback_urls:
  - https://www.abs.gov.au/statistics/industry/technology-and-innovation/characteristics-australian-business/latest-release
  publication_date: '2026-06-25'
  access_mode: public_html
  intended_use:
  - Australian business cyber-incident prevalence
  - frequency bridge
  usage_notes: 'Use as an official Australian org-level cyber-incident prevalence source (21% of businesses
    experienced a cyber security incident in 2024-25). It is an all-industry, all-size, all-cyber measure,
    not BEC-specific or mid-market-financial-services-specific. Preserve these limitations when using
    it as a BEC frequency bridge. Re-pointed 2026-08-01 from the /latest-release alias to the edition-pinned
    2024-25 URL so a future release cannot silently replace the cited edition (the ibm.com/reports failure
    mode); the alias is kept as a fallback.

    '
  url_stability: dated
- id: myob_business_monitor_cyber_2024
  title: MYOB mid-sized business cyber attack survey 2024
  publisher: MYOB (survey conducted by Dynata)
  source_type: industry_survey
  url: https://cfotech.com.au/story/cyber-attacks-impact-60-of-mid-sized-australian-businesses
  publication_date: '2024-06-01'
  access_mode: public_html
  intended_use:
  - Australian mid-sized business cyber-attack prevalence
  - sector stress-frequency bridge
  usage_notes: 'Use as an Australian mid-sized business (20-500 FTE, revenue over AUD 5M) cyber-attack
    prevalence source. Survey by Dynata for MYOB, fieldwork 22 March - 15 April 2024, n=593. Reports 60%
    of mid-sized businesses and 81% of finance and insurance mid-sized businesses experienced a cyber
    attack. Commercial vendor survey (lower trust than official statistics), all-cyber not BEC-specific.
    Figure accessed via CFOtech reporting of the MYOB survey.

    '
  url_stability: dated
- id: cybersecurity_insiders_insider_threat_2024
  title: Cybersecurity Insiders 2024 Insider Threat Report
  publisher: Cybersecurity Insiders
  source_type: industry_survey
  url: https://web.archive.org/web/20241229032228/https://www.cybersecurity-insiders.com/portfolio/2024-insider-threat-report-gurucul/
  fallback_urls:
  - https://www.cybersecurity-insiders.com/portfolio/2024-insider-threat-report-gurucul/
  publication_date: '2024-06-01'
  access_mode: public_html
  intended_use:
  - organization-level insider attack prevalence
  - frequency bridge
  usage_notes: 'Use as an organization-level insider-attack frequency source. The report page states
    that 48% of organizations reported insider attacks became more frequent over the past 12 months and
    51% experienced six or more attacks in the past year (average remediation cost exceeding USD 1M for
    29%). Vendor-sponsored survey (lower trust than official statistics); "insider attacks" is broad and
    includes negligent and careless insiders, not only deliberate misuse. Preserve these limitations
    when using it as a frequency bridge. Re-pointed 2026-08-01: the originally registered URL (no
    -gurucul suffix) now redirects to the site homepage, so the gathered artifact was unrelated content;
    primary is an immutable archive.org snapshot of the real report page. Record review 2026-08-01: the
    previously quoted "76% experienced insider attacks in 2024, up from 66% in 2019" appears in neither
    this report nor the Securonix 2024 release (whose 76% is "detected increased insider threat activity
    over the past five years" - a different construct); it was a secondary-compilation distortion and
    the evidence records that cited it have been corrected to artifact-backed figures.

    '
  url_stability: dated
- id: gurucul_insider_risk_report_2026
  title: Gurucul 2026 Insider Risk Report
  publisher: Cybersecurity Insiders (sponsored by Gurucul)
  source_type: industry_survey
  url: https://www.cybersecurity-insiders.com/inside-threats-how-ai-transformed-2026s-insider-risk-landscape/
  publication_date: '2026-03-19'
  access_mode: public_html
  intended_use:
  - organization-level insider incident prevalence
  - stress-frequency bridge
  usage_notes: 'Use as an organization-level insider-incident prevalence source. Survey of 725 IT and
    security professionals conducted in late 2025; reports that only 10% of organizations had zero insider
    incidents in the past 12 months (i.e. 90% experienced at least one), up from 83% (17% zero) in 2024.
    Vendor-sponsored survey (lower trust than official statistics); "insider incidents" is broad and includes
    negligent insiders, not only deliberate misuse. Preserve these limitations when using it as a stress
    bridge.

    '
  url_stability: dated
- id: bci_supply_chain_resilience_2024
  title: BCI Supply Chain Resilience Report 2024
  publisher: Business Continuity Institute
  source_type: industry_survey
  url: https://web.archive.org/web/20260701164556/https://www.thebci.org/news/supply-chain-disruptions-drive-increased-tier-mapping-and-insurance-uptake.html
  fallback_urls:
  - https://www.thebci.org/news/supply-chain-disruptions-drive-increased-tier-mapping-and-insurance-uptake.html
  - https://www.thebci.org/resource/bci-supply-chain-resilience-report-2024.html
  publication_date: '2024-11-01'
  access_mode: public_html
  intended_use:
  - organization-level supply-chain disruption prevalence
  - third-party disruption cause share
  - frequency bridge
  usage_notes: 'Use as an organization-level supply-chain disruption prevalence source (almost 80% of
    organizations supply chains disrupted in the past twelve months; 43.6% of organizations experienced
    supply chain disruption due to third-party failures, the most frequent cause). Broad supply-chain
    disruption (all causes) for the 80% figure, and BCI-membership survey (resilience-mature skew), not
    sector- or size-specific. Preserve these limitations when using it as a third-party-outage frequency
    bridge. Re-pointed 2026-08-01 (record review): the report landing page never carried the 43.6%
    figure (gated PDF); the artifact is now an immutable snapshot of the BCI news release, which states
    both figures - verified before registering. The live news URL and the report page are fallbacks.

    '
  url_stability: dated
- id: interos_global_supply_chain_2022
  title: Interos Annual Global Supply Chain Report (Resilience 2022)
  publisher: Interos
  source_type: industry_survey
  url: https://cms.interos.ai/wp-content/uploads/2022/05/Resilience-2022_Interos_Annual-Global-Supply-Chain-Report_5_11_2022.pdf
  publication_date: '2022-03-01'
  access_mode: public_html
  intended_use:
  - supply-chain disruption event frequency
  - stress-frequency basis
  usage_notes: 'Use as supply-chain disruption event-frequency context (organizations faced on average
    three major supply-chain events in the last 12 months, costing an average of USD 182M). Vendor survey;
    all-cause supply-chain events, not third-party-only. Supports a near-ceiling stress frequency via
    an interpretive multi-event conversion, not a directly reported prevalence.

    '
  url_stability: rolling
- id: spf_bec_interception_case_2024
  title: SPF Business Email Compromise scam interception case 2024
  publisher: Singapore Police Force
  source_type: law_enforcement_report
  url: https://www.police.gov.sg/media-hub/news/2024/20241008_international_cooperation_leading_to_the_interception
  publication_date: '2024-10-08'
  access_mode: public_html
  intended_use:
  - Singapore BEC single-event loss
  - stress impact anchor
  usage_notes: 'Use as a documented Singapore BEC single-event loss. A Singapore-based investment banking
    firm initiated transfers of about USD 6.66M to a scammer on 19-20 September 2024; SPF and US authorities
    intercepted over USD 5M. One documented extreme case, not a loss distribution or a mid-market average;
    the gross transferred amount is modeled, gross of recovery.

    '
  url_stability: dated
- id: regula_deepfake_survey_2024
  title: Regula Deepfake Fraud Impact Survey 2024
  publisher: Regula
  source_type: industry_survey
  url: https://regulaforensics.com/blog/impact-of-deepfakes-on-idv-regula-survey/
  publication_date: '2024-10-01'
  access_mode: public_html
  intended_use:
  - deepfake fraud organization-level prevalence
  - stress-frequency bridge
  usage_notes: 'Use as an organization-level deepfake-fraud prevalence source (Regula 2024 reports 92%
    of businesses experienced financial loss due to a deepfake, and about 50% and 49% experienced video
    and audio deepfakes). Vendor survey (identity-verification vendor), lower trust; fast-rising and volatile;
    "experienced a deepfake" is broad. Preserve these limitations.

    '
  url_stability: dated
- id: gartner_deepfake_attack_survey_2025
  title: Gartner deepfake attack survey (September 2025)
  publisher: Gartner (reported via Adaptive Security)
  source_type: analyst_survey
  url: https://www.adaptivesecurity.com/blog/deepfake-statistics-2026-the-data-security-leaders-need-to-know
  publication_date: '2025-09-01'
  access_mode: public_html
  intended_use:
  - deepfake attack organization-level prevalence
  - likely-frequency bridge
  usage_notes: 'Use as an organization-level deepfake-attack prevalence source (Gartner September 2025:
    62% of organizations experienced a deepfake attack in the prior 12 months). Analyst survey; measures
    attacks/attempts, not confirmed loss events; fast-rising. Figure accessed via secondary reporting.

    '
  url_stability: dated
- id: deepfake_business_impact_2024
  title: Deepfake business fraud impact statistics 2024
  publisher: Security.org (compilation of 2024 deepfake survey data)
  source_type: industry_survey
  url: https://www.security.org/resources/deepfake-statistics/
  publication_date: '2025-01-01'
  access_mode: public_html
  intended_use:
  - deepfake fraud average loss
  - early prevalence baseline
  usage_notes: 'Use as a compiled 2024 deepfake business-fraud statistics source for the prevalence
    floor only (more than 10% of companies experienced deepfake fraud attempts in 2024 - verified in
    the artifact). Secondary compilation of vendor survey data, lower trust; volatile and fast-rising.
    Preserve these limitations. Record review 2026-08-01: the USD 500,000 / 603,000 loss figures
    previously described here are absent from this page both today and in the snapshot taken on the
    extraction date; the loss record was reattributed to regula_deepfake_survey_2024, whose artifact
    states the figure it cites (~USD 450,000 average). This source now backs only the attempt-prevalence
    floor.

    '
  url_stability: rolling
- id: arup_deepfake_case_2024
  title: Arup Hong Kong deepfake CFO fraud case 2024
  publisher: CNN (reporting Hong Kong Police)
  source_type: news_report
  url: https://www.cnn.com/2024/02/04/asia/deepfake-cfo-scam-hong-kong-intl-hnk
  publication_date: '2024-02-04'
  access_mode: public_html
  intended_use:
  - documented deepfake fraud single-event loss
  - stress impact anchor
  usage_notes: 'Use as a documented deepfake-fraud single-event loss. A finance employee at engineering
    firm Arup made 15 transfers totaling about USD 25.6M after a video call in which a deepfake impersonated
    the CFO and colleagues (Hong Kong, early 2024); the funds remain unrecovered. One documented extreme
    case, not a mid-market average or a loss percentile.

    '
  url_stability: dated
- id: ico_self_reported_breach_cases_2024_25
  title: ICO self-reported personal data breach cases (2024/25)
  publisher: Information Commissioner's Office
