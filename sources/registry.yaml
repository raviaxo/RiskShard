  - id: abs_characteristics_australian_business_2025
    title: Characteristics of Australian Business, 2024-25 financial year
    publisher: Australian Bureau of Statistics
    source_type: official_statistical_data
    url: https://www.abs.gov.au/statistics/industry/technology-and-innovation/characteristics-australian-business/latest-release
    publication_date: "2026-06-25"
    access_mode: public_html
    intended_use:
      - Australian business cyber-incident prevalence
