    whose finance area received internal invoice emails with altered bank details
    "processed two payments within a few days - transferring $519,545 and then
    $2,148,938 to a Singaporean bank account", i.e. AUD 2,668,483 gross. It is ONE
    documented case reported by a law-enforcement agency, not a modeled loss percentile
    and not a distribution. The victim is described only as "an Australian business":
    sector and size are unknown, so any sector- or size-specific use is dilution and must
    say so. AUD 2.1 million of the AUD 2.6 million was recovered through AFP/Interpol/SPF
    interception, but recovery depends on same-week detection and is not guaranteed, so
    model the gross figure - the same idiom as the Coalition funds-transfer-fraud clawback
    case. The 2020/21 vintage predates current payment-verification controls.

    '
