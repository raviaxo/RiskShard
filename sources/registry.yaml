  - id: myob_business_monitor_cyber_2024
    title: MYOB mid-sized business cyber attack survey 2024
    publisher: MYOB (survey conducted by Dynata)
    source_type: industry_survey
    url: https://cfotech.com.au/story/cyber-attacks-impact-60-of-mid-sized-australian-businesses
    publication_date: "2024-06-01"
    access_mode: public_html
    intended_use:
      - Australian mid-sized business cyber-attack prevalence
      - sector stress-frequency bridge
    usage_notes: >
      Use as an Australian mid-sized business (20-500 FTE, revenue over AUD 5M)
      cyber-attack prevalence source. Survey by Dynata for MYOB, fieldwork 22
      March - 15 April 2024, n=593. Reports 60% of mid-sized businesses and 81%
      of finance and insurance mid-sized businesses experienced a cyber attack.
      Commercial vendor survey (lower trust than official statistics), all-cyber
      not BEC-specific. Figure accessed via CFOtech reporting of the MYOB survey.

  - id: cybersecurity_insiders_insider_threat_2024
    title: Cybersecurity Insiders 2024 Insider Threat Report
    publisher: Cybersecurity Insiders
    source_type: industry_survey
    url: https://www.cybersecurity-insiders.com/portfolio/2024-insider-threat-report/
    publication_date: "2024-06-01"
    access_mode: public_html
    intended_use:
      - organization-level insider attack prevalence
      - frequency bridge
    usage_notes: >
      Use as an organization-level insider-attack prevalence source. Reports that
      76% of organizations experienced insider attacks in 2024, up from 66% in
      2019. Vendor-sponsored survey (lower trust than official statistics);
      "insider attacks" is broad and includes negligent and careless insiders,
      not only deliberate misuse. Preserve these limitations when using it as a
      frequency bridge.

  - id: gurucul_insider_risk_report_2026
    title: Gurucul 2026 Insider Risk Report
    publisher: Cybersecurity Insiders (sponsored by Gurucul)
    source_type: industry_survey
    url: https://www.cybersecurity-insiders.com/inside-threats-how-ai-transformed-2026s-insider-risk-landscape/
    publication_date: "2026-03-19"
    access_mode: public_html
    intended_use:
      - organization-level insider incident prevalence
      - stress-frequency bridge
    usage_notes: >
      Use as an organization-level insider-incident prevalence source. Survey of
      725 IT and security professionals conducted in late 2025; reports that only
      10% of organizations had zero insider incidents in the past 12 months
      (i.e. 90% experienced at least one), up from 83% (17% zero) in 2024.
      Vendor-sponsored survey (lower trust than official statistics); "insider
      incidents" is broad and includes negligent insiders, not only deliberate
      misuse. Preserve these limitations when using it as a stress bridge.

  - id: bci_supply_chain_resilience_2024
    title: BCI Supply Chain Resilience Report 2024
    publisher: Business Continuity Institute
    source_type: industry_survey
    url: https://www.thebci.org/resource/bci-supply-chain-resilience-report-2024.html
    publication_date: "2024-11-01"
    access_mode: public_html
    intended_use:
      - organization-level supply-chain disruption prevalence
      - third-party disruption cause share
      - frequency bridge
    usage_notes: >
      Use as an organization-level supply-chain disruption prevalence source
      (~80% of organizations experienced a disruption in the past year; 43.6%
      cite third-party failure as the top cause). Broad supply-chain disruption
      (all causes), not third-party-only, and not sector- or size-specific.
      Preserve these limitations when using it as a third-party-outage frequency
      bridge.

  - id: interos_global_supply_chain_2022
    title: Interos Annual Global Supply Chain Report (Resilience 2022)
    publisher: Interos
    source_type: industry_survey
    url: https://www.interos.ai/resources/global-supply-chain-report
    publication_date: "2022-03-01"
    access_mode: public_html
    intended_use:
      - supply-chain disruption event frequency
      - stress-frequency basis
    usage_notes: >
      Use as supply-chain disruption event-frequency context (organizations
      faced on average three major supply-chain events in the last 12 months,
      costing an average of USD 182M). Vendor survey; all-cause supply-chain
      events, not third-party-only. Supports a near-ceiling stress frequency via
      an interpretive multi-event conversion, not a directly reported prevalence.

  - id: census_susb_2022
    title: Statistics of U.S. Businesses (SUSB) 2022 Annual Data
    publisher: U.S. Census Bureau
    source_type: official_statistical_data
    url: https://www.census.gov/data/tables/2022/econ/susb/2022-susb-annual.html
    publication_date: "2025-01-16"
    access_mode: public_html
    intended_use:
      - United States business population denominator
      - frequency normalization
    usage_notes: >
      Use as an official U.S. employer-firm-count denominator (2022 reference
      year, released January 2025). Authoritative national employer-firm counts
      range roughly 5.5M (Census Business Dynamics Statistics 2022) to 6.3M (SBA
      Office of Advocacy 2024) depending on program and vintage; the commonly
      cited total is ~6.1M. Preserve this range as a limitation, and note that
      it is an all-industry, all-size denominator, not financial-services or
      mid-market specific, when combining it with sector complaint counts.

  - id: afp_payments_fraud_2025
    title: 2025 AFP Payments Fraud and Control Survey Report
    publisher: Association for Financial Professionals
    source_type: industry_survey
    url: https://www.financialprofessionals.org/training-resources/resources/survey-research-economic-data/details/payments-fraud
    publication_date: "2025-08-26"
    access_mode: public_html
    intended_use:
      - United States organization-level BEC prevalence
      - payments fraud exposure context
      - frequency bridge
    usage_notes: >
      Use as a U.S. organization-level BEC and payments-fraud prevalence source.
      The survey measures organizations experiencing attempted or actual BEC, not
      confirmed financial-loss events; respondents skew toward corporate treasury
      and larger organizations (AFP reports 66% of BEC attempts target
      organizations with at least USD 1B in revenue), so it is not
      mid-market-specific. Preserve these limitations when using it as a
      frequency bridge.

