  - id: ibm_cost_data_breach_2025
    title: Cost of a Data Breach Report 2025
    publisher: IBM
    source_type: data_breach_cost_research
    url: https://www.ibm.com/reports/data-breach
    publication_date: "2025-07-30"
    access_mode: public_html
    intended_use:
      - data breach loss magnitude
      - global average breach cost
      - breach cost reduction context
    usage_notes: >
      Use as a data-breach-specific global loss benchmark. Preserve notes
      about geography, industry, and methodology limitations when applying it
      to local scenario ranges.

  - id: itpro_ibm_data_breach_regional_costs_2025
    title: AI breaches are not just a scare story any more - they are happening in real life
    publisher: ITPro
    source_type: secondary_news_report
    url: https://www.itpro.com/security/data-breaches/ai-breaches-arent-just-a-scare-story-any-more-theyre-happening-in-real-life
    publication_date: "2025-08-04"
    access_mode: public_html
    trust_tier: low
    refresh_interval_days: 180
    intended_use:
      - Canada data breach cost context
      - regional IBM breach cost summary
      - secondary validation target for primary-source replacement
    usage_notes: >
      Use only as a secondary, low-confidence regional cost bridge where the
      primary IBM Canada regional table is not available in the gathered public
      IBM page. Replace with primary IBM, insurer, regulator, or Canadian
      claims evidence before benchmark-grade claims.

  - id: ibm_canada_cost_data_breach_2025
    title: "IBM Report: Canadians' Data Security Under Increased Threat, While Breach Costs Surge"
    publisher: IBM
    source_type: data_breach_cost_research
    url: "https://canada.newsroom.ibm.com/2025-07-30-IBM-Report-Canadians-Data-Security-Under-Increased-Threat,-While-Breach-Costs-Surge"
    publication_date: "2025-07-30"
    access_mode: public_html
    trust_tier: high
    refresh_interval_days: 365
    intended_use:
      - Canada data breach loss magnitude
      - Canada average breach cost
      - Canada financial-sector breach cost context
    usage_notes: >
      Primary IBM Canada newsroom release for the 2025 Cost of a Data Breach
      report. Provides the Canada national average breach cost (CA$6.98M in
      2025, up from CA$6.32M in 2024) and a Canada financial-sector figure
      (CA$9.97M). The national average is all-sector and enterprise-weighted, so
      treat it as a Canada-specific likely-cost anchor with a mid-market
      applicability caveat, not a mid-market-specific loss table. It replaces the
      low-confidence ITPro secondary bridge for the Canada likely-impact anchor.

  - id: ibm_france_cost_data_breach_2025
    title: "Rapport IBM 2025 : coût d'une violation de données en France"
    publisher: IBM
    source_type: data_breach_cost_research
    url: "https://fr.newsroom.ibm.com/Rapport-IBM-13-des-organisations-ont-signale-des-violations-de-modeles-ou-dapplications-dIA,-dont-97-ont-declare-ne-pas-disposer-de-controles-dacces-a-lIA-appropries"
    publication_date: "2025-07-30"
    access_mode: public_html
    trust_tier: high
    refresh_interval_days: 365
    intended_use:
      - France data breach loss magnitude
      - France average breach cost
      - France financial-sector breach cost context
    usage_notes: >
      Primary IBM France newsroom release for the 2025 Cost of a Data Breach
      report. States the France national average breach cost (EUR 3.59M in
      2025, down ~7% from 2024) and a France financial-services sector figure
      (EUR 4.65M), based on 34 French organizations breached between March 2024
      and February 2025. The national average is all-sector and
      enterprise-weighted, so treat it as a France-specific likely-cost anchor
      with a mid-market applicability caveat, not a mid-market-specific loss
      table. It replaces the global IBM average bridge for the France
      likely-impact anchor. EUR values normalize to USD via the reviewed ECB
      EUR/USD assumption in calibrations/fx_rates.yaml.

  - id: eurostat_isoc_cisce_ic_2024
    title: "Eurostat ISOC_CISCE_IC - ICT security incidents by size class (France)"
    publisher: Eurostat
    source_type: official_statistics
    url: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/isoc_cisce_ic?format=JSON&lang=EN&geo=FR&indic_is=E_SEC2ICNF&unit=PC_ENT"
    publication_date: "2025-10-08"
    access_mode: public_html
    trust_tier: high
    refresh_interval_days: 365
    intended_use:
      - France data breach frequency by enterprise size class
      - France confidential-data disclosure prevalence
    usage_notes: >
      Official EU statistics. Indicator E_SEC2ICNF is the percentage of
      enterprises that experienced an ICT security incident leading to
      disclosure of confidential data (any cause). France 2024 values by size:
      10-49 = 1.98%, 50-249 = 3.83%, 250+ = 7.3%. CRITICAL CAVEAT: the survey
      population is "all activities except the financial sector"
      (nace_r2 = C10-S951_X_K), so this is a non-financial-sector proxy applied
      to a financial-services shard; financial services are typically more
      targeted, so it likely understates. It is also self-reported and narrower
      than "any cyberattack." Used for frequency min (small) and likely
      (medium); the JSON query returns the exact values in the gathered bytes.

  - id: cesin_barometre_cybersecurite_2025
    title: "CESIN 11e Barometre annuel de la cybersecurite des entreprises (2025)"
    publisher: CESIN
    source_type: industry_survey
    url: "https://cesin.fr/document.php?d=67974d0b010be"
    publication_date: "2026-01-28"
    access_mode: public_pdf
    trust_tier: medium
    refresh_interval_days: 365
    intended_use:
      - France significant-cyberattack prevalence
      - France data-theft consequence prevalence (stress frequency anchor)
    usage_notes: >
      CESIN 11th annual barometer, fielded by OpinionWay among ~397 French
      RSSI/CISO members (Nov-Dec 2025). Headline figures: 40% of surveyed firms
      suffered at least one significant cyberattack in 2025 (50% among large
      enterprises), and data theft was the leading technical consequence, cited
      by 52% of attacked firms. CAVEATS: the sample skews large (43% ETI, 40%
      large enterprises), it measures any significant cyberattack rather than
      data breach specifically, and the data-theft prevalence used as a stress
      anchor is derived (0.40 x 0.52 ~= 0.21). The CESIN primary is a PDF
      communique; the exact figures are byte-verifiable in named trade coverage
      (Le Monde Informatique, itforbusiness, Global Security Mag). Used only as
      an upper stress anchor for France frequency.max, never the central value.

  - id: asteres_cout_cyberattaques_france_2022
    title: "Asteres - Le cout des cyberattaques reussies en France (2022)"
    publisher: Asteres
    source_type: economic_impact_study
    url: "https://asteres.fr/site/wp-content/uploads/2023/06/ASTERES-CRIP-Cout-des-cyberattaques-reussies-16062023.pdf"
    publication_date: "2023-06-16"
    access_mode: public_pdf
    trust_tier: medium
    refresh_interval_days: 365
    intended_use:
      - France cyberattack cost floor
      - France economy-wide breach cost lower bound
    usage_notes: >
      Asteres economic study (for CRIP). Reports the average cost of a
      successful cyberattack in France at EUR 58,600 (direct cost EUR 25,600
      excluding ransom), and estimates the 2022 total cost at EUR 2bn. Used only
      as a conservative France-specific impact.min floor. CAVEATS: it is an
      economy-wide average across all organization sizes and all cyberattack
      types (not data-breach-specific or financial-services-specific), and an
      average rather than a true minimum quantile. EUR normalizes to USD via the
      reviewed ECB EUR/USD assumption. Figure verified in the gathered PDF text.

  - id: gdpr_article_83_administrative_fines
    title: "GDPR Article 83(5) maximum administrative fine (via CNIL)"
    publisher: CNIL
    source_type: regulatory_statute
    url: "https://www.cnil.fr/fr/cnil-direct/question/sanctions-quelles-sanctions-peuvent-etre-prononcees-par-la-cnil"
    publication_date: "2018-05-25"
    access_mode: public_html
    trust_tier: high
    refresh_interval_days: 730
    intended_use:
      - France data breach regulatory stress anchor
      - GDPR maximum administrative fine
    usage_notes: >
      CNIL statement of the GDPR Article 83(5) maximum administrative fine for
      the most serious breaches: EUR 20 million or 4% of worldwide annual
      turnover, whichever is higher (page states "20 millions" and "4 %"). For a
      mid-market firm the EUR 20M absolute cap is the binding ceiling, used as a
      France/EU regulatory impact.max stress anchor (mirrors the UK FCA-penalty
      and AU Privacy-Act-cap pattern). CAVEAT: a statutory maximum penalty cap,
      not a total event-loss estimate, expected loss, or claims severity. EUR
      normalizes to USD via the reviewed ECB EUR/USD assumption.

  - id: opc_annual_report_2025_2026
    title: 2025-2026 Annual Report to Parliament on the Privacy Act and PIPEDA
    publisher: Office of the Privacy Commissioner of Canada
    source_type: privacy_regulator_report
    url: https://www.priv.gc.ca/en/opc-actions-and-decisions/ar_index/202526/ar_202526/
