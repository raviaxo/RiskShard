sources:
  - id: verizon_dbir_2026
    title: 2026 Data Breach Investigations Report
    publisher: Verizon Business
    source_type: breach_report
    url: https://www.verizon.com/business/resources/T766/reports/2026-dbir-data-breach-investigations-report.pdf
    publication_date: "2026-05-20"
    access_mode: public_pdf
    intended_use:
      - threat patterns
      - breach vectors
      - ransomware prevalence
      - third-party involvement
    usage_notes: >
      Use as a threat-pattern and breach-vector source. DBIR is not a direct
      actuarial loss table and should not be treated as complete representation
      of all breaches.

  - id: verizon_dbir_2025
    title: 2025 Data Breach Investigations Report
    publisher: Verizon Business
    source_type: breach_report
    url: https://www.verizon.com/business/resources/Ta96/reports/2025-dbir-data-breach-investigations-report.pdf
    publication_date: "2025-04-23"
    access_mode: public_pdf
    intended_use:
      - threat patterns
      - breach vectors
      - third-party involvement
      - vulnerability exploitation
    usage_notes: >
      Use as a threat-pattern and breach-vector source. It supports likelihood
      and applicability reasoning more than direct financial impact modeling.

  - id: ibm_cost_data_breach_2025
    title: Cost of a Data Breach Report 2025
    publisher: IBM
    source_type: data_breach_cost_research
    url: https://www.ibm.com/reports/data-breach
    publication_date: "2025-07-30"
    access_mode: public_html
    intended_use:
      - data breach loss magnitude
      - global average breach cost
      - breach cost reduction context
    usage_notes: >
      Use as a data-breach-specific global loss benchmark. Preserve notes
      about geography, industry, and methodology limitations when applying it
      to local scenario ranges.

  - id: abs_counts_australian_businesses_2025
    title: Counts of Australian Businesses, including Entries and Exits, July 2021 - June 2025
    publisher: Australian Bureau of Statistics
    source_type: official_statistical_data
    url: https://www.abs.gov.au/statistics/economy/business-indicators/counts-australian-businesses-including-entries-and-exits/jul2021-jun2025
    publication_date: "2025-08-26"
    access_mode: public_html
    intended_use:
      - Australia business population denominator
      - industry denominator
      - frequency normalization
    usage_notes: >
      Use as an official Australian business-count denominator. Preserve
      limitations when combining it with incident, notification, or loss-event
      counts from other sources.

  - id: fbi_ic3_2025_report
    title: 2025 IC3 Annual Report
    publisher: Federal Bureau of Investigation Internet Crime Complaint Center
    source_type: law_enforcement_report
    url: https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf
    publication_date: "2026-04-16"
    access_mode: public_pdf
    intended_use:
      - BEC complaint counts
      - BEC adjusted losses
      - cyber-enabled fraud context
      - transaction-type context
    usage_notes: >
      Use as a law-enforcement complaint and adjusted-loss source for BEC.
      Preserve limitations about US reporting, self-selection, and complaint
      averages when applying it to non-US scenarios.

  - id: accc_targeting_scams_2025
    title: Targeting Scams Report 2025
    publisher: Australian Competition and Consumer Commission National Anti-Scam Centre
    source_type: scam_report
    url: https://www.accc.gov.au/system/files/targeting-scams-report-2025.pdf
    publication_date: "2026-03-30"
    access_mode: public_pdf
    intended_use:
      - Australia scam context
      - small business false billing losses
      - payment redirection context
      - BEC local applicability
    usage_notes: >
      Use as Australia-specific scam context. Treat Scamwatch small-business
      reports as partial reporting evidence, not complete organization-level
      BEC frequency.

  - id: cyentia_iris_2025
    title: Information Risk Insights Study 2025
    publisher: Cyentia Institute
    source_type: cyber_loss_research
    url: https://www.cyentia.com/publication/iris2025/
    publication_date: "2025-06-10"
    access_mode: public_html
    intended_use:
      - incident frequency
      - loss magnitude
      - tail loss
      - organization size modifiers
    usage_notes: >
      Use as a quantitative cyber loss and frequency source. Preserve notes
      about public-record bias and applicability when deriving benchmarks.
      The source page links to the full PDF, but the automated gatherer stores
      the public page when direct PDF access is unavailable from the runtime.

  - id: cyentia_iris_2022
    title: Information Risk Insights Study 2022
    publisher: Cyentia Institute
    source_type: cyber_loss_research
    url: https://www.cyentia.com/publication/iris-2022/
    publication_date: "2022-01-01"
    access_mode: public_html
    intended_use:
      - incident frequency
      - loss magnitude
      - tail loss
      - sector modifiers
    usage_notes: >
      Use as a historical quantitative cyber loss source and method reference.

  - id: cyentia_iris_ransomware
    title: IRIS Ransomware
    publisher: Cyentia Institute
    source_type: ransomware_research
    url: https://www.cyentia.com/publication/iris-ransomware/
    publication_date: "2025-04-21"
    access_mode: public_html
    intended_use:
      - ransomware frequency
      - ransomware sector applicability
      - ransomware loss contribution
    usage_notes: >
      Use as a ransomware-specific source. If a direct PDF is later available,
      add it as a separate registry entry.

  - id: asd_annual_cyber_threat_report_2024_2025
    title: Annual Cyber Threat Report 2024-2025
    publisher: Australian Signals Directorate
    source_type: government_report
    url: https://www.cyber.gov.au/about-us/view-all-content/reports-and-statistics/annual-cyber-threat-report-2024-2025
    fallback_urls:
      - https://www.cyber.gov.au/sites/default/files/2025-10/Annual%20Cyber%20Threat%20Report%202024-25.pdf
    publication_date: "2025-10-14"
    access_mode: public_html
    intended_use:
      - Australia context
      - SME cybercrime cost
      - local threat environment
    usage_notes: >
      Use for Australia-specific context and local cybercrime cost anchors.

  - id: oaic_ndb_jul_dec_2024
    title: Notifiable Data Breaches Report July to December 2024
    publisher: Office of the Australian Information Commissioner
    source_type: regulator_report
    url: https://www.oaic.gov.au/__data/assets/pdf_file/0021/251184/Notifiable-data-breaches-report-July-to-December-2024.pdf
    publication_date: "2025-05-13"
    access_mode: public_pdf
    intended_use:
      - Australia sector breach reporting
      - finance sector applicability
      - privacy breach patterns
    usage_notes: >
      Use for Australian notifiable data breach patterns and sector relevance.

  - id: apra_cps_230
    title: CPS 230 Operational Risk Management
    publisher: Australian Prudential Regulation Authority
    source_type: regulator_standard
    url: https://handbook.apra.gov.au/standard/cps-230
    publication_date: "2025-07-01"
    access_mode: public_html
    intended_use:
      - Australia financial services regulatory intensity
      - operational risk context
      - business continuity context
    usage_notes: >
      Use to support regulatory-context assumptions for APRA-regulated
      financial-services organizations.

  - id: sophos_state_ransomware_financial_services_2024
    title: State of Ransomware in Financial Services 2024
    publisher: Sophos
    source_type: industry_survey
    url: https://www.sophos.com/en-us/blog/the-state-of-ransomware-in-financial-services-2024
    publication_date: "2024-06-24"
    access_mode: public_html
    intended_use:
      - ransomware frequency
      - ransomware recovery cost
      - financial services context
    usage_notes: >
      Use as a survey-based ransomware benchmark. Preserve survey-bias and
      geography limitations in evidence records.
