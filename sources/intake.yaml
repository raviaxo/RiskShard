# could carry a number. That is a judgement about SCOPE, never about content: a high
# score means "read this early", not "this source is good".
#
# `score` is computed by engine/intake.py against the portfolio's own measured gaps —
# sector is weighted above country because sector is bridged 49 times and country 15.
# It is regenerated, not hand-set. `status` is the human decision:
#   unassessed  - catalogued, not yet triaged by a person
#   queued      - accepted for reading, in priority order
#   parked      - out of scope for the current cells; revisit only if the cells change
