id: fr_finance_data_breach_midmarket
title: France Finance Data Breach Midmarket
version: "0.1"
status: governed_starter
threat: data_breach
description: >
  Data-breach shard for a France mid-market financial-services organization
  with all six direct parameters source-backed by France/EU anchors: Eurostat
  France small/medium/large disclosure rates for frequency, and Asteres (floor),
  primary IBM France 2025 (likely), and the GDPR Article 83(5) statutory cap
  (max) for impact, all EUR anchors converted to USD. Remaining bridges kept
  explicit for contributors: the Eurostat frequency series excludes the
  financial sector, the Asteres floor is an economy-wide all-cyber average, and
  the GDPR max is a statutory cap rather than a loss distribution.
context:
  industry: financial_services
  country: FR
  company_size: mid_market
artifacts:
  scenario: scenarios/fr_finance_data_breach_midmarket.yaml
  org_profile: org_profiles/fr_finance_midmarket.yaml
  calibration: calibrations/fr_finance_data_breach.yaml
  evidence:
    - evidence/fr_finance_data_breach.yaml
  extractions:
    - extractions/fr_finance_data_breach_reviewed.yaml
  controls: []
required_parameters:
  - frequency.min
  - frequency.likely
  - frequency.max
  - impact.min
  - impact.likely
  - impact.max
tags:
  - fr
  - france
  - financial_services
  - mid_market
  - data_breach
  - privacy_breach
practitioner_notes:
  good_for: Running a transparent France finance data-breach scenario with all six parameters source-backed by France/EU anchors, and as a contribution-workflow reference for an automated benchmark-review candidate.
  not_good_for: France financial-services benchmark-grade claims until a financial-sector-specific frequency source replaces the Eurostat non-financial proxy and France-specific breach-cost floor/tail evidence replaces the Asteres all-cyber average and the GDPR statutory-cap stress anchor.
