  org_profile: org_profiles/ca_finance_midmarket.yaml
  calibration: calibrations/ca_finance_data_breach.yaml
  evidence:
    - evidence/ca_finance_data_breach.yaml
  extractions:
    - extractions/ca_finance_data_breach_reviewed.yaml
  controls: []
required_parameters:
  - frequency.min
  - frequency.likely
  - frequency.max
  - impact.min
  - impact.likely
  - impact.max
tags:
  - ca
  - canada
  - financial_services
  - mid_market
  - data_breach
practitioner_notes:
  good_for: Canada launch-target workflow testing, contribution planning, and running an explicit low-confidence CAD starter scenario with Canadian prevalence anchors.
  not_good_for: Benchmark-grade Canada tail likelihood, primary-source Canada breach-cost claims, or financial-services-specific Canadian cost claims.
