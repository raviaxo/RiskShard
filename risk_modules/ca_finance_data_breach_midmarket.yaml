id: ca_finance_data_breach_midmarket
title: Canada Finance Data Breach Midmarket
version: "0.1"
status: governed_starter
threat: data_breach
description: >
  Starter data-breach shard for a Canadian mid-market financial-services
  organization. It is useful as a contribution target and runnable example, but
  it is not benchmark-grade: frequency.max remains estimated, impact.min/max
  still use global anchors converted to CAD, and impact.likely relies on a
  secondary Canada-specific IBM-cost bridge that needs primary-source review.
context:
  industry: financial_services
  country: CA
  company_size: mid_market
artifacts:
