practitioner_notes:
  good_for: An Australian ransomware shard whose frequency and typical-loss anchors are Australian survey readings and whose stress loss is a documented ASX-disclosed event, with every remaining bridge named per record.
  not_good_for: Treating the all-sector Australian readings as financial-services rates, the stress frequency as a true tail percentile, or the Latitude enterprise extortion loss as a plausible mid-market ransomware outcome.
