id: au_finance_ransomware_midmarket
title: Australia Finance Ransomware Midmarket
version: "0.3"
status: governed_starter
threat: ransomware
description: >
  Governed-starter ransomware shard for an Australian mid-market
  financial-services organization. All six direct calibration parameters are
  source-backed and five of six are Australia-resident (Sophos Australian
  survey readings, a documented Latitude loss), but the Australian anchors are
  all-sector, so the shard no longer clears the automated benchmark gate's
  industry-relevance minimum - it deliberately traded sector-resident global
  evidence for country-resident evidence (2026-08-02) and is labeled down
  accordingly rather than over-claiming.
