<style>
  @font-face{font-family:"Plex Mono";src:url("../fonts/plex-mono-400.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Plex Mono";src:url("../fonts/plex-mono-500.woff2") format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:"Plex Mono";src:url("../fonts/plex-mono-600.woff2") format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"Plex Mono";src:url("../fonts/plex-mono-700.woff2") format("woff2");font-weight:700;font-display:swap}

  /* Same sheet as the explorer and the audit. A filing is printed on white. */
  :root{
    --ink:#111111; --grey:#555555; --faint:#8a8a8a;
    --rule:#111111; --hair:#cfcfcf;
    --link:#0b31a5; --flag:#a11212;
    --mono:"Plex Mono",ui-monospace,"Courier New",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{background:#fff;color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.55;
    padding:26px 20px 60px}
  .wrap{max-width:74ch;margin:0 auto}
  .filehead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;
    border-top:2px solid var(--rule);border-bottom:1px solid var(--rule);padding:7px 0;
    font-size:11px;text-transform:uppercase;letter-spacing:.07em}
  .filehead b{font-weight:700;letter-spacing:.12em}
  .filemeta{color:var(--grey);text-align:right}
  h1{font-size:clamp(16px,2.2vw,20px);font-weight:700;line-height:1.3;margin:22px 0 4px}
  h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
    margin:26px 0 8px;padding-top:8px;border-top:1px solid var(--hair)}
  p{margin:9px 0;max-width:74ch}
  ul{margin:9px 0 9px 18px}
  li{margin:4px 0}
  code{background:#f4f4f4;padding:0 3px}
  b{font-weight:600}
  hr{border:0;border-top:1px solid var(--hair);margin:22px 0 10px}
  .tblwrap{overflow-x:auto;margin:12px 0}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--grey);border-bottom:1px solid var(--rule);padding:5px 8px 5px 0}
  td{padding:5px 8px 5px 0;border-bottom:1px solid var(--hair);vertical-align:top}
  a{color:var(--link)}
  .navline{margin:14px 0 0;font-size:12px;color:var(--grey)}
  .foot{margin-top:34px;padding-top:8px;border-top:2px solid var(--rule);
    font-size:11px;color:var(--faint);display:flex;justify-content:space-between;gap:12px}
  @media print{body{padding:0}.navline{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="filehead">
    <b>RISKSHARD</b>
    <span class="filemeta">Executive summary · __RS_RELEASE__</span>
  </div>

__RS_BODY__

  <p class="navline">__RS_NAV__</p>

  <div class="foot">
    <span>__RS_SHARD__</span>
    <span><a href="__RS_SITE__">raviaxo.github.io/RiskShard</a></span>
  </div>
</div>
</body>
</html>
