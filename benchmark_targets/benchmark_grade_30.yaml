program:
  id: benchmark_grade_30
  title: Benchmark-Grade 30 Shard Program
  version: "0.1"
  target_count: 30
  updated: "2026-06-15"
  purpose: >
    Build thirty globally useful, evidence-backed risk shards that can earn a
    benchmark-ready status through explicit source, extraction, evidence, and
    calibration gates. Targets are not benchmark-grade until the automated gate
    and human review both pass.
criteria:
  benchmark_ready_requires:
    - runnable_risk_module
    - all_six_calibration_parameters_selected
    - all_selected_parameters_source_backed
    - selected_parameter_confidence_medium_or_high
    - selected_sources_current
    - selected_evidence_mapped_to_reviewed_extractions
    - at_least_two_independent_selected_sources
    - country_relevance_for_at_least_three_selected_parameters
    - industry_relevance_for_at_least_two_selected_parameters
  direct_parameters:
    - frequency.min
    - frequency.likely
    - frequency.max
    - impact.min
    - impact.likely
    - impact.max
targets:
  - priority: 1
    id: us_finance_bec_midmarket
    module_id: us_finance_bec_midmarket
    wave: launch
    context: {country: US, industry: financial_services, company_size: mid_market, threat: business_email_compromise}
    rationale: Large market with strong law-enforcement, regulator, fraud, and financial-sector source availability.

  - priority: 2
